<style>
:root{
  --bg:#0d0e10; --surface:rgba(32,32,32,.86); --raised:#383836;

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}

.panel{position:fixed;z-index:10;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:12px;padding:12px}
.panel h4{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

#dock{top:16px;left:16px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}

.grp{display:flex;flex-direction:column;gap:6px}
.btn{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  font-size:13px;font-family:inherit;padding:0 12px;height:34px;border-radius:8px;cursor:pointer;text-align:left;width:188px;
  transition:background .14s,border-color .14s}
.btn:hover{background:var(--raised)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn .ico{width:16px;text-align:center;opacity:.85;flex:none;font-size:13px}
.btn.on{background:var(--accent-soft);border-color:rgba(94,159,232,.55);color:#cfe3fa}
.btn.primary{background:rgba(114,188,143,.14);border-color:rgba(114,188,143,.4)}
.btn.primary.on{background:rgba(255,214,140,.22);border-color:rgba(255,214,140,.65);color:#ffe9bd}

.seg{display:flex;gap:4px;width:188px}
.seg button{flex:1;height:30px;font-size:12px;font-family:inherit;background:rgba(255,255,255,.05);border:1px solid var(--border);
  color:var(--text2);border-radius:7px;cursor:pointer;transition:background .14s}
.seg button:hover{background:var(--raised)}
.seg button.on{background:var(--accent-soft);border-color:rgba(94,159,232,.55);color:#cfe3fa}

#tuner{bottom:16px;left:16px;width:264px}
#tuner.hide{display:none}
.row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.row:last-child{margin-bottom:0}
.row label{font-size:12px;color:var(--text2);width:88px;flex:none}
.row input[type=range]{flex:1;accent-color:var(--accent);height:18px;min-width:0}
.row .val{font-size:11px;color:var(--text);font-family:Menlo,Consolas,monospace;width:44px;text-align:right;flex:none}
.sep{height:1px;background:var(--border);margin:11px -12px}

#stats{top:16px;right:16px;font-family:Menlo,Consolas,monospace;font-size:11.5px;color:var(--text2);line-height:1.75;min-width:206px}
#stats b{color:var(--text);font-family:system-ui,sans-serif;font-size:12.5px;letter-spacing:.02em}
#stats .v{color:var(--text);float:right}
#stats .ok{color:var(--green)}
#stats .err{color:var(--red)}

#hint{position:fixed;bottom:16px;right:16px;z-index:10;color:rgba(255,255,255,.42);font-size:11.5px;text-align:right;pointer-events:none;line-height:1.85}
#hint kbd{font-family:Menlo,Consolas,monospace;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10.5px;color:var(--text2)}

@media (max-width:900px){
  #tuner{display:none}
  #stats{display:none}
  .btn,.seg{width:152px}
}
@media (prefers-reduced-motion:reduce){#loading .bar i{animation:none;width:100%}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =======================================================================
   ТАКТИЧЕСКИЙ ФОНАРЬ-ОБВЕС (weapon light)  —  модуль для игры
   =======================================================================
   API:
     const light = buildFlashlight(THREE, opts)      -> THREE.Group
     light.setOn(bool) / light.toggle() / light.setMode('off'|'low'|'high'|'strobe')
     light.update(dt, camera)                        <- вызывать каждый кадр
     light.setBeamQuality('low'|'medium'|'high'|'off')
     light.setDepthTexture(tex, camera)              <- мягкое слияние луча с геометрией
     light.setScreenSize(w, h)
     light.nodes / light.parts / light.lights
     light.dispose()
   ======================================================================= */

// ===================== ПРОЦЕДУРНЫЕ ТЕКСТУРЫ ==========================
const TexCache = {};

function canvasOf(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/** height-field -> tangent-space normal map (бесшовная плитка) */
function normalFromHeight(size, heightFn, strength) {
  const H = new Float32Array(size * size);
  for (let y = 0; y < size; y++)
    for (let x = 0; x < size; x++)
      H[y * size + x] = heightFn(x / size, y / size, x, y);

  const c = canvasOf(size, size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const at = (x, y) => H[((y % size) + size) % size * size + (((x % size) + size) % size)];

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = (at(x + 1, y) - at(x - 1, y)) * strength;
      const dy = (at(x, y + 1) - at(x, y - 1)) * strength;
      let nx = -dx, ny = dy, nz = 1;
      const l = Math.hypot(nx, ny, nz);
      const i = (y * size + x) * 4;
      img.data[i]     = (nx / l * 0.5 + 0.5) * 255;
      img.data[i + 1] = (ny / l * 0.5 + 0.5) * 255;
      img.data[i + 2] = (nz / l * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

function grayTexture(size, fn) {
  const c = canvasOf(size, size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const v = Math.max(0, Math.min(1, fn(x / size, y / size))) * 255;
      const i = (y * size + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// бесшовный value-noise на торе
function tileNoise(gridN, seed) {
  const g = new Float32Array(gridN * gridN);
  let s = seed || 1;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  const sm = t => t * t * (3 - 2 * t);
  return (u, v) => {
    const x = u * gridN, y = v * gridN;
    const xi = Math.floor(x), yi = Math.floor(y);
    const fx = sm(x - xi), fy = sm(y - yi);
    const G = (a, b) => g[((b % gridN) + gridN) % gridN * gridN + (((a % gridN) + gridN) % gridN)];
    return (G(xi, yi) * (1 - fx) + G(xi + 1, yi) * fx) * (1 - fy)
         + (G(xi, yi + 1) * (1 - fx) + G(xi + 1, yi + 1) * fx) * fy;
  };
}

function mkTex(THREE, canvas, repX, repY, srgb) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX, repY);
  t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/** алмазная накатка (knurling) */
function knurlNormal(THREE) {
  if (!TexCache.knurl) {
    const N = 14;
    const cv = normalFromHeight(256, (u, v) => {
      const d = 0.5 + 0.25 * (Math.cos(2 * Math.PI * N * (u + v)) + Math.cos(2 * Math.PI * N * (u - v)));
      return Math.pow(d, 1.35);
    }, 9.0);
    TexCache.knurl = cv;
  }
  return mkTex(THREE, TexCache.knurl, 6, 1);
}

/** микрорельеф анодирования (bead-blast) */
function anodizeNormal(THREE) {
  if (!TexCache.anod) {
    const n1 = tileNoise(64, 7), n2 = tileNoise(128, 19);
    TexCache.anod = normalFromHeight(256, (u, v) => 0.6 * n1(u, v) + 0.4 * n2(u, v), 1.1);
  }
  return mkTex(THREE, TexCache.anod, 4, 4);
}
function anodizeRough(THREE) {
  if (!TexCache.anodR) {
    const n = tileNoise(48, 33);
    TexCache.anodR = grayTexture(256, (u, v) => 0.62 + 0.3 * n(u, v));
  }
  return mkTex(THREE, TexCache.anodR, 4, 4);
}

/** «апельсиновая корка» рефлектора — даёт мягкий ровный hotspot */
function orangePeelNormal(THREE) {
  if (!TexCache.peel) {
    const n = tileNoise(26, 91);
    TexCache.peel = normalFromHeight(256, (u, v) => n(u, v), 2.4);
  }
  return mkTex(THREE, TexCache.peel, 3, 3);
}

/** гравировка на корпусе (текст идёт вдоль оси фонаря) */
function engravingMaps(THREE) {
  const W = 192, H = 640;
  const c = canvasOf(W, H);
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.save();
  g.translate(W / 2, H / 2);
  g.rotate(Math.PI / 2);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#fff';
  g.font = 'bold 54px Arial, sans-serif';
  g.fillText('AXIOM  TL-6', 0, -34);
  g.font = '30px Arial, sans-serif';
  g.fillText('1200 LUMENS · IPX7', 0, 18);
  g.font = '22px Arial, sans-serif';
  g.fillText('MADE FOR RAIL', 0, 56);
  g.restore();

  const src = g.getImageData(0, 0, W, H).data;
  const hf = (u, v, x, y) => 1 - src[(y * W + x) * 4] / 255;   // текст = углубление
  const nrmCanvas = canvasOf(W, H);
  {
    const nctx = nrmCanvas.getContext('2d');
    const img = nctx.createImageData(W, H);
    const at = (x, y) => hf(0, 0, Math.max(0, Math.min(W - 1, x)), Math.max(0, Math.min(H - 1, y)));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dx = (at(x + 1, y) - at(x - 1, y)) * 3.2;
      const dy = (at(x, y + 1) - at(x, y - 1)) * 3.2;
      let nx = -dx, ny = dy, nz = 1;
      const l = Math.hypot(nx, ny, nz), i = (y * W + x) * 4;
      img.data[i] = (nx / l * .5 + .5) * 255;
      img.data[i + 1] = (ny / l * .5 + .5) * 255;
      img.data[i + 2] = (nz / l * .5 + .5) * 255;
      img.data[i + 3] = 255;
    }
    nctx.putImageData(img, 0, 0);
  }
  const alpha = canvasOf(W, H);
  {
    const actx = alpha.getContext('2d');
    actx.drawImage(c, 0, 0);
    const im = actx.getImageData(0, 0, W, H);
    for (let i = 0; i < im.data.length; i += 4) {
      const a = im.data[i];
      im.data[i] = im.data[i + 1] = im.data[i + 2] = 150;
      im.data[i + 3] = a;
    }
    actx.putImageData(im, 0, 0);
  }
  const nt = new THREE.CanvasTexture(nrmCanvas);
  const ct = new THREE.CanvasTexture(alpha);
  ct.colorSpace = THREE.SRGBColorSpace;
  nt.anisotropy = ct.anisotropy = 8;
  return { normal: nt, color: ct };
}

/** радиальный glare со штрихами — блик в линзе */
function glareTexture(THREE) {
  const S = 256, c = canvasOf(S, S), g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
  g.globalCompositeOperation = 'lighter';
  const cx = S / 2;
  let rg = g.createRadialGradient(cx, cx, 0, cx, cx, S * 0.5);
  rg.addColorStop(0.00, 'rgba(255,255,255,1)');
  rg.addColorStop(0.06, 'rgba(255,250,235,0.92)');
  rg.addColorStop(0.18, 'rgba(255,236,196,0.34)');
  rg.addColorStop(0.42, 'rgba(190,215,255,0.10)');
  rg.addColorStop(1.00, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 6; i++) {
    g.save(); g.translate(cx, cx); g.rotate(i * Math.PI / 6);
    const lg = g.createLinearGradient(-S * .5, 0, S * .5, 0);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(.5, 'rgba(255,245,225,.30)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lg;
    g.fillRect(-S * .5, -1.6, S, 3.2);
    g.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/** мягкий диск — свечение торца линзы */
function lensGlowTexture(THREE) {
  const S = 128, c = canvasOf(S, S), g = c.getContext('2d');
  const rg = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  rg.addColorStop(0.0, 'rgba(255,255,255,1)');
  rg.addColorStop(0.30, 'rgba(255,247,228,0.85)');
  rg.addColorStop(0.62, 'rgba(255,228,180,0.28)');
  rg.addColorStop(1.0, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ===================== МОДЕЛЬ: НАЧАЛО ==================================
/*
  buildFlashlight(THREE, opts) -> THREE.Group
  Тактический подствольный фонарь класса «scout light».
  Единицы: метры.  Оси: −Z вперёд, +Y вверх, +X вправо.
  Origin: центр нижней плоскости крепления = верхняя плоскость планки Пикатинни.

  Габариты (мм):
    общая длина 147 · корпус ø25,4 · голова ø32 · безель ø32,8
    ось над планкой 30 · рефлектор ø25,8 глубина 21,6

  Станции «s» отсчитываются от торца хвостовика (s=0) к дульному срезу.
*/
function buildFlashlight(THREE, opts = {}) {
  const O = Object.assign({
    segments: 48,
    detail: true,
    rail: true,
    beam: true,
    beamLength: 20,
    beamSteps: 32,
    beamNoise: true,
    hotAngle: 0.125,      // рад, половина угла hotspot
    spillAngle: 0.40,     // рад, половина угла засветки
    color: 0xfff1dc,
    intensity: 1.0,
    shadows: true
  }, opts);

  const mm = x => x / 1000;
  const SEG = O.segments;
  const S_MOUNT = 58;                      // станция центра кронштейна
  const Y = mm(30);                        // высота о��������тической оси над планкой
  const zz = s => mm(S_MOUNT - s);         // станция -> мировой Z

  const S_LENS = 142.2, S_RIM = 141.6, S_VERT = 120.0, R_RIM = 12.9;
  const F_FOCUS = (R_RIM * R_RIM) / (4 * (S_RIM - S_VERT));   // ≈ 1.93 мм
  const S_LED = S_VERT + F_FOCUS;

  const group = new THREE.Group();
  group.name = 'WeaponLight_TL6';

  // ── МАТЕРИАЛЫ ───────────────────────────────────────
  const anodN = O.detail ? anodizeNormal(THREE) : null;
  const anodR = O.detail ? anodizeRough(THREE) : null;

  const mBody = new THREE.MeshStandardMaterial({
    name: 'anodized_black', color: 0x34383d, metalness: 0.85, roughness: 0.52,
    normalMap: anodN, roughnessMap: anodR
  });
  if (anodN) mBody.normalScale.set(0.35, 0.35);

  const mBodyKnurl = mBody.clone();
  mBodyKnurl.name = 'anodized_knurl';
  if (O.detail) {
    mBodyKnurl.normalMap = knurlNormal(THREE);
    mBodyKnurl.normalScale.set(1.0, 1.0);
    mBodyKnurl.roughnessMap = null;
    mBodyKnurl.roughness = 0.62;
  }

  const mHead = new THREE.MeshStandardMaterial({
    name: 'anodized_head', color: 0x2e3237, metalness: 0.88, roughness: 0.44,
    normalMap: anodN, roughnessMap: anodR
  });
  if (anodN) mHead.normalScale.set(0.3, 0.3);

  const mSteel = new THREE.MeshStandardMaterial({ name: 'steel', color: 0x9aa0a6, metalness: 1.0, roughness: 0.34 });
  const mDark  = new THREE.MeshStandardMaterial({ name: 'dark_parts', color: 0x17191c, metalness: 0.55, roughness: 0.68 });
  const mRubber= new THREE.MeshStandardMaterial({ name: 'rubber', color: 0x121417, metalness: 0.0, roughness: 0.94 });
  const mRefl  = new THREE.MeshStandardMaterial({
    name: 'reflector', color: 0xf2f5f8, metalness: 1.0, roughness: 0.085,
    normalMap: O.detail ? orangePeelNormal(THREE) : null,
    side: THREE.DoubleSide, emissive: 0x000000
  });
  if (O.detail) mRefl.normalScale.set(0.16, 0.16);

  const mLens = new THREE.MeshPhysicalMaterial({
    name: 'lens', color: 0x8fb4d8, metalness: 0.0, roughness: 0.03,
    transparent: true, opacity: 0.17, clearcoat: 1.0, clearcoatRoughness: 0.02,
    side: THREE.DoubleSide, emissive: 0x000000, depthWrite: false
  });
  const mLED = new THREE.MeshStandardMaterial({
    name: 'led_die', color: 0xf2ead4, metalness: 0.0, roughness: 0.5,
    emissive: new THREE.Color(0x000000), emissiveIntensity: 1
  });
  const mPCB = new THREE.MeshStandardMaterial({ name: 'pcb', color: 0xcdd3d8, metalness: 0.3, roughness: 0.7 });
  const mRail = new THREE.MeshStandardMaterial({ name: 'rail', color: 0x26292d, metalness: 0.9, roughness: 0.42 });

  const allMaterials = [mBody, mBodyKnurl, mHead, mSteel, mDark, mRubber, mRefl, mLens, mLED, mPCB, mRail];

  // ── ХЕЛПЕРЫ ────────────────────────────────────────
  const geoms = [];
  const track = g => { geoms.push(g); return g; };

  /** тело вращения по профилю [[s,r],…]  (s в мм, r в мм) */
  function lathe(profile, material, segments) {
    const s0 = profile[0][0];
    const pts = profile.map(([s, r]) => new THREE.Vector2(mm(r), mm(s - s0)));
    const g = track(new THREE.LatheGeometry(pts, segments || SEG));
    const m = new THREE.Mesh(g, material);
    m.rotation.x = -Math.PI / 2;             // локальный +Y  ->  мировой −Z (вперёд)
    m.position.set(0, Y, zz(s0));
    m.castShadow = m.receiveShadow = true;
    return m;
  }

  /** кольцевой сектор, выдавленный вдоль оси */
  function sector(r0, r1, a0, a1, sFrom, sTo, material) {
    const sh = new THREE.Shape();
    sh.absarc(0, 0, mm(r1), a0, a1, false);
    sh.absarc(0, 0, mm(r0), a1, a0, true);
    sh.closePath();
    const g = track(new THREE.ExtrudeGeometry(sh, {
      depth: mm(sTo - sFrom), bevelEnabled: true, curveSegments: 10,
      bevelThickness: mm(0.25), bevelSize: mm(0.25), bevelSegments: 2

    const m = new THREE.Mesh(g, material);
    m.position.set(0, Y, zz(sTo));           // экструзия идёт в +Z (назад)
    m.castShadow = m.receiveShadow = true;
    return m;
  }

  /** профиль в плоскости XY, выдавленный вдоль Z */

    const sh = new THREE.Shape();
    points.forEach(([x, y], i) => i ? sh.lineTo(mm(x), mm(y)) : sh.moveTo(mm(x), mm(y)));
    sh.closePath();
    const b = bevel === undefined ? 0.4 : bevel;
    const g = track(new THREE.ExtrudeGeometry(sh, {
      depth: mm(sTo - sFrom), bevelEnabled: b > 0, curveSegments: 6,
      bevelThickness: mm(b), bevelSize: mm(b), bevelSegments: 2
    }));
    const m = new THREE.Mesh(g, material);
    m.position.set(0, 0, zz(sTo));
    m.castShadow = m.receiveShadow = true;
    return m;
  }

  const cyl = (r, len, material, seg) => {

  // ══ 1. ХВОСТОВИК (откручивается) ═════════════════════════

  // ══ 5. ФРАГМЕНТ ПЛАНКИ (контекст оружия, можно отключить) ════

  // ══ 6. NODES ═════════════════════════════════════════
  const mkNode = (name, x, y, z) => {

  // ══ 7. СВЕТОВАЯ СИСТЕМА ═════════════════════════════
  // Ось луча = −Z в системе rig'а. Две доли: узкий hotspot + широкая засветка,
  // как у реального рефлекторного фонаря.
  const rig = new THREE.Group();
  rig.name = 'lightRig';
  rig.position.set(0, Y, zz(S_LENS + 1.5));
  group.add(rig);

  const target = new THREE.Object3D();
  target.position.set(0, 0, -10);
  rig.add(target);

  const beamColor = new THREE.Color(O.color);

  const spotHot = new THREE.SpotLight(beamColor.getHex(), 0, 0, O.hotAngle, 0.42, 2);
  spotHot.name = 'spotHot';
  spotHot.target = target;
  spotHot.castShadow = !!O.shadows;

  bounce.name = 'lensBounce';
  bounce.position.set(0, 0, -0.35);
  rig.add(bounce);

  // ── Объёмный луч: ray-marching рассеяния в конусе ─────���──────────
  const BEAM_VS = /* glsl */`
    varying vec3 vWorld;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `;

  const BEAM_FS = /* glsl */`
    precision highp float;
    uniform vec3  uOrigin;
    uniform vec3  uDir;
    uniform vec3  uColor;
    uniform float uIntensity;
    uniform float uLength;
    uniform float uCosHotIn,  uCosHotOut;
    uniform float uCosSpillIn, uCosSpillOut;
    uniform float uHotW, uSpillW;
    uniform float uDensity, uExtinction, uG, uNoiseAmt, uTime;
    uniform vec2  uRes;
    uniform float uHasDepth, uNear, uFar;
    uniform sampler2D uDepth;
    varying vec3 vWorld;

    float hash13(vec3 p) {
      p = fract(p * 0.1031);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }
    float vnoise(vec3 x) {
      vec3 i = floor(x), f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      float a = mix(mix(hash13(i + vec3(0,0,0)), hash13(i + vec3(1,0,0)), f.x),
                    mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y);
      float b = mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x),
                    mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y);
      return mix(a, b, f.z);
    }
    float linearize(float d) {
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }
    float hg(float c, float g) {
      float g2 = g * g;
      return (1.0 - g2) / (12.56637 * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
    }

    void main() {
      vec3 ro  = cameraPosition;
      vec3 seg = vWorld - ro;
      float tBack = length(seg);
      if (tBack < 1e-5) discard;
      vec3 rd = seg / tBack;

      // интервал по оси луча: axial(t) = a0 + t*ad ∈ [0, uLength]
      float a0 = dot(ro - uOrigin, uDir);
      float ad = dot(rd, uDir);
      float t0 = 0.0;
      float t1 = tBack;
      if (abs(ad) > 1e-5) {
        float ta = -a0 / ad;
        float tb = (uLength - a0) / ad;
        t0 = max(t0, min(ta, tb));
        t1 = min(t1, max(ta, tb));
      } else if (a0 < 0.0 || a0 > uLength) {
        discard;
      }

      // мягкое слияние с геометрией сцены
      if (uHasDepth > 0.5) {
        vec2 uv = gl_FragCoord.xy / uRes;
        float sceneLin = linearize(texture2D(uDepth, uv).x);
        float fragLin  = linearize(gl_FragCoord.z);
        t1 = min(t1, tBack * (sceneLin / max(fragLin, 1e-5)));
      }
      if (t1 <= t0) discard;

      float steps = float(STEP_COUNT);
      float dt = (t1 - t0) / steps;
      float jit = hash13(vec3(gl_FragCoord.xy, fract(uTime * 7.0)));
      float t = t0 + dt * jit;

      float acc = 0.0;
      for (int i = 0; i < STEP_COUNT; i++) {
        vec3  p     = ro + rd * t;
        vec3  rel   = p - uOrigin;
        float axial = dot(rel, uDir);
        if (axial > 0.0) {
          float dist = max(length(rel), 1e-4);
          float cosA = axial / dist;
          float cone = uHotW   * smoothstep(uCosHotOut,   uCosHotIn,   cosA)
                     + uSpillW * smoothstep(uCosSpillOut, uCosSpillIn, cosA);
          if (cone > 0.0) {
            float atten = 1.0 / (1.0 + dist * dist * 0.75);
            float ext   = exp(-uExtinction * dist);
            float near  = smoothstep(0.0, 0.09, axial);
            float n     = 1.0;
            #ifdef USE_NOISE
              n = mix(1.0 - uNoiseAmt, 1.0 + uNoiseAmt,
                      vnoise(p * 2.3 + vec3(0.0, 0.0, -uTime * 0.22)));
            #endif
            acc += cone * atten * ext * near * n;
          }
        }
        t += dt;
      }

      float phase = hg(dot(uDir, -rd), uG) * 12.56637;
      float v = acc * dt * uDensity * uIntensity * phase;
      v = 1.0 - exp(-max(v, 0.0));
      if (v < 0.0015) discard;
      gl_FragColor = vec4(uColor * v, v);
    }
  `;

  const beamUniforms = {
    uOrigin:      { value: new THREE.Vector3() },
    uDir:         { value: new THREE.Vector3(0, 0, -1) },
    uColor:       { value: beamColor.clone() },
    uIntensity:   { value: 0 },
    uLength:      { value: O.beamLength },
    uCosHotIn:    { value: Math.cos(O.hotAngle * 0.45) },
    uCosHotOut:   { value: Math.cos(O.hotAngle * 1.25) },
    uCosSpillIn:  { value: Math.cos(O.spillAngle * 0.35) },
    uCosSpillOut: { value: Math.cos(O.spillAngle) },
    uHotW:        { value: 1.0 },
    uSpillW:      { value: 0.22 },
    uDensity:     { value: 9.0 },
    uExtinction:  { value: 0.035 },
    uG:           { value: 0.32 },
    uNoiseAmt:    { value: 0.30 },
    uTime:        { value: 0 },
    uRes:         { value: new THREE.Vector2(1920, 1080) },
    uHasDepth:    { value: 0 },
    uNear:        { value: 0.05 },
    uFar:         { value: 200 },
    uDepth:       { value: null }
  };

  const beamMat = new THREE.ShaderMaterial({
    name: 'volumetric_beam',
    uniforms: beamUniforms,
    vertexShader: BEAM_VS,
    fragmentShader: BEAM_FS,
    defines: { STEP_COUNT: O.beamSteps, USE_NOISE: O.beamNoise ? 1 : 0 },
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    side: THREE.BackSide,
    toneMapped: true
  });
  if (!O.beamNoise) delete beamMat.defines.USE_NOISE;

  function makeBeamGeometry(len, halfAngle) {
    const rNear = mm(12.8);
    const rFar = rNear + Math.tan(halfAngle * 1.3) * len;
    const g = new THREE.CylinderGeometry(rFar, rNear, len, 48, 1, true);
    g.rotateX(-Math.PI / 2);          // ось → −Z, широкий торец впереди
    g.translate(0, 0, -len / 2);      // вершина в начале координат
    return g;
  }

  const beam = new THREE.Mesh(makeBeamGeometry(O.beamLength, O.spillAngle), beamMat);
  beam.name = 'beamVolume';
  beam.frustumCulled = false;
  beam.renderOrder = 10;
  beam.visible = false;
  rig.add(beam);

  // ── Блик в линзе ─────────────────────────────────────
  const glareTex = glareTexture(THREE);
  const glareMat = new THREE.SpriteMaterial({
    map: glareTex, color: 0xffffff, blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, opacity: 0, toneMapped: true
  });
  const glare = new THREE.Sprite(glareMat);
  glare.name = 'lensGlare';
  glare.scale.set(0.16, 0.16, 1);
  glare.position.set(0, 0, -mm(6));
  glare.renderOrder = 11;
  glare.visible = false;

  const glowTex = lensGlowTexture(THREE);
  const glowMat = new THREE.MeshBasicMaterial({

    depthWrite: false, opacity: 0, toneMapped: true, side: THREE.DoubleSide
  });
  const glowDiscG = new THREE.PlaneGeometry(mm(24), mm(24));
  const glowDisc = new THREE.Mesh(glowDiscG, glowMat);
  glowDisc.name = 'lensGlow';
  glowDisc.position.set(0, 0, -mm(1.0));
  glowDisc.renderOrder = 3;
  glowDisc.visible = false;
  rig.add(glowDisc);

  group.lights = { hotspot: spotHot, spill: spotSpill, bounce, beam, glare, glow: glowDisc, rig };

  // ── Логика включения ──────────────────────────────────
  const BASE = { hot: 1500, spill: 210, bounce: 1.2, beam: 1.0, glare: 1.0 };
  const MODES = { off: 0, low: 0.22, high: 1.0, strobe: 1.0 };

  const state = {
    mode: 'off',
    target: 0,      // желаемая яркость 0..1
    level: 0,       // текущая (сглаженная)
    master: O.intensity,
    strobeT: 0,
    time: 0,
    beamOn: O.beam !== false
  };

  const _camPos = new THREE.Vector3();
  const _origin = new THREE.Vector3();
  const _dir = new THREE.Vector3();
  const _toCam = new THREE.Vector3();

  function applyLevel(v) {
    const k = v * state.master;
    spotHot.intensity   = BASE.hot   * k;
    spotSpill.intensity = BASE.spill * k;
    bounce.intensity    = BASE.bounce * k;

    const lit = k > 0.001;
    spotHot.visible = spotSpill.visible = bounce.visible = lit;

    mLED.emissive.setRGB(k * 1.0, k * 0.94, k * 0.82);
    mLED.emissiveIntensity = 3.2;
    mRefl.emissive.setRGB(k * 0.10, k * 0.095, k * 0.085);
    mLens.emissive.setRGB(k * 0.22, k * 0.21, k * 0.18);

    beamUniforms.uIntensity.value = k * BASE.beam;
    beam.visible = lit && state.beamOn;
    glowDisc.visible = lit;
    glare.visible = lit;
    glowMat.opacity = Math.min(1, k * 1.1);
  }

  group.setOn = (on) => group.setMode(on ? 'high' : 'off');
  group.toggle = () => group.setMode(state.mode === 'off' ? 'high' : 'off');
  group.isOn = () => state.mode !== 'off';
  group.getMode = () => state.mode;

  group.setMode = (mode) => {
    if (!(mode in MODES)) mode = 'off';
    state.mode = mode;
    state.target = MODES[mode];
    state.strobeT = 0;
    if (mode === 'off') state.target = 0;
    return group;
  };

  // совместимость со старым API
  group.setLight = group.setOn;

  group.setMaster = (v) => { state.master = v; applyLevel(state.level); return group; };

  group.setBeamQuality = (q) => {
    const table = { off: 0, low: 16, medium: 32, high: 56 };
    const steps = table[q] !== undefined ? table[q] : 32;
    state.beamOn = steps > 0;
    if (steps > 0) {
      beamMat.defines.STEP_COUNT = steps;
      if (q === 'high') beamMat.defines.USE_NOISE = 1;
      else delete beamMat.defines.USE_NOISE;
      beamMat.needsUpdate = true;
    }
    beam.visible = state.beamOn && state.level > 0.001;
    return group;
  };

  group.setBeam = (p = {}) => {
    if (p.length !== undefined) {
      beamUniforms.uLength.value = p.length;
      beam.geometry.dispose();
      beam.geometry = makeBeamGeometry(p.length, beamUniforms.uCosSpillOut.value
        ? Math.acos(beamUniforms.uCosSpillOut.value) : O.spillAngle);
    }
    if (p.hotAngle !== undefined) {
      beamUniforms.uCosHotIn.value  = Math.cos(p.hotAngle * 0.45);
      beamUniforms.uCosHotOut.value = Math.cos(p.hotAngle * 1.25);
      spotHot.angle = p.hotAngle * 1.25;
    }
    if (p.spillAngle !== undefined) {
      beamUniforms.uCosSpillIn.value  = Math.cos(p.spillAngle * 0.35);
      beamUniforms.uCosSpillOut.value = Math.cos(p.spillAngle);
      spotSpill.angle = p.spillAngle;
      beam.geometry.dispose();
      beam.geometry = makeBeamGeometry(beamUniforms.uLength.value, p.spillAngle);
    }
    if (p.density !== undefined)    beamUniforms.uDensity.value = p.density;
    if (p.extinction !== undefined) beamUniforms.uExtinction.value = p.extinction;
    if (p.color !== undefined) {
      beamColor.set(p.color);
      beamUniforms.uColor.value.copy(beamColor);
      spotHot.color.copy(beamColor);
      bounce.color.copy(beamColor);
    }
    return group;
  };

  group.setDepthTexture = (tex, camera) => {
    beamUniforms.uDepth.value = tex || null;
    beamUniforms.uHasDepth.value = tex ? 1 : 0;
    if (camera) {
      beamUniforms.uNear.value = camera.near;
      beamUniforms.uFar.value = camera.far;
    }
    return group;
  };

  group.setScreenSize = (w, h) => { beamUniforms.uRes.value.set(w, h); return group; };

  /** вызывать каждый кадр */
  group.update = (dt, camera) => {
    dt = Math.min(dt || 0.016, 0.1);
    state.time += dt;
    beamUniforms.uTime.value = state.time;

    let target = state.target;
    if (state.mode === 'strobe') {
      state.strobeT += dt;
      const period = 1 / 11;
      target = (state.strobeT % period) < period * 0.42 ? 1 : 0;
    }

    // Строб должен бить жёстко, без инерции: на 11 Гц сглаживание превращает
    // вспышки в вялую пульсацию. Плавный накал — только для обычных режимов.
    if (state.mode === 'strobe') {
      state.level = target;
    } else {
      const k = 1 - Math.exp(-dt * (target > state.level ? 42 : 26));
      state.level += (target - state.level) * k;
      if (Math.abs(target - state.level) < 0.002) state.level = target;
    }
    applyLevel(state.level);

    // мировые параметры луча
    rig.updateWorldMatrix(true, false);
    _origin.setFromMatrixPosition(rig.matrixWorld);
    _dir.set(0, 0, -1).transformDirection(rig.matrixWorld).normalize();
    beamUniforms.uOrigin.value.copy(_origin);
    beamUniforms.uDir.value.copy(_dir);

    if (camera && state.level > 0.001) {
      camera.getWorldPosition(_camPos);
      _toCam.copy(_camPos).sub(_origin);
      const dist = Math.max(_toCam.length(), 1e-4);
      _toCam.divideScalar(dist);
      const facing = Math.max(0, _toCam.dot(_dir));          // 1 = смотрим в луч
      const glow = Math.pow(facing, 2.2);
      const near = THREE.MathUtils.clamp(1.6 / (dist + 0.6), 0.25, 1.6);
      glareMat.opacity = state.level * (0.14 + 0.86 * glow) * near;
      const sc = 0.055 + 0.42 * glow * Math.min(1, dist * 0.6 + 0.25);
      glare.scale.set(sc, sc, 1);
      glowMat.opacity = state.level * (0.25 + 0.75 * glow);
    }
    return group;
  };

  // ══ 8. СЛУЖЕБНОЕ ═══════════════════════════════════
  group.setRailVisible = v => { rail.visible = !!v; return group; };

  group.dispose = () => {
    geoms.forEach(g => g.dispose());
    beam.geometry.dispose();
    glowDiscG.dispose();
    allMaterials.forEach(m => {
      ['map', 'normalMap', 'roughnessMap'].forEach(k => { if (m[k]) m[k].dispose(); });
      m.dispose();
    });
    beamMat.dispose();
    glareMat.dispose();
    glowMat.dispose();
    glareTex.dispose();
    glowTex.dispose();
  };

  applyLevel(0);

  group.metrics = (() => {
    // луч длиной 20 м и спрайт блика — не железо: габариты считаем без рига
    group.remove(rig);
    const box = new THREE.Box3().setFromObject(group);
    group.add(rig);
    const size = new THREE.Vector3();
    box.getSize(size);
    let tris = 0, meshes = 0;
    group.traverse(o => {
      if (!o.isMesh || o === beam || o === glowDisc) return;
      meshes++;
      const idx = o.geometry.index;
      tris += idx ? idx.count / 3 : (o.geometry.attributes.position?.count || 0) / 3;
    });
    return { lengthMm: Math.round(size.z * 1000), heightMm: Math.round(size.y * 1000),
             widthMm: Math.round(size.x * 1000), triangles: Math.round(tris), meshes };
  })();

  return group;
}

// ── Процедурный бетон для ночной сцены ────────────────────
function concreteMaps(size = 512) {
  const h = new Float32Array(size * size);
  let seed = 8231;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const grid = [];
  for (let o = 0; o < 4; o++) {
    const n = 4 << o, a = 1 / (o + 1.4), g = new Float32Array(n * n);
    for (let i = 0; i < n * n; i++) g[i] = rnd();
    grid.push({ n, a, g });
  }
  const sm = t => t * t * (3 - 2 * t);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let v = 0;
    for (const { n, a, g } of grid) {
      const fx = x / size * n, fy = y / size * n;
      const x0 = Math.floor(fx) % n, y0 = Math.floor(fy) % n;
      const x1 = (x0 + 1) % n, y1 = (y0 + 1) % n;
      const tx = sm(fx - Math.floor(fx)), ty = sm(fy - Math.floor(fy));
      v += a * ((g[y0 * n + x0] * (1 - tx) + g[y0 * n + x1] * tx) * (1 - ty)
              + (g[y1 * n + x0] * (1 - tx) + g[y1 * n + x1] * tx) * ty);
    }
    h[y * size + x] = v;
  }
  const nc = document.createElement('canvas'); nc.width = nc.height = size;
  const rc = document.createElement('canvas'); rc.width = rc.height = size;
  const nd = nc.getContext('2d').createImageData(size, size);
  const rd = rc.getContext('2d').createImageData(size, size);
  const at = (x, y) => h[((y + size) % size) * size + ((x + size) % size)];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const i = (y * size + x) * 4;
    const dx = (at(x + 1, y) - at(x - 1, y)) * 5.0;
    const dy = (at(x, y + 1) - at(x, y - 1)) * 5.0;
    const l = Math.hypot(-dx, -dy, 1);
    nd.data[i] = (-dx / l * 0.5 + 0.5) * 255;
    nd.data[i + 1] = (-dy / l * 0.5 + 0.5) * 255;
    nd.data[i + 2] = (1 / l * 0.5 + 0.5) * 255;
    nd.data[i + 3] = 255;
    const r = 200 + at(x, y) * 55;
    rd.data[i] = rd.data[i + 1] = rd.data[i + 2] = r; rd.data[i + 3] = 255;
  }
  nc.getContext('2d').putImageData(nd, 0, 0);
  rc.getContext('2d').putImageData(rd, 0, 0);
  const mk = c => {
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  };
  return { normal: mk(nc), rough: mk(rc) };
}

  });

}

const _hidden = [];
function renderDepthPrepass() {
  _hidden.length = 0;
  const lensMesh = flash.getObjectByName('lens');
  [flash.lights.beam, flash.lights.glare, flash.lights.glow, lensMesh].forEach(o => {
    if (o && o.visible) { o.visible = false; _hidden.push(o); }

}

  const i = document.createElement('input');
  i.type = 'range'; i.min = min; i.max = max; i.step = step; i.value = value;
  i.setAttribute('aria-label', label);
  const v = document.createElement('span'); v.className = 'val';
  const upd = () => { const n = parseFloat(i.value); v.textContent = fmt(n); onInput(n); };
  i.addEventListener('input', upd);
  row.append(l, i, v);
  host.appendChild(row);
  v.textContent = fmt(parseFloat(i.value));
  return i;
}

// группа «Свет»
mkBtn($('grp-light'), 'power', '💡', 'Свет', () => { flash.toggle(); syncUI(); }, true);
mkSeg($('grp-light'), 'mode', [
  { v: 'low', label: 'Слабо' }, { v: 'high', label: 'Ярко' }, { v: 'strobe', label: 'Строб' }
], v => { flash.setMode(flash.getMode() === v ? 'off' : v); syncUI(); });
mkSeg($('grp-light'), 'quality', [
  { v: 'off', label: 'Без луча' }, { v: 'low', label: 'Низ.' }, { v: 'medium', label: 'Сред.' }, { v: 'high', label: 'Выс.' }
], v => { beamQuality = v; flash.setBeamQuality(v); syncUI(); });

// группа «Вид»
mkSeg($('grp-view'), 'view', [
  { v: 'studio', label: 'Студия' }, { v: 'night', label: 'Ночь' }
], v => applyView(v, false));
mkBtn($('grp-view'), 'rail', '░', 'Планка Пикатинни', () => {
  flash.parts.rail.visible = !flash.parts.rail.visible; syncUI();
});
mkBtn($('grp-view'), 'wire', '▦', 'Каркас', () => { wireframe = !wireframe; setWireframe(wireframe); syncUI(); });
mkBtn($('grp-view'), 'nodes', '◉', 'Узлы крепления', () => {
  nodeHelper.visible = !nodeHelper.visible; bboxHelper.visible = nodeHelper.visible; syncUI();
});
mkBtn($('grp-view'), 'spin', '↻', 'Автоповорот', () => { controls.autoRotate = !controls.autoRotate; syncUI(); });
mkBtn($('grp-view'), 'reset', '⌂', 'Сброс камеры', () => resetCamera());

// группа «Файлы»
mkBtn($('grp-io'), 'shot', '⬜', 'Скриншот PNG', () => { pendingShot = true; });
mkBtn($('grp-io'), 'glb', '⬇', 'Экспорт GLB', exportGLB);

// слайдеры света
const LS = $('light-sliders');
mkSlider(LS, 'Яркость', 0.1, 3, 0.05, 1, n => n.toFixed(2) + '×', n => flash.setMaster(n));
mkSlider(LS, 'Плотность', 0, 26, 0.5, 9, n => n.toFixed(1), n => flash.setBeam({ density: n }));
mkSlider(LS, 'Дальность', 3, 40, 1, 20, n => n + ' м', n => flash.setBeam({ length: n }));
mkSlider(LS, 'Пятно', 3, 20, 0.5, 7.2, n => n.toFixed(1) + '°', n => flash.setBeam({ hotAngle: n * Math.PI / 180 }));
mkSlider(LS, 'Заливка', 10, 48, 1, 23, n => n + '°', n => flash.setBeam({ spillAngle: n * Math.PI / 180 }));
mkSlider(LS, 'Дымка', 0, 0.06, 0.002, 0.017, n => n.toFixed(3), n => {
  if (scene.fog) scene.fog.density = n;
  VIEWS.night.fog.density = n;
});
mkSlider(LS, 'Температура', 2700, 6500, 100, 4200, n => Math.round(n) + 'K', n => {
  flash.setBeam({ color: kelvin(n) });
});

// слайдеры разборки
const PS = $('part-sliders');
mkSlider(PS, 'Разнести', 0, 1, 0.01, 0, n => Math.round(n * 100) + '%', n => {
  [flash.parts.tailCap, flash.parts.head].forEach(p => {
    p.position.copy(p.userData.basePos).addScaledVector(p.userData.travelAxis, n);
  });
});
mkSlider(PS, 'Кнопка', 0, 1, 0.01, 0, n => Math.round(n * 100) + '%', n => {
  const p = flash.parts.tailSwitch;
  p.position.copy(p.userData.basePos).addScaledVector(p.userData.travelAxis, n);
});

function kelvin(k) {
  const t = k / 100;
  let r, g, b;
  if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; }
  else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); }
  if (t >= 66) b = 255;
  else if (t <= 19) b = 0;
  else b = 138.52 * Math.log(t - 10) - 305.04;
  const c = v => Math.min(255, Math.max(0, v)) / 255;
  return new THREE.Color().setRGB(c(r), c(g), c(b), THREE.SRGBColorSpace);
}

// ── Состояние UI ───────────────────────────────────
let wireframe = false, beamQuality = 'medium', pendingShot = false;

function setWireframe(on) {
  flash.traverse(o => {
    if (o.isMesh && o.material && 'wireframe' in o.material && o !== flash.lights.beam) {
      o.material.wireframe = on;
    }
  });
}
function segSync(key, value) {
  if (!ui[key]) return;
  [...ui[key].children].forEach(b => b.classList.toggle('on', b.dataset.v === value));
}
function syncUI() {
  const on = flash.isOn();
  ui.power.classList.toggle('on', on);
  ui.power.querySelector('span:last-child').textContent = on ? 'Свет включён' : 'Свет';
  ui.power.setAttribute('aria-pressed', on ? 'true' : 'false');
  segSync('mode', flash.getMode());
  segSync('quality', beamQuality);
  segSync('view', viewMode);
  ui.rail.classList.toggle('on', flash.parts.rail.visible);
  ui.wire.classList.toggle('on', wireframe);
  ui.nodes.classList.toggle('on', nodeHelper.visible);
  ui.spin.classList.toggle('on', controls.autoRotate);
}

// ── Экспорт ──────────────────────────────────────
function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportGLB() {
  const rigWas = flash.lights.rig.visible;
  flash.lights.rig.visible = false;
  nodeHelper.visible = false; bboxHelper.visible = false;
  new GLTFExporter().parse(flash, res => {
    saveBlob(new Blob([res], { type: 'model/gltf-binary' }), 'weapon_light_TL6.glb');
    flash.lights.rig.visible = rigWas;
    syncUI();
  }, err => {
    console.error(err);
    flash.lights.rig.visible = rigWas;
  }, { binary: true, onlyVisible: true });
}

// ── Статистика ────────────────────────────────────
const statsEl = $('stats');
const M = flash.metrics;
const MODE_RU = { off: 'выкл', low: 'слабо', high: 'ярко', strobe: 'строб' };
const STEPS = { off: 0, low: 16, medium: 32, high: 56 };
let fps = 0, frames = 0, fpsT = 0;

function drawStats() {
  const row = (k, v, cls) => '<div>' + k + '<span class="v ' + (cls || '') + '">' + v + '</span></div>';
  statsEl.innerHTML =
    '<div><b>AXIOM TL-6</b></div>' +
    row('Габариты', M.lengthMm + '×' + M.heightMm + '×' + M.widthMm + ' мм') +
    row('Треугольники', M.triangles.toLocaleString('ru-RU')) +
    row('Мешей', M.meshes) +
    row('Режим', MODE_RU[flash.getMode()], flash.isOn() ? 'ok' : '') +
    row('Луч', beamQuality === 'off' ? '—' : STEPS[beamQuality] + ' шагов') +
    row('Светильники', '2 spot + point', 'ok') +
    row('FPS', fps);
}

// ── Цикл ──────────────────────────────────────────
const clock = new THREE.Clock();
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  const dpr = renderer.getPixelRatio();
  flash.setScreenSize(w * dpr, h * dpr);
  buildDepthRT(w * dpr, h * dpr);
}
addEventListener('resize', resize);

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'f' || k === 'а') { flash.toggle(); syncUI(); }
  else if (k === 'm' || k === 'ь') applyView(viewMode === 'studio' ? 'night' : 'studio', false);
  else if (k === 'r' || k === 'к') resetCamera();
});

function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  controls.update();
  flash.update(dt, camera);

  frames++; fpsT += dt;
  if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; drawStats(); }

  if (flash.lights.beam.visible) renderDepthPrepass();
  composer.render();

  if (pendingShot) {
    pendingShot = false;
    renderer.domElement.toBlob(b => saveBlob(b, 'weapon_light.png'), 'image/png');
  }
}

// ── Старт ─────────────────────────────────────────
applyView('studio', false);
flash.setBeamQuality('medium');
flash.setMode('high');            // фонарь сразу горит — сразу видно, что работает
resize();
syncUI();
drawStats();
if (loadingEl) loadingEl.remove();
window.__flashlightReady = true;
tick();
</script>

<script>
setTimeout(function () {
  var l = document.getElementById('loading');
  if (l && !window.__flashlightReady) {
    l.classList.add('err');
    l.innerHTML = '<div>Не удалось загрузить three.js с unpkg.com.<br>Проверьте интернет и обновите страницу.</div>';
  }
}, 15000);
</script>
