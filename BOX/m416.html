<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

// ==== МОДЕЛЬ: НАЧАЛО ====
function buildM416(THREE, opts = {}) {

  const mm = x => x / 1000;                        // мм -> метры
  const G = [], MT = [];                           // реестры для dispose()
  const reg = g => { G.push(g); return g; };
  const regM = m => { MT.push(m); return m; };

  const BORE = mm(70);                             // ось канала ствола — 70 мм над origin
  const fde = !!opts.fde;

  // ---------- МАТЕРИАЛЫ ----------
  const anodized  = regM(new THREE.MeshStandardMaterial({ color: fde ? 0x8a7a5c : 0x1c1e21, metalness: 0.62, roughness: 0.50 }));
  const polymer   = regM(new THREE.MeshStandardMaterial({ color: fde ? 0x8a7a5c : 0x22252a, metalness: 0.00, roughness: 0.70 }));
  const phosphate = regM(new THREE.MeshStandardMaterial({ color: 0x2a2d30, metalness: 0.70, roughness: 0.62 }));
  const steelDark = regM(new THREE.MeshStandardMaterial({ color: 0x17191c, metalness: 0.80, roughness: 0.45 }));
  const brass     = regM(new THREE.MeshStandardMaterial({ color: 0xb08d3f, metalness: 0.90, roughness: 0.30 }));
  const rubber    = regM(new THREE.MeshStandardMaterial({ color: 0x131518, metalness: 0.00, roughness: 0.93 }));
  const mark      = regM(new THREE.MeshStandardMaterial({ color: 0x8d939a, metalness: 0.35, roughness: 0.55 }));

  // ---------- БАЗОВЫЕ ХЕЛПЕРЫ ----------
  const BEV = { bevelEnabled: true, bevelThickness: mm(0.4), bevelSize: mm(0.4), bevelSegments: 3, curveSegments: 16 };

  function mesh(g, mat) { const m = new THREE.Mesh(reg(g), mat); m.castShadow = true; m.receiveShadow = true; return m; }

  // Базовое выдавливание: профиль в XY, толщина по Z, центрировано. Фаска 0.4 мм на всех кромках.
  function ex(shape, depth, mat, o) {
    const cfg = Object.assign({ depth: depth, steps: 1 }, BEV, o || {});
    const g = new THREE.ExtrudeGeometry(shape, cfg);
    g.translate(0, 0, -depth / 2);
    return mesh(g, mat);
  }
  // Сечение X/Y, длина вдоль Z
  const bodyXY = (s, len, mat, o) => ex(s, len, mat, o);
  // Боковой профиль: x фигуры -> Z, y -> Y, ширина по X. Отверстия в фигуре = сквозные по X.
  function bodyYZ(s, width, mat, o) { const m = ex(s, width, mat, o); m.rotation.y = -Math.PI / 2; return m; }
  // План: x фигуры -> X, y -> Z, высота по Y. Отверстия = сквозные по Y.
  function bodyXZ(s, h, mat, o) { const m = ex(s, h, mat, o); m.rotation.x = Math.PI / 2; return m; }

  // Цилиндр/труба вдоль Z с фасками по торцам (Lathe)
  function tubeZ(rOut, rIn, len, mat, seg, ch) {
    const c = ch === undefined ? mm(0.5) : ch, p = [], h = len / 2, hole = rIn > 0;
    if (hole) { p.push(new THREE.Vector2(rIn, -h), new THREE.Vector2(rIn, h), new THREE.Vector2(rIn + c, h)); }
    else p.push(new THREE.Vector2(0, h));
    p.push(new THREE.Vector2(rOut - c, h), new THREE.Vector2(rOut, h - c), new THREE.Vector2(rOut, -h + c), new THREE.Vector2(rOut - c, -h));
    if (hole) p.push(new THREE.Vector2(rIn + c, -h), new THREE.Vector2(rIn, -h)); else p.push(new THREE.Vector2(0, -h));
    p.reverse();                                     // обход против часовой — нормали наружу
    const g = new THREE.LatheGeometry(p, seg || 32);
    g.rotateX(Math.PI / 2);
    return mesh(g, mat);
  }
  function tubeX(rOut, rIn, len, mat, seg, ch) { const m = tubeZ(rOut, rIn, len, mat, seg, ch); m.geometry.rotateY(Math.PI / 2); return m; }
  function tubeY(rOut, rIn, len, mat, seg, ch) { const m = tubeZ(rOut, rIn, len, mat, seg, ch); m.geometry.rotateX(-Math.PI / 2); return m; }
  // Произвольный профиль вращения вокруг оси Z: pts = [[r, z], ...]
  function latheZ(pts, mat, seg) {
    const v = pts.map(p => new THREE.Vector2(p[0], p[1]));
    const g = new THREE.LatheGeometry(v, seg || 48);
    g.rotateX(Math.PI / 2);
    return mesh(g, mat);
  }

  // Скруглённый прямоугольник в любой Path/Shape
  function rrTo(p, w, h, r, cx, cy) {
    cx = cx || 0; cy = cy || 0;
    r = Math.min(r, Math.min(w, h) / 2 - 1e-6);
    const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2;
    p.moveTo(x0 + r, y0);
    p.lineTo(x1 - r, y0); p.quadraticCurveTo(x1, y0, x1, y0 + r);
    p.lineTo(x1, y1 - r); p.quadraticCurveTo(x1, y1, x1 - r, y1);
    p.lineTo(x0 + r, y1); p.quadraticCurveTo(x0, y1, x0, y1 - r);
    p.lineTo(x0, y0 + r); p.quadraticCurveTo(x0, y0, x0 + r, y0);
    p.closePath();
    return p;
  }
  const roundRect = (w, h, r, cx, cy) => rrTo(new THREE.Shape(), w, h, r, cx, cy);
  const roundHole = (s, w, h, r, cx, cy) => { s.holes.push(rrTo(new THREE.Path(), w, h, r, cx, cy)); return s; };
  // Сквозное круглое отверстие
  function hole(s, r, cx, cy) { const p = new THREE.Path(); p.absarc(cx, cy, r, 0, Math.PI * 2, true); s.holes.push(p); return s; }
  function circleShape(r, cx, cy) { const s = new THREE.Shape(); s.absarc(cx || 0, cy || 0, r, 0, Math.PI * 2, false); return s; }
  function hexShape(r, cx, cy, rot) {
    cx = cx || 0; cy = cy || 0; rot = rot || 0;
    const s = new THREE.Shape();
    for (let i = 0; i < 6; i++) { const a = rot + i * Math.PI / 3, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r; i ? s.lineTo(x, y) : s.moveTo(x, y); }
    s.closePath(); return s;
  }
  // Кольцевой сектор (стенка между прорезями пламегасителя)
  function sector(rIn, rOut, a0, a1) {
    const s = new THREE.Shape();
    s.absarc(0, 0, rOut, a0, a1, false);
    s.absarc(0, 0, rIn, a1, a0, true);
    s.closePath(); return s;
  }

  // ---------- ПРОЦЕДУРНЫЕ BufferGeometry: насечка, рифлёние, гравировка ----------
  function quad(a, p1, p2, p3, p4) {
    a.push(p1[0], p1[1], p1[2], p2[0], p2[1], p2[2], p3[0], p3[1], p3[2]);
    a.push(p1[0], p1[1], p1[2], p3[0], p3[1], p3[2], p4[0], p4[1], p4[2]);
  }
  // Усечённая пирамидка в плоскости XY, выступает по +Z
  function frustum(a, cx, cy, w, h, tw, th, d, rot) {
    const c = Math.cos(rot || 0), s = Math.sin(rot || 0);
    const P = (x, y, z) => [cx + x * c - y * s, cy + x * s + y * c, z];
    const b = [P(-w / 2, -h / 2, 0), P(w / 2, -h / 2, 0), P(w / 2, h / 2, 0), P(-w / 2, h / 2, 0)];
    const t = [P(-tw / 2, -th / 2, d), P(tw / 2, -th / 2, d), P(tw / 2, th / 2, d), P(-tw / 2, th / 2, d)];
    quad(a, t[0], t[1], t[2], t[3]);
    quad(a, b[0], b[1], t[1], t[0]); quad(a, b[1], b[2], t[2], t[1]);
    quad(a, b[2], b[3], t[3], t[2]); quad(a, b[3], b[0], t[0], t[3]);
  }
  function fromArray(a, mat) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(a, 3));
    g.computeVertexNormals();
    return mesh(g, mat);
  }
  // Ромбовидная насечка по прямоугольнику w x h, высота зубца d
  function diamondPatch(w, h, cell, d, mat) {
    const a = [], n = Math.PI / 4, cs = cell / Math.SQRT2;
    for (let i = -Math.ceil(w / cs); i <= Math.ceil(w / cs); i++) {
      for (let j = -Math.ceil(h / cs); j <= Math.ceil(h / cs); j++) {
        const x = (i + j) * cs / 2, y = (j - i) * cs / 2;
        if (Math.abs(x) > w / 2 - cell * 0.4 || Math.abs(y) > h / 2 - cell * 0.4) continue;
        frustum(a, x, y, cell * 0.94, cell * 0.94, cell * 0.30, cell * 0.30, d, n);
      }
    }
    return fromArray(a, mat);
  }
  // Параллельные рёбра (рифлёние затыльника, рукоятки вз��едения, спуска)
  function ridgePatch(w, h, n, d, mat, vertical) {
    const a = [], step = (vertical ? w : h) / n;
    for (let i = 0; i < n; i++) {
      const t = -(vertical ? w : h) / 2 + step * (i + 0.5);
      if (vertical) frustum(a, t, 0, step * 0.55, h, step * 0.16, h, d, 0);
      else frustum(a, 0, t, w, step * 0.55, w, step * 0.16, d, 0);
    }
    return fromArray(a, mat);
  }
  // Штриховой шрифт — надписи и нумерация отдельной геометрией, не текстурой
  const FONT = {
    '0': [[[0,.12],[0,.88],[.2,1],[.8,1],[1,.88],[1,.12],[.8,0],[.2,0],[0,.12]]],
    '1': [[[.15,.78],[.5,1],[.5,0]],[[.15,0],[.85,0]]],
    '2': [[[0,.82],[.2,1],[.8,1],[1,.82],[1,.62],[0,.12],[0,0],[1,0]]],
    '3': [[[0,1],[1,1],[.4,.56]],[[.3,.56],[.8,.56],[1,.4],[1,.14],[.82,0],[.18,0],[0,.14]]],
    '4': [[[.74,0],[.74,1],[0,.3],[1,.3]]],
    '5': [[[1,1],[0,1],[0,.58],[.8,.58],[1,.42],[1,.14],[.82,0],[.18,0],[0,.12]]],
    '6': [[[.9,1],[.25,1],[0,.78],[0,.14],[.18,0],[.82,0],[1,.14],[1,.4],[.82,.55],[.08,.55]]],
    '7': [[[0,1],[1,1],[.34,0]]],
    '8': [[[.18,.55],[0,.7],[0,.86],[.2,1],[.8,1],[1,.86],[1,.7],[.82,.55],[.18,.55],[0,.38],[0,.14],[.18,0],[.82,0],[1,.14],[1,.38],[.82,.55]]],
    '9': [[[.1,0],[.75,0],[1,.22],[1,.86],[.8,1],[.2,1],[0,.86],[0,.6],[.2,.45],[.92,.45]]],
    'A': [[[0,0],[.5,1],[1,0]],[[.19,.38],[.81,.38]]],
    'E': [[[1,1],[0,1],[0,0],[1,0]],[[0,.5],[.72,.5]]],
    'F': [[[0,0],[0,1],[1,1]],[[0,.52],[.72,.52]]],
    'I': [[[.5,0],[.5,1]]],
    'M': [[[0,0],[0,1],[.5,.42],[1,1],[1,0]]],
    'O': [[[0,.14],[0,.86],[.2,1],[.8,1],[1,.86],[1,.14],[.8,0],[.2,0],[0,.14]]],
    'S': [[[1,.88],[.8,1],[.2,1],[0,.86],[0,.66],[.2,.55],[.8,.55],[1,.42],[1,.14],[.8,0],[.2,0],[0,.12]]],
    'T': [[[0,1],[1,1]],[[.5,1],[.5,0]]],
    'U': [[[0,1],[0,.14],[.2,0],[.8,0],[1,.14],[1,1]]],
    '-': [[[0,.5],[1,.5]]],
    '.': [[[.4,.06],[.6,.06]]]
  };
  // Текст в плоскости XY, выступает по +Z на d; возвращает Mesh (центр строки в 0,0)
  function label(str, size, d, mat, mir) {
    const a = [], th = size * 0.16, adv = size * 0.78, total = str.length * adv - size * 0.18;
    const S = mir ? -1 : 1;
    let x0 = -total / 2;
    for (const ch of str) {
      const gl = FONT[ch];
      if (gl) for (const poly of gl) for (let i = 0; i < poly.length - 1; i++) {
        const ax = x0 + poly[i][0] * size * 0.6, ay = poly[i][1] * size;
        const bx = x0 + poly[i + 1][0] * size * 0.6, by = poly[i + 1][1] * size;
        const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
        if (len < 1e-9) continue;
        const ang = Math.atan2(dy, dx);
        frustum(a, S * (ax + bx) / 2, (ay + by) / 2, len + th, th, len + th * 0.6, th * 0.6, d, mir ? Math.PI - ang : ang);
      }
      x0 += adv;
    }
    return fromArray(a, mat || mark);
  }

  // Винт с крестовым шлицем (отдельная геометрия)
  function screwY(r, h, mat) {
    const g = new THREE.Group();
    g.add(tubeY(r, 0, h, mat || steelDark, 24, mm(0.25)));
    const a = [];
    frustum(a, 0, 0, r * 1.7, mm(0.5), r * 1.7, mm(0.3), mm(0.35), 0);
    frustum(a, 0, 0, mm(0.5), r * 1.7, mm(0.3), r * 1.7, mm(0.35), 0);
    const sl = fromArray(a, steelDark);
    sl.rotation.x = -Math.PI / 2; sl.position.y = h / 2;
    g.add(sl);
    return g;
  }

  const root = new THREE.Group();
  root.name = 'M416';
  const nodes = {}, parts = {};
  const node = (name, x, y, z, rx, ry, rz) => {
    const o = new THREE.Object3D();
    o.name = name;
    o.position.set(x, y, z);
    o.rotation.set(rx || 0, ry || 0, rz || 0);
    nodes[name] = o;
    root.add(o);
    return o;
  };

  // ================= 1. НИЖНИЙ РЕСИВЕР (алюминий): Z +25..-150, ширина 33 мм =================
  const lower = new THREE.Group(); root.add(lower);
  {
    // Боковой профиль корпуса (x = Z, y = Y)
    const s = new THREE.Shape();
    s.moveTo(mm(25), mm(52));                       // задний верхний угол
    s.lineTo(mm(-150), mm(52));                     // линия стыка с верхним ресивером
    s.lineTo(mm(-150), mm(33));                     // передний торец (проушина оси вращения)
    s.quadraticCurveTo(mm(-150), mm(26), mm(-141), mm(24));
    s.lineTo(mm(-131), mm(22));
    s.lineTo(mm(-52), mm(22));                      // низ под шахтой магазина
    s.lineTo(mm(-44), mm(25));
    s.lineTo(mm(-24), mm(25));                      // прилив спусковой скобы
    s.lineTo(mm(-16), mm(21));
    s.lineTo(mm(6), mm(21));                        // низ хвостовика под рукоять
    s.quadraticCurveTo(mm(20), mm(22), mm(25), mm(32));
    s.closePath();
    const body = bodyYZ(s, mm(33), anodized);       // ширина 33 мм
    lower.add(body);

    // Бобровый хвост + башня буфера: сечение X/Y с отверстием под трубку O32
    const tw = roundRect(mm(36), mm(46), mm(9), 0, BORE - mm(1));
    hole(tw, mm(16.3), 0, BORE);                    // посадка трубки O32.6
    const tower = bodyXY(tw, mm(30), anodized, { curveSegments: 24 });
    tower.position.z = mm(12);                      // Z -3..+27
    lower.add(tower);
    // переход башня -> корпус
    const fill = new THREE.Shape();
    fill.moveTo(mm(27), mm(48)); fill.lineTo(mm(-6), mm(48));
    fill.lineTo(mm(6), mm(62)); fill.lineTo(mm(27), mm(62)); fill.closePath();
    lower.add(bodyYZ(fill, mm(34), anodized));

    // Кастл-гайка и концевая пластина за башней
    const nut = tubeZ(mm(21), mm(16.5), mm(11), phosphate, 48, mm(0.6));  // O42 x 11 мм
    nut.position.set(0, BORE, mm(32)); lower.add(nut);
    for (let i = 0; i < 8; i++) {                   // восемь пазов под ключ
      const a = i * Math.PI / 4 + 0.2;
      const n = ex(roundRect(mm(4), mm(5), mm(1)), mm(11), phosphate);
      n.position.set(Math.cos(a) * mm(20), BORE + Math.sin(a) * mm(20), mm(32));
      n.rotation.z = a; n.material = steelDark; lower.add(n);
    }

    // Шахта магазина: строго вертикальная, Z -55..-130
    const well = roundRect(mm(33), mm(78), mm(6), 0, mm(-92.5));   // план: X x Z
    roundHole(well, mm(25.6), mm(69), mm(4.5), 0, mm(-92.5));      // проём под магазин
    const wellM = bodyXZ(well, mm(46), anodized, { curveSegments: 20 });
    wellM.position.y = mm(28);                                     // Y 5..51
    lower.add(wellM);
    // Воронка: скос 45 градусов спереди-снизу для быстрой вставки
    const lip = roundRect(mm(34), mm(80), mm(6), 0, mm(-92.5));
    roundHole(lip, mm(25.6), mm(69), mm(4.5), 0, mm(-92.5));
    const lipM = bodyXZ(lip, mm(2), anodized, { bevelThickness: mm(3.2), bevelSize: mm(3.2), bevelSegments: 1, curveSegments: 20 });
    lipM.position.y = mm(7.5);
    lower.add(lipM);
    const funnel = new THREE.Shape();               // клюв воронки спереди (45 град.)
    funnel.moveTo(mm(-131), mm(6)); funnel.lineTo(mm(-131), mm(22));
    funnel.lineTo(mm(-143), mm(22)); funnel.closePath();
    const fm = bodyYZ(funnel, mm(31), anodized); lower.add(fm);

    // Два горизонтальных штифта O6 мм (такедаун-пины), выступ 1 мм
    [mm(10), mm(-100)].forEach(z => {
      const p = tubeX(mm(3), 0, mm(35), steelDark, 32, mm(0.4));    // 33 + 2 мм выступа
      p.position.set(0, mm(38), z); lower.add(p);
      [-1, 1].forEach(sx => {
        const r = tubeX(mm(4.2), 0, mm(1.4), anodized, 32, mm(0.3)); // ободок гнезда
        r.position.set(sx * mm(16.9), mm(38), z); lower.add(r);
      });
    });
  }

  // ================= 2. ВЕРХНИЙ РЕСИВЕР: Z +30..-170 =================
  const upper = new THREE.Group(); root.add(upper);
  // сечение: коробка 38 мм шириной, Y 50..98, внутри канал затворной группы 27x26
  const UX = mm(19), UY0 = mm(50), UY1 = mm(98), IX = mm(13.5), IY0 = mm(58), IY1 = mm(84);
  function upperProfile(openPort) {
    const s = new THREE.Shape();
    s.moveTo(-UX, mm(56));
    s.quadraticCurveTo(-UX, UY0, -mm(13), UY0);     // нижний левый скруглённый угол
    s.lineTo(mm(13), UY0);
    s.quadraticCurveTo(UX, UY0, UX, mm(56));
    if (openPort) {
      s.lineTo(UX, mm(62));                         // нижняя кромка окна выброса
      s.lineTo(IX, mm(62));
      s.lineTo(IX, IY0 + mm(4));                    // внутренняя стенка вниз
      s.quadraticCurveTo(IX, IY0, IX - mm(5), IY0);
      s.lineTo(-IX + mm(5), IY0);
      s.quadraticCurveTo(-IX, IY0, -IX, IY0 + mm(5));
      s.lineTo(-IX, IY1 - mm(4));
      s.quadraticCurveTo(-IX, IY1, -IX + mm(4), IY1);
      s.lineTo(IX, IY1);                            // верхняя кромка окна
      s.lineTo(UX, IY1);
    }
    s.lineTo(UX, mm(86));

    const base = bodyXY(railBaseShape(baseH), len, anodized);

    const n = Math.floor((len + SLOT) / PITCH);                              // около 45 пазов на верхней планке
    for (let i = 0; i < n; i++) {
      const t = bodyXY(tooth, PITCH - SLOT, anodized);                       // каждый зубец — настоящая геометрия
      t.position.set(0, baseH, -(i * PITCH + (PITCH - SLOT) / 2));

  key.shadow.camera.top = radius * 1.4; key.shadow.camera.bottom = -radius * 1.4;
  key.shadow.camera.far = d;
  key.position.copy(center).add(new THREE.Vector3(0.9, 1.4, 1.05).multiplyScalar(radius * 2.2));
  key.shadow.camera.updateProjectionMatrix();
}
controls.update();

// возврат в стартовый ракурс по двойному клику по фону
{
  const ray = new THREE.Raycaster(), pt = new THREE.Vector2();
  renderer.domElement.addEventListener('dblclick', ev => {
    pt.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(pt, camera);
    if (gun && ray.intersectObject(gun, true).length) return;
    homing = 1;
  });
}
let homing = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- ДУЛЬНАЯ ВСПЫШКА: две скрещённые плоскости, звезда из пяти лучей ----------
const flash = new THREE.Group();
flash.visible = false;
let flashLight = null;
if (gun) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 256, 256);
  const core = g.createRadialGradient(128, 128, 2, 128, 128, 44);
  core.addColorStop(0, 'rgba(255,255,240,1)');
  core.addColorStop(0.45, 'rgba(255,214,132,0.85)');
  core.addColorStop(1, 'rgba(255,150,40,0)');
  g.fillStyle = core; g.beginPath(); g.arc(128, 128, 44, 0, 6.2832); g.fill();
  for (let i = 0; i < 5; i++) {                      // пять лучей — по числу прорезей пламегасителя
    const a = i * Math.PI * 2 / 5 - Math.PI / 2;
    g.save(); g.translate(128, 128); g.rotate(a);
    const lg = g.createLinearGradient(0, 0, 124, 0);
    lg.addColorStop(0, 'rgba(255,236,190,0.95)');
    lg.addColorStop(0.35, 'rgba(255,176,70,0.5)');
    lg.addColorStop(1, 'rgba(255,130,30,0)');
    g.fillStyle = lg;
    g.beginPath(); g.moveTo(0, -26); g.quadraticCurveTo(60, -9, 124, 0); g.quadraticCurveTo(60, 9, 0, 26); g.closePath(); g.fill();
    g.restore();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false });
  const geo = new THREE.PlaneGeometry(0.13, 0.13);
  const p1 = new THREE.Mesh(geo, mat);
  const p2 = new THREE.Mesh(geo, mat);
  p2.rotation.z = Math.PI / 2;
  p2.rotation.y = Math.PI / 2;
  flash.add(p1, p2);
  flashLight = new THREE.PointLight(0xffb257, 0, 1.2, 2);
  flash.add(flashLight);
  nodes.muzzle.add(flash);
}

// ---------- ГИЛЬЗЫ 5,56x45 ----------
const caseGeo = new THREE.CylinderGeometry(0.005, 0.005, 0.045, 24, 1, false);   // 45 x 10 мм
caseGeo.rotateZ(Math.PI / 2);
const caseMat = new THREE.MeshStandardMaterial({ color: 0xb08d3f, metalness: 0.9, roughness: 0.3 });
const cases = [];
function ejectCase() {
  if (!gun) return;
  const m = new THREE.Mesh(caseGeo, caseMat);
  m.castShadow = true;
  nodes.eject.getWorldPosition(m.position);
  m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  scene.add(m);
  cases.push({
    m: m, life: 0,
    v: new THREE.Vector3(2.1 + Math.random() * 0.5, 1.5 + Math.random() * 0.4, -0.55 - Math.random() * 0.4),
    w: new THREE.Vector3((Math.random() - 0.5) * 34, (Math.random() - 0.5) * 26, (Math.random() - 0.5) * 30),
    ring: 0.25 + Math.random() * 0.25
  });
}

// ---------- ЗВУК: только Web Audio API, процедурно ----------
let AC = null, comp = null, master = null, echoBus = null, nBuf = null, muted = false;
function audio() {
  if (!AC) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    AC = new Ctx();
    comp = AC.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 8; comp.knee.value = 8;
    comp.attack.value = 0.002; comp.release.value = 0.14;
    master = AC.createGain(); master.gain.value = 0.8;
    comp.connect(master); master.connect(AC.destination);
    nBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = nBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const conv = AC.createConvolver(), len = (AC.sampleRate * 1.0) | 0;      // импульс 1.0 с
    const ir = AC.createBuffer(2, len, AC.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const a = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) { const t = i / len; a[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.4); }
      [0.029, 0.048, 0.083].forEach((tt, k) => {                             // пара ранних отражений
        const i = ((tt + ch * 0.004) * AC.sampleRate) | 0;
        if (i < len) a[i] += k % 2 ? -0.85 : 0.95;
      });
    }
    conv.buffer = ir;
    echoBus = AC.createGain(); echoBus.gain.value = 0.25;                     // шина эха
    echoBus.connect(conv); conv.connect(comp);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function nz(rate) { const s = AC.createBufferSource(); s.buffer = nBuf; s.loop = true; s.playbackRate.value = rate || 1; return s; }
function ramp(g, t, peak, atk, dec) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, peak), t + atk);
  g.gain.exponentialRampToValueAtTime(0.0005, t + dec);
}
function sndShot() {
  const ac = audio(); if (!ac || muted) return;
  const t = ac.currentTime + 0.001;
  const p = 1 + (Math.random() * 2 - 1) * 0.04;        // питч ±4 %
  const v = 1 + (Math.random() * 2 - 1) * 0.08;        // громкость ±8 %
  const tk = 1 + (Math.random() * 2 - 1) * 0.10;       // длина хвоста ±10 %
  const n1 = nz(p), bp = ac.createBiquadFilter(), g1 = ac.createGain();      // 1) крэк 7 мс
  bp.type = 'bandpass'; bp.frequency.value = 5700 * p; bp.Q.value = 1.6;     // 4-7.5 кГц
  ramp(g1, t, 0.95 * v, 0.0004, 0.007);
  n1.connect(bp).connect(g1).connect(comp); g1.connect(echoBus);
  n1.start(t); n1.stop(t + 0.03);
  const n2 = nz(p), lp = ac.createBiquadFilter(), g2 = ac.createGain();      // 2) тело 220 мс
  lp.type = 'lowpass'; lp.Q.value = 1.2;
  lp.frequency.setValueAtTime(7000 * p, t);
  lp.frequency.exponentialRampToValueAtTime(380, t + 0.22);
  ramp(g2, t, 0.8 * v, 0.002, 0.22);
  n2.connect(lp).connect(g2).connect(comp);
  const gt = ac.createGain();                                               // 4) хвост в конволюцию
  ramp(gt, t, 0.55 * v, 0.004, 0.34 * tk);
  lp.connect(gt); gt.connect(echoBus);
  n2.start(t); n2.stop(t + 0.42 * tk);
  const o = ac.createOscillator(), g3 = ac.createGain();                    // 3) сухой низ
  o.type = 'sine';
  o.frequency.setValueAtTime(175 * p, t);
  o.frequency.exponentialRampToValueAtTime(58, t + 0.075);
  ramp(g3, t, 0.42 * v, 0.004, 0.16);
  o.connect(g3).connect(comp);
  o.start(t); o.stop(t + 0.2);
}
function sndClack(delay, vol, freq, dur) {
  const ac = audio(); if (!ac || muted) return;
  const t = ac.currentTime + (delay || 0);
  const n = nz(1), bp = ac.createBiquadFilter(), g = ac.createGain();
  bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.5;
  ramp(g, t, vol, 0.0008, dur);
  n.connect(bp).connect(g).connect(comp); g.connect(echoBus);
  n.start(t); n.stop(t + dur + 0.05);
}
function sndBoing(delay) {                                                   // фирменный звук AR: пружина в трубке
  const ac = audio(); if (!ac || muted) return;
  const t = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = 320;
  lfo.type = 'sine'; lfo.frequency.value = 25; lg.gain.value = 60;          // вибрато 25 Гц
  lfo.connect(lg); lg.connect(o.frequency);
  ramp(g, t, 0.15, 0.004, 0.12);
  o.connect(g).connect(comp);
  o.start(t); o.stop(t + 0.16); lfo.start(t); lfo.stop(t + 0.16);
}
function sndCaseRing(delay) {                                                // звон падающей гильзы
  const ac = audio(); if (!ac || muted) return;
  const t0 = ac.currentTime + delay;
  [2600, 3400, 5200].forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f * (0.97 + Math.random() * 0.06);
    const t = t0 + i * 0.012;
    ramp(g, t, 0.07, 0.001, 0.06);
    o.connect(g).connect(comp); g.connect(echoBus);
    o.start(t); o.stop(t + 0.09);
  });
}
const sndDry = () => { sndClack(0, 0.5, 3100, 0.035); };                     // сухой щелчок вхолостую
const sndMagBtn = () => { sndClack(0, 0.32, 2600, 0.03); };
const sndMagIn = () => { sndClack(0, 0.55, 900, 0.09); sndClack(0.01, 0.3, 2200, 0.05); };
const sndBoltSlam = () => { sndClack(0, 0.85, 1500, 0.09); sndClack(0.004, 0.6, 3600, 0.05); sndBoing(0.01); };
const sndCycle = () => { sndClack(0.012, 0.28, 1900, 0.05); sndBoing(0.016); };

// ---------- СОСТОЯНИЕ И АНИМАЦИЯ ----------
const RZ = 0.011, RA = 1.5 * Math.PI / 180, BOLT = 0.09;                    // 11 мм, 1.5 градуса, 90 мм
const magRelease = gun && gun.getObjectByName('magRelease');
const boltCatch = gun && gun.getObjectByName('boltCatch');
let ammo = 30, firing = false, reloading = false, boltHeld = false;
let shotT = 1e9, boltT = 1e9, flashT = 1e9, relT = 1e9, lastShot = -1e9, shake = 0, relBolt = 1e9;
let magVisible = true, magY = 0;
function shoot(now) {
  if (!gun || reloading) return;
  if (ammo <= 0) { boltHeld = true; firing = false; sndDry(); return; }
  ammo--; lastShot = now;
  shotT = 0; boltT = 0; flashT = 0; shake = 0.002;                          // камера дрожит на 2 мм
  flash.rotation.z = Math.random() * Math.PI * 2;
  const s = 0.8 + Math.random() * 0.5;
  flash.scale.setScalar(s);
  sndShot(); sndCycle();
  ejectCase(); sndCaseRing(0.25 + Math.random() * 0.25);
  if (ammo === 0) boltHeld = true;
}
function startFire() { if (!reloading) { firing = true; shoot(performance.now()); } }
function startReload() {
  if (!gun || reloading) return;
  reloading = true; firing = false; relT = 0; relBolt = 1e9;
  sndMagBtn();
}

let prev = performance.now();
const camOff = new THREE.Vector3();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  const ms = dt * 1000;
  shotT += ms; boltT += ms; flashT += ms; relT += ms; relBolt += ms;

  if (firing && !reloading && now - lastShot >= 75) shoot(now);             // 800 выстрелов/мин

  if (gun) {
    let tiltZ = 0, tiltX = 0;
    if (reloading) {
      const t = relT;
      const k = t < 1900 ? Math.min(1, t / 170) : Math.max(0, 1 - (t - 1900) / 200);
      tiltZ = -0.20 * k; tiltX = 0.05 * k;                                   // наклон оружия
      if (magRelease) magRelease.position.x = t < 260 ? -0.0022 : 0;
      if (t < 100) { magY = 0; magVisible = true; }
      else if (t < 800) {                                                    // магазин падает СТРОГО ВНИЗ
        const f = (t - 100) / 700;
        magY = -2.6 * f * f;
        magVisible = magY > -0.34;
      } else if (t < 960) {                                                  // новый магазин снизу вертикально
        const f = (t - 800) / 160;
        magY = -0.19 * (1 - f) * (1 - f);
        magVisible = true;
        if (magY > -0.001 && relBolt > 1e8) { magY = 0; }
      } else { magY = 0; magVisible = true; }
      if (t >= 960 && t - ms < 960) sndMagIn();                              // чёткий удар ладони
      if (t >= 1700 && t - ms < 1700) { sndBoltSlam(); relBolt = 0; }        // удар по затворной задержке
      if (boltCatch) boltCatch.position.x = (t >= 1700 && t < 1840) ? 0.0018 : 0;
      if (t >= 2100 && t - ms < 2100) { ammo = 30; boltHeld = false; }
      if (t >= 2300) { reloading = false; relT = 1e9; }
    } else {
      if (magRelease) magRelease.position.x = 0;
      if (boltCatch) boltCatch.position.x = 0;
      magY = 0; magVisible = true;
    }
    parts.magazine.position.y = magY;
    parts.magazine.visible = magVisible;

    let kick = 0;                                                            // отдача считается от ИСХОДНОЙ позы
    if (shotT <= 75) kick = shotT <= 28 ? shotT / 28 : Math.pow(1 - (shotT - 28) / 47, 2);
    gun.position.set(0, 0, RZ * kick);
    gun.rotation.set(RA * kick + tiltX, 0, tiltZ);

    let bz = 0;
    if (relBolt <= 30) bz = BOLT * (1 - relBolt / 30);                       // срыв вперёд за 30 мс
    else if (boltHeld && !(reloading && relT >= 1700)) bz = BOLT;            // затворная задержка
    else if (boltT <= 73) bz = boltT <= 38 ? BOLT * (boltT / 38) : BOLT * (1 - (boltT - 38) / 35);
    parts.bolt.position.z = bz;

    const want = (firing && !reloading && ammo >= 0 && shotT < 60) ? 0.30 : 0;
    parts.trigger.rotation.x += (want - parts.trigger.rotation.x) * Math.min(1, dt * 22);

    if (flashT <= 28) {
      flash.visible = true;
      flashLight.intensity = 26 * (1 - flashT / 28);
    } else if (flash.visible) { flash.visible = false; flashLight.intensity = 0; }
  }

  for (let i = cases.length - 1; i >= 0; i--) {                              // гильзы по параболе, 1.2 с
    const c = cases[i];
    c.life += dt;
    c.v.y -= 9.81 * dt;
    c.m.position.addScaledVector(c.v, dt);
    c.m.rotation.x += c.w.x * dt; c.m.rotation.y += c.w.y * dt; c.m.rotation.z += c.w.z * dt;
    if (c.life > 1.2) { scene.remove(c.m); cases.splice(i, 1); }
  }

  if (homing) {
    camera.position.lerp(homePos, 0.14);
    controls.target.lerp(homeTarget, 0.14);
    if (camera.position.distanceTo(homePos) < 0.0015) { camera.position.copy(homePos); controls.target.copy(homeTarget); homing = 0; }
  }
  controls.update();

  shake = Math.max(0, shake - dt * 0.02);
  if (shake > 0.00002) {
    camOff.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(shake * 2);
    camera.position.add(camOff);
    renderer.render(scene, camera);
    camera.position.sub(camOff);
  } else {
    renderer.render(scene, camera);
  }
}
requestAnimationFrame(tick);

// ---------- ИНТЕРФЕЙС ----------
const fireBtn = document.getElementById('fire');
const reloadBtn = document.getElementById('reload');
const sndBtn = document.getElementById('snd');
const sndWave = document.getElementById('sndWave');
fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); fireBtn.classList.add('on'); audio(); startFire(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  fireBtn.addEventListener(ev, () => { fireBtn.classList.remove('on'); firing = false; }));
reloadBtn.addEventListener('pointerdown', e => { e.preventDefault(); reloadBtn.classList.add('on'); audio(); startReload(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  reloadBtn.addEventListener(ev, () => reloadBtn.classList.remove('on')));
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) { fireBtn.classList.add('on'); audio(); startFire(); } }
  else if (e.code === 'KeyR') { reloadBtn.classList.add('on'); audio(); startReload(); }
});
addEventListener('keyup', e => {
  if (e.code === 'Space') { fireBtn.classList.remove('on'); firing = false; }
  else if (e.code === 'KeyR') reloadBtn.classList.remove('on');
});
sndBtn.addEventListener('click', () => {
  muted = !muted;
  sndWave.style.display = muted ? 'none' : '';
  if (!muted) audio();
});
</script>
</body>
