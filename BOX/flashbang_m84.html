/* ---- Бросок: граната уходит от камеры и кувыркается ---- */
const _yawInv = new THREE.Quaternion();
function throwGrenade() {
  if (thrown || phase !== 'fuse') return;
  thrown = true;

  camera.getWorldDirection(_fwd);
  _fwd.y = 0;
  if (_fwd.lengthSq() < 1e-6) _fwd.set(0, 0, -1);
  _fwd.normalize();

  _yawInv.copy(yaw.quaternion).invert();
  const dir = _fwd.clone().applyQuaternion(_yawInv);

  phys.free = true;
  phys.on = true;
  phys.topple = false;
  phys.settle = 0;
  phys.p.copy(rig.position);
  phys.q.copy(rig.quaternion);
  phys.v.set(
    dir.x * rnd(2.6, 3.4) + rnd(-0.15, 0.15),
    rnd(1.5, 2.1),
    dir.z * rnd(2.6, 3.4) + rnd(-0.15, 0.15)
  );
  phys.av.set(rnd(-6, 6), rnd(-8, 8), rnd(9, 17));
  wob = null;

  P.body.getWorldPosition(_ringW);
  SND.throwSwish(1, audioPan(_ringW));
  setHint('Граната в полёте · рвётся там, где ляжет');
  syncButton();
}

/* ============================================================================
   ПОДРЫВ
============================================================================ */
const _bp = new THREE.Vector3();
function detonate() {
  phase = 'blast';
  blastT = 0;
  canReset = false;

  P.body.updateWorldMatrix(true, false);
  P.body.getWorldPosition(_bp);
  blastDist = Math.max(0.22, audioDist(_bp));
  distF = clamp(1.15 / blastDist, 0.12, 1.1);

  SND.fuseStop();
  SND.bang({ dist: blastDist, pan: audioPan(_bp) });

  // Корпус: если стоял — подбрасывает и валит набок; если летел — получает импульс
  if (phys.free) {
    phys.v.y += rnd(0.9, 1.5);
    phys.v.x += rnd(-0.5, 0.5);
    phys.v.z += rnd(-0.5, 0.5);
    phys.av.set(rnd(-16, 16), rnd(-16, 16), rnd(-16, 16));
    phys.settle = 0;
  } else {
    const f = rnd(0, Math.PI * 2);
    phys.axis.set(Math.cos(f), 0, Math.sin(f));
    phys.perp.set(-Math.sin(f), 0, Math.cos(f));
    const dir = Math.random() < 0.5 ? -1 : 1;
    phys.on = true; phys.topple = true;
    phys.y = rig.position.y; phys.vy = rnd(0.62, 1.0);
    phys.tilt = 0; phys.w = dir * rnd(2.6, 4.4);
    phys.drift = 0; phys.vd = dir * rnd(0.10, 0.22);
  }
  wob = null;

  // Объекты вспышки
  blast.visible = true;
  afterLight.visible = true;
  glare.visible = true;
  core.visible = true;
  shock.visible = true;
  shockRing.visible = true;
  scorch.visible = true;
  scorch.position.set(_bp.x, 0.0008, _bp.z);
  fuseJet.visible = false;
  fuseLight.intensity = 0;
  for (const p of portFx) { p.gs.visible = true; p.cone.visible = true; }
  shake = REDUCED ? 0 : 0.024 * distF;
  shakeT = 0;
  smokeTimer = 0;

  // Выброс через окна: искры, факелы, дым и твёрдые частицы
  const wp = new THREE.Vector3(), wd = new THREE.Vector3();
  const perPort = Math.floor((SHARD_MAX - 14) / model.ports.length);
  for (const port of model.ports) {
    wp.copy(port.pos).applyMatrix4(P.body.matrixWorld);
    wd.copy(port.dir).transformDirection(P.body.matrixWorld);
    for (let i = 0; i < 44; i++) {
      const s = rnd(2.2, 8.5);
      spawnSpark({
        x: wp.x, y: wp.y, z: wp.z,
        vx: wd.x * s + rnd(-1.1, 1.1),
        vy: wd.y * s + rnd(-0.7, 1.5),
        vz: wd.z * s + rnd(-1.1, 1.1),
        life: rnd(0.22, 1.15), size: rnd(0.0035, 0.013), grav: 1, drag: 2.6,
        alpha: 1, seed: rnd(0, 10), tint: [1, 1, 1], t: 0,
      });
    }
    for (let i = 0; i < perPort; i++) {
      const s = rnd(3.5, 11);
      spawnShard(
        wp.x + wd.x * 0.004, wp.y + wd.y * 0.004, wp.z + wd.z * 0.004,
        wd.x * s + rnd(-1.4, 1.4),
        wd.y * s + rnd(0.2, 2.6),
        wd.z * s + rnd(-1.4, 1.4),
        rnd(0.85, 1)
      );
    }
    for (let i = 0; i < 2; i++) {
      const s = rnd(0.8, 2.0);
      spawnSmoke({
        x: wp.x, y: wp.y, z: wp.z,
        vx: wd.x * s + rnd(-0.25, 0.25), vy: rnd(0.1, 0.6), vz: wd.z * s + rnd(-0.25, 0.25),
        s0: 0.03, s1: rnd(0.24, 0.42), life: rnd(2.6, 4.4), alpha: rnd(0.30, 0.50),
        buoy: 0.34, drag: 1.7, lit: 0.55, dark: 0.50,
      });
    }
  }

  // Выхлоп вверх через запал
  const fp = new THREE.Vector3(0, DIM.fuseTop, 0).applyMatrix4(P.body.matrixWorld);
  for (let i = 0; i < 90; i++) {
    const a = rnd(0, Math.PI * 2), r = rnd(0.2, 2.2);
    spawnSpark({
      x: fp.x, y: fp.y, z: fp.z,
      vx: Math.cos(a) * r, vy: rnd(1.6, 6.5), vz: Math.sin(a) * r,
      life: rnd(0.3, 1.2), size: rnd(0.003, 0.010), grav: 1, drag: 2.2,
      alpha: 1, seed: rnd(0, 10), tint: [1, 1, 1], t: 0,
    });
  }
  for (let i = 0; i < 14; i++) {
    const a = rnd(0, Math.PI * 2), r = rnd(0.4, 2.6);
    spawnShard(fp.x, fp.y, fp.z, Math.cos(a) * r, rnd(3.5, 8.5), Math.sin(a) * r, rnd(0.8, 1));
  }

  // Пыль, сорванная ударной волной с пола
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * Math.PI * 2 + rnd(-0.12, 0.12);
    const s = rnd(1.1, 2.4);
    spawnSmoke({
      x: _bp.x + Math.cos(a) * 0.05, y: 0.012, z: _bp.z + Math.sin(a) * 0.05,
      vx: Math.cos(a) * s, vy: rnd(0.05, 0.3), vz: Math.sin(a) * s,
      s0: 0.05, s1: rnd(0.30, 0.50), life: rnd(2.2, 3.6), alpha: rnd(0.18, 0.30),
      buoy: 0.10, drag: 2.6, lit: 0.35, dark: 0.40,
    });
  }

  // Ударная волна расшвыривает уже лежащие чеку и скобу
  for (const f of flying) {
    const d = f.obj.position.distanceTo(_bp);
    if (d < 0.5) {
      const k = (0.5 - d) / 0.5;
      f.sleep = false;
      f.rest = Math.max(f.rest, 0.3);
      f.v.set(
        (f.obj.position.x - _bp.x) * 6 * k + rnd(-0.3, 0.3),
        1.6 * k + rnd(0.2, 0.9),
        (f.obj.position.z - _bp.z) * 6 * k + rnd(-0.3, 0.3)
      );
      f.w.set(rnd(-18, 18), rnd(-18, 18), rnd(-18, 18));
    }
  }
}

/* ---- Физика отлетевших деталей (чека с кольцом, скоба) ---- */
function updateFlying(dt) {
  for (const f of flying) {
    if (f.sleep) continue;
    f.v.y -= 9.81 * dt;
    f.v.multiplyScalar(Math.max(0, 1 - 0.35 * dt));
    f.obj.position.addScaledVector(f.v, dt);
    f.obj.rotation.x += f.w.x * dt;
    f.obj.rotation.y += f.w.y * dt;
    f.obj.rotation.z += f.w.z * dt;
    if (f.obj.position.y <= f.r) {
      f.obj.position.y = f.r;
      if (f.v.y < 0) {
        const imp = -f.v.y;
        f.v.y = imp * f.rest;
        f.v.x *= 0.66; f.v.z *= 0.66;
        f.w.multiplyScalar(0.5);
        f.rest *= 0.62;
        if (imp > 0.2) SND.clank(clamp(imp * 0.55, 0.08, 0.9), audioPan(f.obj.position), f.kind);
        if (imp < 0.12) { f.sleep = true; f.v.set(0, 0, 0); f.w.set(0, 0, 0); }
      }
    }
  }
}

/* ---- Физика корпуса ---- */
const _upL = new THREE.Vector3();
const _upT = new THREE.Vector3();
const _qFix = new THREE.Quaternion();
const _qTarget = new THREE.Quaternion();

function updateBody(dt) {
  if (wob && !phys.on) {
    wob.t += dt;
    const amp = 0.028 * Math.exp(-wob.t * 4.2);
    rig.quaternion.setFromAxisAngle(new THREE.Vector3(0, 0, 1), amp * Math.sin(wob.t * 34));
    if (wob.t > 1.8) { wob = null; rig.quaternion.identity(); }
  }
  if (!phys.on) return;

  /* --- Свободный полёт после броска --- */
  if (phys.free) {
    phys.v.y -= 9.81 * dt;
    phys.v.multiplyScalar(Math.max(0, 1 - 0.12 * dt));
    phys.p.addScaledVector(phys.v, dt);

    const wl = phys.av.length();
    if (wl > 0.0001) {
      _sv.copy(phys.av).multiplyScalar(1 / wl);
      _dq.setFromAxisAngle(_sv, wl * dt);
      phys.q.premultiply(_dq).normalize();
    }

    if (phys.p.y <= DIM.R) {
      phys.p.y = DIM.R;
      const imp = -phys.v.y;
      if (imp > 0) {
        phys.v.y = imp * 0.3;
        phys.v.x *= 0.7; phys.v.z *= 0.7;
        phys.av.multiplyScalar(0.55);
        if (imp > 0.25) SND.clank(clamp(imp * 0.45, 0.1, 1), audioPan(rig.position), 'body');
        if (imp < 0.35 && phys.v.lengthSq() < 0.35) phys.settle += 1;
      }
    }

    // успокоение: цилиндр ложится на бок
    if (phys.settle > 0 && phys.p.y <= DIM.R + 1e-4) {
      phys.v.multiplyScalar(Math.max(0, 1 - 3.2 * dt));
      phys.av.multiplyScalar(Math.max(0, 1 - 3.6 * dt));
      _upL.set(0, 1, 0).applyQuaternion(phys.q);
      _upT.set(_upL.x, 0, _upL.z);
      if (_upT.lengthSq() < 1e-6) _upT.set(1, 0, 0);
      _upT.normalize();
      _qFix.setFromUnitVectors(_upL.normalize(), _upT);
      _qTarget.copy(_qFix).multiply(phys.q);
      phys.q.slerp(_qTarget, Math.min(1, 4.5 * dt));
      if (phys.v.lengthSq() < 0.0004 && phys.av.lengthSq() < 0.02) {
        phys.q.copy(_qTarget);
        phys.v.set(0, 0, 0);
        phys.av.set(0, 0, 0);
        phys.on = false;
      }
    }

    rig.position.copy(phys.p);
    rig.quaternion.copy(phys.q);
    return;
  }

  /* --- Подрыв на месте: подскок и завал набок --- */
  phys.vy -= 9.81 * dt;
  phys.y += phys.vy * dt;
  phys.tilt += phys.w * dt;
  phys.drift += phys.vd * dt;

  const ct = Math.abs(Math.cos(phys.tilt)), st = Math.abs(Math.sin(phys.tilt));
  const hmin = DIM.H * ct + DIM.R * st;

  if (phys.y <= hmin) {
    phys.y = hmin;
    if (phys.vy < 0) {
      const imp = -phys.vy;
      phys.vy = imp * 0.26;
      phys.w *= 0.62;
      phys.vd *= 0.72;
      if (imp > 0.18) SND.clank(clamp(imp * 0.5, 0.1, 1), audioPan(rig.position), 'body');
      if (imp < 0.07) phys.vy = 0;
    }
    if (phys.topple) {
      const target = Math.round((phys.tilt - Math.PI / 2) / Math.PI) * Math.PI + Math.PI / 2;
      phys.w += (target - phys.tilt) * 24 * dt;
      phys.w *= Math.max(0, 1 - 3.4 * dt);
      phys.vd *= Math.max(0, 1 - 2.6 * dt);
      if (Math.abs(phys.vy) < 0.02 && Math.abs(phys.w) < 0.06 && Math.abs(target - phys.tilt) < 0.02) {
        phys.tilt = target; phys.w = 0; phys.vy = 0; phys.vd = 0; phys.on = false;
      }
    }
  }

  rig.position.set(phys.perp.x * phys.drift, phys.y, phys.perp.z * phys.drift);
  rig.quaternion.setFromAxisAngle(phys.axis, phys.tilt);
}

/* ---- Горение замедлителя ---- */
const _fp = new THREE.Vector3();
let fusePanTick = 0;
function updateFuse(dt, time) {
  const k = clamp(fuseT / SEQ.DELAY, 0, 1);
  const flick = 0.55 + 0.45 * Math.sin(time * 41) * Math.sin(time * 17.3);
  fuseLight.intensity = (0.9 + 1.5 * flick) * (1 + 0.5 * k);
  fuseJet.visible = true;
  fuseJet.material.opacity = 0.35 + 0.35 * flick;
  const s = (0.016 + 0.012 * flick) * (1 + 0.35 * k);
  fuseJet.scale.set(s, s, 1);

  fusePanTick -= dt;
  if (fusePanTick <= 0) {
    fusePanTick = 0.1;
    _fp.set(0, DIM.fuseTop, 0).applyMatrix4(P.body.matrixWorld);
    SND.fusePan(audioPan(_fp));
  }

  fuseTimer -= dt;
  if (fuseTimer <= 0) {
    fuseTimer = 0.03 + Math.random() * 0.04;
    _fp.set(0, DIM.fuseTop, 0).applyMatrix4(P.body.matrixWorld);
    const n = 1 + (Math.random() * 2 | 0);
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), r = rnd(0.05, 0.5);
      spawnSpark({
        x: _fp.x, y: _fp.y, z: _fp.z,
        vx: Math.cos(a) * r, vy: rnd(0.35, 1.5), vz: Math.sin(a) * r,
        life: rnd(0.25, 0.7), size: rnd(0.0015, 0.004), grav: 1, drag: 2.8,
        alpha: 0.85, seed: rnd(0, 10), tint: [1, 0.95, 0.8], t: 0,
      });
    }
    if (Math.random() < 0.45) {
      spawnSmoke({
        x: _fp.x, y: _fp.y + 0.004, z: _fp.z,
        vx: rnd(-0.05, 0.05), vy: rnd(0.10, 0.22), vz: rnd(-0.05, 0.05),
        s0: 0.012, s1: rnd(0.07, 0.13), life: rnd(1.4, 2.3), alpha: rnd(0.10, 0.20),
        buoy: 0.22, drag: 1.9, lit: 0.12, dark: 0.46,
      });
    }
  }
}

/* ============================================================================
   КАДР ВСПЫШКИ И ПОСЛЕДСТВИЙ
============================================================================ */
const veilEl = $('veil');
const ghostEl = $('ghost');
const _wc = new THREE.Vector3();

function updateBlast(dt) {
  const t = blastT;
  P.body.getWorldPosition(_wc);

  /* Свет вспышки: фронт 3 мс → полка → спад + догорание */
  if (t < 0.9) {
    const rise = clamp(t / 0.0025, 0, 1);
    const hold = t < 0.012 ? 1 : Math.exp(-(t - 0.012) / 0.05);
    const second = 0.42 * Math.exp(-Math.pow((t - 0.028) / 0.017, 2));
    blast.intensity = 1380 * rise * (hold + second) + 95 * Math.exp(-t / 0.22);
  } else if (blast.visible) {
    blast.intensity = 0;
    blast.visible = false;
  }

  afterLight.intensity = 18 * Math.exp(-t / 0.5) + 3.8 * Math.exp(-t / 2.4);
  if (t > 7 && afterLight.visible) { afterLight.intensity = 0; afterLight.visible = false; }

  model.setGlow(30 * Math.exp(-t / 0.085) + 3.6 * Math.exp(-t / 0.9) + 0.4 * Math.exp(-t / 4));

  /* Раскалённое ядро: распухает за 60 мс и гаснет */
  if (t < 0.4) {
    const cs = 0.02 + 0.36 * (1 - Math.exp(-t / 0.028));
    core.position.copy(_wc);
    core.scale.set(cs, cs, 1);
    core.material.opacity = clamp(1.25 * Math.exp(-t / 0.055), 0, 1);
    const warm = clamp(t / 0.12, 0, 1);
    core.material.color.setRGB(1, 1 - 0.30 * warm, 1 - 0.72 * warm);
  } else if (core.visible) { core.visible = false; }

  /* Ореол */
  if (t < 1.2) {
    const gs = 0.04 + 1.25 * (1 - Math.exp(-t / 0.04));
    glare.position.copy(_wc);
    glare.scale.set(gs, gs, 1);
    glare.material.opacity = clamp(1.2 * Math.exp(-t / 0.095) + 0.22 * Math.exp(-t / 0.5), 0, 1);
  } else if (glare.visible) { glare.visible = false; }

  /* Факелы из окон: основной выброс + дожиг */
  if (t < 0.9) {
    const pulse1 = Math.exp(-t / 0.045);
    const pulse2 = 0.45 * Math.exp(-Math.pow((t - 0.055) / 0.03, 2));
    const jl = 0.35 + 2.8 * (1 - Math.exp(-t / 0.012)) * (pulse1 + pulse2);
    const jo = clamp(1.15 * (pulse1 + pulse2), 0, 1);
    const gsz = 0.018 + 0.22 * (1 - Math.exp(-t / 0.03));
    const go = clamp(1.2 * Math.exp(-t / 0.11) + 0.25 * Math.exp(-t / 0.45), 0, 1);
    for (const p of portFx) {
      p.cone.scale.set(0.6 + 0.9 * jo, Math.max(0.2, jl), 0.6 + 0.9 * jo);
      p.cone.material.opacity = jo;
      p.cone.visible = jo > 0.01;
      p.gs.scale.set(gsz, gsz, 1);
      p.gm.opacity = go;
    }
  } else {
    for (const p of portFx) { p.cone.visible = false; p.gm.opacity = 0; p.gs.visible = false; }
  }

  /* Фронт ударной волны в воздухе — быстрый и тонкий */
  if (t < 0.7) {
    const r = 0.025 + 3.4 * (1 - Math.exp(-t / 0.13));
    shock.position.copy(_wc);
    shock.scale.setScalar(r);
    shockMat.uniforms.uOp.value = 0.95 * Math.exp(-t / 0.12);
  } else if (shock.visible) { shock.visible = false; }

  /* Кольцо по полу */
  if (t < 1.3) {
    ringMat.uniforms.uR.value = clamp(1.05 * (1 - Math.exp(-t / 0.26)), 0, 1);
    ringMat.uniforms.uW.value = 0.03 + 0.17 * t;
    ringMat.uniforms.uOp.value = 0.65 * Math.exp(-t / 0.36);
    shockRing.position.set(_wc.x, 0.0016, _wc.z);
  } else if (shockRing.visible) { shockRing.visible = false; }

  /* Копоть */
  scorch.material.opacity = clamp(0.72 * (1 - Math.exp(-t / 0.18)), 0, 0.72);

  /* Экспозиция: пересвет → провал → адаптация */
  const eBoost = 1.6 * distF;
  renderer.toneMappingExposure = t < 0.05
    ? EXPO_BASE + eBoost * (t / 0.05)
    : 0.62 + (EXPO_BASE - 0.62) * (1 - Math.exp(-(t - 0.05) / 1.7)) + eBoost * Math.exp(-(t - 0.05) / 0.13);

  /* Засвет экрана */
  let op;
  if (REDUCED) {
    op = 0.5 * Math.exp(-t / 0.45) * distF;
  } else {
    const a = t < 0.012 ? t / 0.012 : Math.exp(-(t - 0.012) / 0.105);
    const b = 0.32 * Math.exp(-t / 1.25);
    op = Math.max(a, b) * clamp(distF * 1.05, 0.15, 1);
  }
  op = clamp(op, 0, 1);
  veilEl.style.opacity = op.toFixed(3);
  if (op > 0.002) {
    const w = clamp((t - 0.12) / 0.7, 0, 1);
    veilEl.style.background = 'rgb(255,' + Math.round(255 - 8 * w) + ',' + Math.round(255 - 3 * w) + ')';
  }

  /* Остаточный образ на сетчатке — холодное пятно, дополнительное к вспышке */
  if (ghostEl && !REDUCED) {
    const g = 0.55 * distF * (1 - Math.exp(-t / 0.16)) * Math.exp(-t / 2.6);
    ghostEl.style.opacity = clamp(g, 0, 1).toFixed(3);
  }

  /* Дым из окон после хлопка */
  if (t < 5.5) {
    smokeTimer -= dt;
    if (smokeTimer <= 0) {
      smokeTimer = t < 0.5 ? 0.022 : 0.055 + t * 0.05;
      const port = model.ports[(Math.random() * model.ports.length) | 0];
      const wp = port.pos.clone().applyMatrix4(P.body.matrixWorld);
      const wd = port.dir.clone().transformDirection(P.body.matrixWorld);
      const sp = rnd(0.12, 0.55) * (t < 0.5 ? 2.2 : 1);
      spawnSmoke({
        x: wp.x, y: wp.y, z: wp.z,
        vx: wd.x * sp + rnd(-0.06, 0.06), vy: rnd(0.10, 0.3), vz: wd.z * sp + rnd(-0.06, 0.06),
        s0: 0.02, s1: rnd(0.16, 0.34), life: rnd(2.4, 4.2),
        alpha: clamp(0.34 - t * 0.045, 0.05, 0.34),
        buoy: 0.30, drag: 1.6, lit: t < 0.4 ? 0.4 : 0, dark: 0.46,
      });
    }
  }
}

/* ============================================================================
   ИНТЕРФЕЙС
============================================================================ */
const goBtn = $('go'), sttEl = $('stt'), dotEl = $('dot'), sndBtn = $('snd'), hintEl = $('hint');

function setStatus(text, cls) {
  sttEl.textContent = text;
  dotEl.className = cls || '';
}
function setHint(text) {
  if (hintEl) hintEl.textContent = text;
}

function syncButton() {
  goBtn.classList.toggle('reset', phase === 'after');
  if (phase === 'ready') {
    goBtn.disabled = false;
    goBtn.textContent = 'Выдернуть чеку';
  } else if (phase === 'pull') {
    goBtn.disabled = true;
    goBtn.textContent = 'Тяни…';
  } else if (phase === 'armed') {
    goBtn.disabled = false;
    goBtn.textContent = 'Отпустить скобу';
  } else if (phase === 'fuse') {
    goBtn.disabled = thrown;
    goBtn.textContent = thrown ? 'Летит…' : 'Бросок';
  } else if (phase === 'blast') {
    goBtn.disabled = true;
    goBtn.textContent = 'Подрыв';
  } else {
    goBtn.disabled = !canReset;
    goBtn.textContent = 'Сброс';
  }
}

/* Автоматическое выдергивание — для клавиатуры и тех, кто не хочет тянуть вручную */
function startAutoPull() {
  if (phase !== 'ready' || autoPull || springBack) return;
  phase = 'pull';
  idleSpin = false;
  haloOn = false;
  autoPull = { t: 0, from: clamp(lastPinT(), 0, 1) };
  SND.warm();
  SND.pinDragStart();
  setStatus('Срыв чеки…', 'warn');
  setHint('В следующий раз можно потянуть кольцо мышью');
  syncButton();
}

function primaryAction() {
  if (phase === 'ready') startAutoPull();
  else if (phase === 'armed') releaseSpoon();
  else if (phase === 'fuse' && !thrown) throwGrenade();
  else if (phase === 'after' && canReset) reset();
}

function reset() {
  phase = 'ready';
  seqT = 0; blastT = 0; fuseT = 0;
  pinFree = spoonFree = strikerFired = thrown = false;
  canReset = false;
  wob = null;
  shake = 0;
  drag = null;
  autoPull = null;
  springBack = null;
  haloOn = true;
  controls.enabled = true;
  distF = 1;

  // Детали — на место
  P.body.add(P.pin);
  P.pin.position.copy(BASE.pin.pos);
  P.pin.rotation.copy(BASE.pin.rot);
  P.pin.quaternion.setFromEuler(P.pin.rotation);
  P.ring.position.copy(BASE.ring.pos);
  P.ring.rotation.copy(BASE.ring.rot);
  P.body.add(P.spoon);
  P.spoon.position.copy(BASE.spoon.pos);
  P.spoon.rotation.copy(BASE.spoon.rot);
  P.spoon.quaternion.setFromEuler(P.spoon.rotation);
  P.striker.position.copy(BASE.striker.pos);
  P.striker.rotation.copy(BASE.striker.rot);
  flying.length = 0;

  // Корпус — стоя
  phys.on = false; phys.topple = false; phys.free = false; phys.settle = 0;
  phys.y = REST_UP; phys.vy = 0; phys.tilt = 0; phys.w = 0; phys.drift = 0; phys.vd = 0;
  phys.p.set(0, REST_UP, 0); phys.v.set(0, 0, 0); phys.av.set(0, 0, 0);
  phys.q.identity();
  rig.position.set(0, REST_UP, 0);
  rig.quaternion.identity();
  controls.target.set(0, REST_UP, 0);

  // Эффекты
  clearParticles();
  clearShards();
  model.setGlow(0);
  blast.intensity = 0; blast.visible = false;
  afterLight.intensity = 0; afterLight.visible = false;
  fuseLight.intensity = 0;
  fuseJet.visible = false; fuseJet.material.opacity = 0;
  glare.visible = false; glare.material.opacity = 0;
  core.visible = false; core.material.opacity = 0;
  shock.visible = false; shockMat.uniforms.uOp.value = 0;
  shockRing.visible = false; ringMat.uniforms.uOp.value = 0;
  scorch.visible = false; scorch.material.opacity = 0;
  scorch.position.set(0, 0.0008, 0);
  for (const p of portFx) {
    p.cone.visible = false; p.cone.material.opacity = 0;
    p.gs.visible = false; p.gm.opacity = 0;
  }
  renderer.toneMappingExposure = EXPO_BASE;
  veilEl.style.opacity = '0';
  veilEl.style.background = '#fff';
  if (ghostEl) ghostEl.style.opacity = '0';
  SND.reset();

  setStatus('Готова · чека на месте', '');
  setHint('Потяни кольцо мышью · Space — действие · R — сброс');
  syncButton();
}

goBtn.addEventListener('click', () => { SND.warm(); primaryAction(); });

sndBtn.addEventListener('click', () => {
  SND.enabled = !SND.enabled;
  const on = SND.enabled;
  sndBtn.classList.toggle('off', !on);
  sndBtn.setAttribute('aria-label', on ? 'Звук: включён' : 'Звук: выключен');
  $('w1').hidden = !on;
  $('w2').hidden = !on;
  $('wx').hidden = on;
  if (on) SND.warm();
});

window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (e.code === 'Space' || e.code === 'Enter') {
    if (document.activeElement === goBtn || document.activeElement === sndBtn) return;
    e.preventDefault();
    SND.warm();
    primaryAction();
  } else if (e.code === 'KeyR') {
    if (tag === 'BUTTON') return;
    e.preventDefault();
    if (phase !== 'ready') reset();
  } else if (e.code === 'KeyM') {
    if (tag === 'BUTTON') return;
    e.preventDefault();
    sndBtn.click();
  }
});

controls.addEventListener('start', () => { idleSpin = false; });

/* ============================================================================
   КАМЕРА И ЦИКЛ
============================================================================ */
function fitCamera() {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = new THREE.Vector3(0, REST_UP, 0);
  const radius = Math.max(size.x, size.y, size.z) * 0.5;
  const dist = (radius / Math.sin((camera.fov * Math.PI) / 360)) * 1.28;
  const dir = new THREE.Vector3(0.62, 0.42, 0.78).normalize();
  camera.position.copy(center).addScaledVector(dir, dist);
  controls.target.copy(center);
  controls.minDistance = radius * 1.25;
  controls.maxDistance = radius * 22;
  controls.update();
}
fitCamera();

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  sparkMat.uniforms.uPix.value =
    renderer.domElement.height / (2 * Math.tan((camera.fov * Math.PI) / 360));
}
window.addEventListener('resize', onResize);
onResize();

const clock = new THREE.Clock();
const shakeOff = new THREE.Vector3();
const _camT = new THREE.Vector3();
let statusTick = 0;

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 1 / 24);
  const time = clock.elapsedTime;

  /* ---- Подсказка у кольца ---- */
  if (haloOn && phase === 'ready' && !REDUCED) {
    P.ring.getWorldPosition(_ringW);
    ringHalo.position.copy(_ringW);
    ringHalo.visible = true;
    const pu = 0.5 + 0.5 * Math.sin(time * 2.3);
    ringHalo.material.opacity = hoverRing ? 0.30 : 0.10 + 0.10 * pu;
    const hs = 0.030 + 0.006 * pu + (hoverRing ? 0.010 : 0);
    ringHalo.scale.set(hs, hs, 1);
  } else if (ringHalo.visible) {
    ringHalo.visible = false;
  }

  /* ---- Автоматическое выдергивание с кнопки ---- */
  if (autoPull) {
    autoPull.t += dt;
    const k = clamp((autoPull.t - SEQ.PULL0) / (SEQ.PULL1 - SEQ.PULL0), 0, 1);
    const t = autoPull.from + (1 - autoPull.from) * k;
    applyPin(pullCurve(t));
    P.ring.getWorldPosition(_ringW);
    SND.pinDrag(dt * 1.25, t, audioPan(_ringW));
    if (k >= 1) {
      autoPull = null;
      SND.pinDragEnd();
      releasePin();
    }
  }

  /* ---- Чека возвращается, если не дотянули ---- */
  if (springBack) {
    springBack.t += dt;
    const k = clamp(springBack.t / 0.26, 0, 1);
    const e = 1 - Math.pow(1 - k, 3);
    applyPin(springBack.from * (1 - e));
    if (k >= 1) { applyPin(0); springBack = null; }
  }

  /* ---- Замедлитель ---- */
  if (phase === 'fuse') {
    seqT += dt;
    fuseT += dt;
    const k = clamp(seqT / 0.03, 0, 1);
    P.striker.position.y = BASE.striker.pos.y - MM(4) * k;
    updateFuse(dt, time);

    statusTick -= dt;
    if (statusTick <= 0) {
      statusTick = 0.06;
      const left = Math.max(0, SEQ.DELAY - fuseT);
      setStatus('Замедлитель · ' + left.toFixed(1).replace('.', ',') + ' с', 'hot');
    }
    if (fuseT >= SEQ.DELAY) {
      detonate();
      setStatus('Подрыв', 'hot');
      syncButton();
    }
  }

  /* ---- Вспышка и последствия ---- */
  if (phase === 'blast' || phase === 'after') {
    blastT += dt;
    updateBlast(dt);
    if (phase === 'blast' && blastT > 0.5) {
      phase = 'after';
      setStatus('Корпус цел · дым из окон', 'cold');
      setHint('Корпус M84 не дробится: наружу летят газ и горящий состав');
      syncButton();
    }
    if (phase === 'after' && !canReset && blastT > 1.6) {
      canReset = true;
      syncButton();
    }
  }

  /* ---- Камера ведẽт брошенную гранату ---- */
  if (thrown && phase !== 'ready') {
    P.body.getWorldPosition(_camT);
    controls.target.lerp(_camT, Math.min(1, 2.4 * dt));
  }

  /* ---- Физика и частицы ---- */
  updateBody(dt);
  updateFlying(dt);
  updateShards(dt, time);
  updateSparks(dt, time);
  updateSmoke(dt);
  SND.update(dt, time);

  /* ---- Медленный показ в покое ---- */
  if (idleSpin && phase === 'ready' && !REDUCED) yaw.rotation.y += dt * 0.13;

  controls.update();

  /* ---- Тряска от ударной волны: несколько частот + крен ---- */
  if (shake > 0.00002) {
    shakeT += dt;
    shake *= Math.max(0, 1 - dt / 0.30);
    const s = shake;
    const st = shakeT;
    shakeOff.set(
      s * (0.62 * Math.sin(st * 61.7 + 0.3) + 0.38 * Math.sin(st * 23.3 + 1.7)),
      s * (0.62 * Math.sin(st * 53.1 + 2.1) + 0.38 * Math.sin(st * 19.7 + 0.5)),
      s * 0.5 * Math.sin(st * 37.9 + 4.2)
    );
    const roll = s * 2.4 * Math.sin(st * 27.3 + 1.1);
    camera.position.add(shakeOff);
    camera.rotateZ(roll);
    renderer.render(scene, camera);
    camera.rotateZ(-roll);
    camera.position.sub(shakeOff);
  } else {
    renderer.render(scene, camera);
  }
}

/* ============================================================================
   СТАРТ
============================================================================ */
renderer.compile(scene, camera);
$('loader').hidden = true;
$('hud').hidden = false;
$('tag').hidden = false;
$('snd').hidden = false;
$('hint').hidden = false;
setStatus('Готова · чека на месте', '');
setHint('Потяни кольцо мышью · Space — действие · R — сброс');
syncButton();
tick();
</script>
