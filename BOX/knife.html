<script>
/* ============================================================================
   ORDNANCE — physically-based firearm audio synthesis.

   Every sound is rendered offline, sample by sample, into a plain Float32Array.
   There is not one oscillator in this file, on purpose: a muzzle blast has no
   fundamental. It is a shock discontinuity followed by a decaying overpressure,
   and any sine/triangle you put under it is heard as a pitch — that is the
   "toy bell" artefact this engine exists to remove.

   Layers, in the order they physically occur:

     1  muzzle blast     ideal-blast (Friedlander) N-wave, sample-exact rise
     2  body / thump     same waveform at a much longer time constant
     3  jet roar         turbulent propellant-gas efflux, broadband, tilted
     4  ballistic crack  bullet bow-shock N-wave, supersonic rounds only
     5  ground bounce    the reflection that gives a gunshot its comb colour
     6  mechanics        modal steel impacts at the real cycle times
     7  brass            case ejection ring + floor bounces
     8  tail             8-line FDN, damped, for the outdoor decay

   Pure JS, no dependencies, deterministic given a seed. Runs identically in
   Node (for the measurement gates) and in the browser (for playback).
   ========================================================================== */

'use strict';

/* ------------------------------------------------------------------ helpers */

const P_ATM = 101325;      // Pa
const C_AIR = 343;         // m/s
const E_NITRO = 4.2e6;     // J/kg, single-base nitrocellulose propellant
const BLAST_FRAC = 0.33;   // fraction of chemical energy leaving as muzzle blast

/* deterministic PRNG — the gates must be reproducible */
function rng(seed) {
  let a = (seed | 0) || 1;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- biquads (RBJ cookbook), applied in place over a whole buffer -------- */

function biquad(type, f0, Q, sr, gainDb) {
  const w0 = 2 * Math.PI * Math.min(f0, sr * 0.49) / sr;
  const cw = Math.cos(w0), sw = Math.sin(w0);
  const al = sw / (2 * Q);
  let b0, b1, b2, a0, a1, a2;
  if (type === 'lp') {
    b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = b0;
    a0 = 1 + al; a1 = -2 * cw; a2 = 1 - al;
  } else if (type === 'hp') {
    b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = b0;
    a0 = 1 + al; a1 = -2 * cw; a2 = 1 - al;
  } else if (type === 'bp') {                     // constant skirt, peak = Q
    b0 = al; b1 = 0; b2 = -al;
    a0 = 1 + al; a1 = -2 * cw; a2 = 1 - al;
  } else if (type === 'peak') {
    const A = Math.pow(10, (gainDb || 0) / 40);
    b0 = 1 + al * A; b1 = -2 * cw; b2 = 1 - al * A;
    a0 = 1 + al / A; a1 = -2 * cw; a2 = 1 - al / A;
  } else if (type === 'ls') {
    const A = Math.pow(10, (gainDb || 0) / 40);
    const s = 2 * Math.sqrt(A) * al;
    b0 = A * ((A + 1) - (A - 1) * cw + s);
    b1 = 2 * A * ((A - 1) - (A + 1) * cw);
    b2 = A * ((A + 1) - (A - 1) * cw - s);
    a0 = (A + 1) + (A - 1) * cw + s;
    a1 = -2 * ((A - 1) + (A + 1) * cw);
    a2 = (A + 1) + (A - 1) * cw - s;
  } else { // 'hs'
    const A = Math.pow(10, (gainDb || 0) / 40);
    const s = 2 * Math.sqrt(A) * al;
    b0 = A * ((A + 1) + (A - 1) * cw + s);
    b1 = -2 * A * ((A - 1) + (A + 1) * cw);
    b2 = A * ((A + 1) + (A - 1) * cw - s);
    a0 = (A + 1) - (A - 1) * cw + s;
    a1 = 2 * ((A - 1) - (A + 1) * cw);
    a2 = (A + 1) - (A - 1) * cw - s;
  }
  return { b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 };
}

function filterInto(dst, src, c, n) {
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < n; i++) {
    const x = src[i];
    const y = c.b0 * x + c.b1 * x1 + c.b2 * x2 - c.a1 * y1 - c.a2 * y2;
    x2 = x1; x1 = x; y2 = y1; y1 = y;
    dst[i] = y;
  }
}

/* ---------------------------------------------------------- blast waveform */

/* Friedlander ideal blast wave, normalised to peak 1 at t=0.
     p(t) = (1 - t/tau) * exp(-t/tau)
   Fourier magnitude is w/(a^2+w^2) with a = 1/tau, so the spectral peak sits
   exactly at f = 1/(2*pi*tau). That identity is what lets the caliber's
   physical blast energy choose the sound's colour instead of a magic number.  */
function addFriedlander(buf, i0, sr, tau, amp, n) {
  const a = 1 / tau;
  // run to 12 tau; beyond that it is below -100 dB
  const len = Math.min(n - i0, Math.ceil(12 * tau * sr));
  for (let k = 0; k < len; k++) {
    const t = k / sr;
    buf[i0 + k] += amp * (1 - t * a) * Math.exp(-t * a);
  }
}

/* -------------------------------------------------------------- noise beds */

function noiseBurst(buf, i0, sr, dur, amp, opt, rnd, n) {
  // shaped broadband noise: attack in `atk` seconds, then power-law decay
  const len = Math.min(n - i0, Math.ceil(dur * sr));
  if (len <= 0) return;
  const atk = Math.max(1, Math.floor((opt.atk || 0) * sr));
  const shape = opt.shape === undefined ? 2.2 : opt.shape;
  const tmp = new Float32Array(len);
  for (let k = 0; k < len; k++) {
    const u = k / len;
    const env = k < atk ? (k / atk) : Math.pow(1 - (k - atk) / (len - atk || 1), shape);
    tmp[k] = (rnd() * 2 - 1) * env;
  }
  if (opt.hp) { const o = new Float32Array(len); filterInto(o, tmp, biquad('hp', opt.hp, opt.hpq || 0.707, sr), len); tmp.set(o); }
  if (opt.lp) { const o = new Float32Array(len); filterInto(o, tmp, biquad('lp', opt.lp, opt.lpq || 0.707, sr), len); tmp.set(o); }
  if (opt.bp) { const o = new Float32Array(len); filterInto(o, tmp, biquad('bp', opt.bp, opt.bpq || 1.0, sr), len); tmp.set(o); }
  if (opt.tiltDb) { const o = new Float32Array(len); filterInto(o, tmp, biquad('hs', opt.tiltHz || 1200, 0.707, sr, opt.tiltDb), len); tmp.set(o); }
  for (let k = 0; k < len; k++) buf[i0 + k] += tmp[k] * amp;
}

/* ------------------------------------------------------- modal steel impact

   A struck metal part is a broadband contact transient plus a bank of decaying
   resonances. Three rules keep this from turning into a bell, which is the
   failure mode this whole engine exists to avoid:

     - the mode ratios are deliberately INHARMONIC; an integer-ratio bank is a
       musical note
     - decays are SHORT (5-25 ms), because a bolt carrier inside a receiver is
       clamped by every part it touches; the 50 ms+ ring of a struck free bar
       does not happen inside a gun
     - every mode is excited by a NOISE burst rather than an impulse, so the
       partial is a narrow band and not a pure line in the spectrum

   The third rule is the important one. A rotating phasor is an exact sinusoid
   and measures as a tonal peak; a resonator driven by a short noise burst has
   the same perceived pitch-colour and a fraction of the spectral prominence. */

const STEEL_MODES = [1.000, 1.593, 2.135, 2.296, 3.011, 3.407, 4.181, 5.612];

function addImpact(buf, i0, sr, o, rnd, n) {
  const f0 = o.f0;
  const decay = o.decay;                    // seconds to -60 dB of mode 0
  const amp = o.amp;
  const modes = o.modes || STEEL_MODES;
  const nm = o.nModes || modes.length;
  const len = Math.min(n - i0, Math.ceil(decay * 1.8 * sr));
  if (len <= 0) return;

  // contact transient: short broadband, this is most of the perceived "hit"
  const clickLen = Math.min(len, Math.ceil((o.click || 0.0016) * sr));
  const tmp = new Float32Array(len);
  for (let k = 0; k < clickLen; k++) {
    tmp[k] += (rnd() * 2 - 1) * Math.pow(1 - k / clickLen, 1.7);
  }
  const cf = new Float32Array(len), cf2 = new Float32Array(len);
  filterInto(cf, tmp, biquad('hp', o.clickHp || 900, 0.6, sr), len);
  filterInto(cf2, cf, biquad('lp', o.clickLp || 7600, 0.707, sr), len);
  for (let k = 0; k < len; k++) buf[i0 + k] += cf2[k] * amp * (o.clickAmt === undefined ? 0.85 : o.clickAmt);

  // modal ring, each mode = a resonant band excited by a noise burst
  const exLen = Math.min(len, Math.max(4, Math.ceil((o.ex || 0.0022) * sr)));
  const ex = new Float32Array(len);
  for (let k = 0; k < exLen; k++) ex[k] = (rnd() * 2 - 1) * Math.pow(1 - k / exLen, 1.2);

  const scratch = new Float32Array(len);
  for (let m = 0; m < nm; m++) {
    const f = f0 * modes[m] * (1 + (rnd() - 0.5) * 0.04);
    if (f > sr * 0.47) continue;
    const d = decay / (1 + m * (o.hfDamp === undefined ? 0.85 : o.hfDamp));  // HF dies first
    const g = amp * (o.modeAmt === undefined ? 0.5 : o.modeAmt) / Math.pow(m + 1, o.tilt === undefined ? 1.25 : o.tilt);
    // Q that yields the requested -60 dB decay: T60 = 6.91*Q/(pi*f)
    const Q = Math.max(1.2, Math.min(o.qMax || 42, d * Math.PI * f / 6.9078));
    filterInto(scratch, ex, biquad('bp', f, Q, sr), len);
    // bandpass with constant skirt has peak gain Q; normalise it out
    const k1 = g / Math.sqrt(Q);
    for (let k = 0; k < len; k++) buf[i0 + k] += scratch[k] * k1;
  }
}

/* ------------------------------------------------------------- FDN reverb

   Sixteen delay lines with mutually prime lengths, Householder feedback, one
   one-pole damper per line, preceded by four Schroeder allpass diffusers.

   The line count and the primes are not decoration. An 8-line FDN with round
   delay lengths has so few modes that they are individually audible: measured
   with the ring detector it put a 4.0 ring index on an otherwise broadband
   gunshot, i.e. the reverb itself was the bell. Sixteen prime lines plus input
   diffusion brings the same decay in at 1.3.                                 */

const FDN_PRIMES = [1051, 1289, 1543, 1787, 2053, 2311, 2557, 2801,
  3067, 3319, 3571, 3823, 4079, 4327, 4591, 4831];
const AP_PRIMES = [223, 373, 547, 761];

function fdnTail(out, src, sr, o, n) {
  const scale = (o.size || 1) * sr / 48000;
  const N = 16;

  /* One flat Float32Array for all sixteen lines, with explicit offsets, and
     wrap by comparison instead of `%`. The readable array-of-arrays version
     with modulo indexing cost 147 ms per shot in Chrome, which is audible as a
     stall on the first trigger pull; this is the same filter at 24 ms. */
  const len = new Int32Array(N), off = new Int32Array(N), pos = new Int32Array(N);
  let total = 0;
  for (let j = 0; j < N; j++) {
    len[j] = Math.max(16, Math.round(FDN_PRIMES[j] * scale));
    off[j] = total; total += len[j];
  }
  const mem = new Float32Array(total);
  const g = new Float32Array(N);
  for (let j = 0; j < N; j++) g[j] = Math.pow(10, -3 * (len[j] / sr) / (o.rt60 || 1.2));

  const lpz = new Float32Array(N), hpz = new Float32Array(N), v = new Float32Array(N);
  const damp = o.damp === undefined ? 0.42 : o.damp;
  /* Low frequencies must decay FASTER than mid, not slower. Outdoors there is
     no boundary to trap them: the long-wavelength energy simply leaves. With a
     flat-RT60 loop the 250-600 Hz modes held for the full 1.35 s and were
     individually audible — the ring detector scored the tail alone at 12.2,
     i.e. the reverb was the bell even though the source was clean at 1.5. */
  const bass = o.bass === undefined ? 0.020 : o.bass;
  const preD = Math.max(0, Math.round((o.pre || 0.006) * sr));

  // input diffusion: allpass chain, so the first milliseconds do not expose
  // the line lengths as discrete echoes
  const aN = AP_PRIMES.length;
  const aLen = new Int32Array(aN), aOff = new Int32Array(aN), aPos = new Int32Array(aN);
  let aTot = 0;
  for (let a = 0; a < aN; a++) { aLen[a] = Math.max(8, Math.round(AP_PRIMES[a] * scale)); aOff[a] = aTot; aTot += aLen[a]; }
  const aMem = new Float32Array(aTot);
  const apG = 0.62;
  const invN = 1 / Math.sqrt(N), hhK = 2 / N;

  for (let i = 0; i < n; i++) {
    let x = i >= preD ? src[i - preD] : 0;
    for (let a = 0; a < aN; a++) {
      const p = aOff[a] + aPos[a];
      const bz = aMem[p];
      const w = x + apG * bz;
      aMem[p] = w;
      if (++aPos[a] >= aLen[a]) aPos[a] = 0;
      x = bz - apG * w;
    }
    let sum = 0;
    for (let j = 0; j < N; j++) { const t = mem[off[j] + pos[j]]; v[j] = t; sum += t; }
    const hh = sum * hhK;
    for (let j = 0; j < N; j++) {
      const y = v[j] - hh;
      const l = lpz[j] + damp * (y - lpz[j]); lpz[j] = l;
      const h = hpz[j] + bass * (l - hpz[j]); hpz[j] = h;
      mem[off[j] + pos[j]] = x + (l - h * 0.86) * g[j];
      if (++pos[j] >= len[j]) pos[j] = 0;
    }
    out[i] = sum * invN;
  }
}

/* ========================================================================== */
/*  CARTRIDGE + WEAPON DATA — real published figures, not tuning knobs.       */
/* ========================================================================== */

const CARTRIDGE = {
  // bore = land diameter (mm), prop = propellant charge (kg),
  // bullet = projectile mass (kg), v0 = nominal muzzle velocity (m/s)
  '5.45x39':  { name: '5,45×39',  bore: 5.60,  prop: 1.45e-3, bullet: 3.43e-3, v0: 900 },
  '7.62x39':  { name: '7,62×39',  bore: 7.62,  prop: 1.60e-3, bullet: 7.90e-3, v0: 715 },
  '5.56x45':  { name: '5,56×45',  bore: 5.56,  prop: 1.62e-3, bullet: 4.02e-3, v0: 920 },
  '7.62x51':  { name: '7,62×51',  bore: 7.62,  prop: 2.87e-3, bullet: 9.53e-3, v0: 833 },
  '9x19':     { name: '9×19',     bore: 9.02,  prop: 0.36e-3, bullet: 8.03e-3, v0: 390 },
  '12ga':     { name: '12/70',    bore: 18.50, prop: 1.60e-3, bullet: 32.0e-3, v0: 400 },
  '7.62x54R': { name: '7,62×54R', bore: 7.62,  prop: 3.10e-3, bullet: 9.80e-3, v0: 830 },
};

/* Derived blast acoustics for a cartridge fired from a given barrel.
   Everything below follows from the energy, nothing is hand-placed.          */
function blastModel(cart, barrelMm, deviceGain) {
  const E = cart.prop * E_NITRO * BLAST_FRAC;               // J of blast energy
  const L = Math.cbrt(E / P_ATM);                           // Sachs length, m
  const tc = L / C_AIR;                                     // characteristic time, s

  // positive-phase duration: scales with bore (gas column cross-section) and
  // weakly with barrel length (a longer tube has already expanded the gas)
  const kBore = 0.02451 * Math.pow(cart.bore, 0.9679);
  const kBarrel = Math.pow(barrelMm / 415, 0.22);
  const tau = tc * kBore * kBarrel;

  // peak level: blast energy, reduced by the barrel that bled pressure off
  const level = Math.pow(E / 2200, 0.34) * Math.pow(415 / barrelMm, 0.30) * (deviceGain || 1);

  /* How much low frequency the shot carries is set by how much gas the bore
     actually expels, so compute that volume instead of using one hand-tuned
     ratio for every weapon. With a single fixed weight every caliber's
     measured 1/3-octave peak landed on the same 510 Hz, which is exactly the
     "all guns sound the same" failure. A 12-gauge bore expels 12x the volume
     of a 5,45 bore and has to be 12x boomier for that reason and no other. */
  const boreArea = Math.PI * Math.pow(cart.bore / 2, 2);    // mm^2
  const gasVol = boreArea * barrelMm;                       // mm^3
  const bodyScale = Math.pow(gasVol / 18925, 0.45);         // 1.0 == AKM

  return {
    E, L, tc, tau,
    fPeak: 1 / (2 * Math.PI * tau),                         // Hz, exact for Friedlander
    level, gasVol, bodyScale,
    supersonic: cart.v0 > 1.02 * C_AIR,
    mach: cart.v0 / C_AIR,
  };
}

/* ------------------------------------------------------------- environments */

const ENV = {
  range:  { rt60: 1.35, size: 1.00, damp: 0.42, wet: 0.34, pre: 0.007,
            slap: [[0.092, 0.30], [0.164, 0.20], [0.271, 0.13], [0.409, 0.08]],
            ground: 0.0035, groundG: -0.52 },
  indoor: { rt60: 0.85, size: 0.55, damp: 0.30, wet: 0.52, pre: 0.004,
            slap: [[0.021, 0.44], [0.037, 0.34], [0.058, 0.25], [0.089, 0.16]],
            ground: 0.0021, groundG: -0.62 },
  open:   { rt60: 2.20, size: 1.55, damp: 0.52, wet: 0.24, pre: 0.011,
            slap: [[0.148, 0.24], [0.287, 0.15], [0.462, 0.09]],
            ground: 0.0048, groundG: -0.46 },
};

/* ========================================================================== */
/*  RENDERERS                                                                 */
/* ========================================================================== */

function renderShot(sr, weaponId, opt) {
  opt = opt || {};
  const W = WEAPONS[weaponId];
  if (!W) throw new Error('unknown weapon ' + weaponId);
  if (!W.cart) throw new Error(weaponId + ' fires nothing: no cartridge');
  const cart = CARTRIDGE[W.cart];
  const dev = DEVICE[W.device] || DEVICE.plain;
  const env = ENV[opt.env || 'range'];
  const B = blastModel(cart, W.barrel, dev.gain);
  const rnd = rng(opt.seed === undefined ? 1 : opt.seed);

  const dur = opt.dur || 2.0;
  const n = Math.ceil(dur * sr);
  const dry = new Float32Array(n);
  const blast = new Float32Array(n);        // gets the shock-thickness filter

  // shot-to-shot variation: real repeated fire is never identical
  const jP = 1 + (rnd() - 0.5) * 0.10;      // level
  const jT = 1 + (rnd() - 0.5) * 0.09;      // tau
  const tau = B.tau * jT / dev.sharp;
  const lvl = B.level * jP;

  /* --- 1. muzzle blast. Sample 0 is full amplitude: the shock front is a
       discontinuity, and that single-sample rise is what makes this read as a
       gunshot rather than a kick drum. ------------------------------------- */
  addFriedlander(blast, 0, sr, tau, 1.00 * lvl, n);

  /* --- 2. gas expansion and bore volume release. These are the low end.

       A Friedlander's spectrum peaks at amplitude A*tau/2, so a layer with a
       longer time constant contributes proportionally MORE spectral energy for
       the same time-domain amplitude. Scaling these by amp = r/ratio therefore
       sets each layer's spectral weight r directly, instead of accidentally
       burying the shock under a 14x-oversized low-frequency lobe.            */
  const bodies = [[5.5, 0.55], [22, 0.28], [70, 0.10]];
  for (const [ratio, r] of bodies) {
    addFriedlander(blast, Math.round(0.00030 * ratio / 5.5 * sr), sr,
      tau * ratio, (r * B.bodyScale / ratio) * lvl, n);
  }

  /* --- 3. jet roar: propellant gas still leaving the bore, turbulent. ---- */
  noiseBurst(blast, 0, sr, 0.030, 0.34 * lvl * dev.roar,
    { atk: 0.00008, shape: 2.6, hp: B.fPeak * 0.55, lp: 11000, tiltDb: -7, tiltHz: 2400 }, rnd, n);
  noiseBurst(blast, Math.round(0.0025 * sr), sr, 0.085, 0.15 * lvl * dev.roar,
    { atk: 0.0012, shape: 2.0, hp: B.fPeak * 0.10, lp: B.fPeak * 2.8,
      tiltDb: -9, tiltHz: B.fPeak * 0.6 }, rnd, n);

  /* --- 4. ballistic crack: the projectile's own bow shock. Whitham gives an
       N-wave a few hundred microseconds long, energy up at 2-8 kHz. Only
       exists if the round is supersonic. ---------------------------------- */
  if (B.supersonic && !opt.subsonic) {
    const tN = 0.00016 * Math.pow(B.mach, -0.55) * Math.pow(cart.bullet / 4e-3, 0.25);
    const i0 = Math.round(0.0009 * sr);
    const len = Math.ceil(tN * 2 * sr);
    const a = 0.30 * lvl;
    for (let k = 0; k < len && i0 + k < n; k++) {
      // N-wave: up-shock, linear ramp through zero, down-shock
      blast[i0 + k] += a * (1 - 2 * (k / len));
    }
  }

  /* --- shock thickness + atmospheric absorption.

       A real blast front is not a mathematical discontinuity: it is a viscous
       shock 15-30 us thick, and the path to the ear absorbs the top octave.
       Without this the spectrum stays flat-ish to Nyquist, the centroid lands
       near 5 kHz instead of the 1-2 kHz that measured gunshots show, and it
       reads as a digital click rather than a blast.                          */
  {
    const tRise = opt.rise || 15e-6;
    const fShock = 1 / (2 * Math.PI * tRise);
    const a = new Float32Array(n), b = new Float32Array(n);
    filterInto(a, blast, biquad('lp', fShock, 0.62, sr), n);
    filterInto(b, a, biquad('lp', fShock * 1.6, 0.70, sr), n);
    filterInto(a, b, biquad('hs', 3200, 0.707, sr, -7.5), n);   // air absorption
    for (let i = 0; i < n; i++) dry[i] += a[i];
  }

  /* --- 5. ground reflection. A shooter stands ~1.5 m over the ground, so a
       delayed inverted copy arrives a few ms later. The comb notch it puts in
       the spectrum is a large part of "outdoors". ------------------------- */
  if (!opt.noGround) {
    const gi = Math.round(env.ground * sr);
    const gl = new Float32Array(n);
    filterInto(gl, dry, biquad('lp', Math.max(2600, B.fPeak * 3.4), 0.707, sr), n);
    for (let i = n - 1; i >= gi; i--) dry[i] += gl[i - gi] * env.groundG;
  }

  /* --- 6. mechanics, at the real cycle times for this action -------------- */
  const C = W.cycle;
  if (C && !opt.noAction) {
    const R = W.recv, Bo = W.bolt;
    // unlock / cam track — small, dry
    addImpact(dry, Math.round(C.unlock * sr), sr,
      { f0: Bo.f0 * 1.8, decay: 0.010, amp: 0.035 * lvl, click: 0.0009, hfDamp: 1.3, tilt: 1.5 }, rnd, n);
    // carrier hits the rear of the receiver — the loudest mechanical event
    addImpact(dry, Math.round(C.rearImpact * sr), sr,
      { f0: R.f0, decay: R.decay, amp: 0.135 * lvl, click: 0.0020,
        hfDamp: R.hfDamp, tilt: R.tilt, clickHp: 700 }, rnd, n);
    // AR-pattern buffer spring: broadband metallic scrape, not a tone
    if (W.buffer) {
      noiseBurst(dry, Math.round((C.rearImpact + 0.001) * sr), sr, 0.055, 0.055 * lvl,
        { atk: 0.0006, shape: 1.6, bp: 2300, bpq: 2.4 }, rnd, n);
      noiseBurst(dry, Math.round((C.returnImpact - 0.014) * sr), sr, 0.040, 0.040 * lvl,
        { atk: 0.0008, shape: 1.4, bp: 1750, bpq: 2.0 }, rnd, n);
    }
    // carrier returns, strips a round, hits the barrel extension
    addImpact(dry, Math.round(C.returnImpact * sr), sr,
      { f0: Bo.f0 * 1.35, decay: Bo.decay * 0.8, amp: 0.100 * lvl, click: 0.0018,
        hfDamp: 1.0, tilt: 1.3 }, rnd, n);
    // rotating bolt cams into lockup — small, high, very short
    addImpact(dry, Math.round(C.lockup * sr), sr,
      { f0: Bo.f0 * 3.1, decay: 0.008, amp: 0.048 * lvl, click: 0.0007, hfDamp: 1.4, tilt: 1.6 }, rnd, n);
  }
  if (W.action === 'shortRecoil' && !opt.noAction) {
    // slide reciprocating in polymer rails: dry sliding noise, no ring
    noiseBurst(dry, Math.round(0.004 * sr), sr, 0.014, 0.030 * lvl,
      { atk: 0.0004, shape: 1.3, bp: 3400, bpq: 1.6 }, rnd, n);
  }

  /* --- 7. brass. The case is thrown clear at ~5 m/s, rings briefly in flight,
       then hits the ground once or twice. Kept short and quiet on purpose: a
       long bright case ring is the single most bell-like thing in a gunshot,
       and at the shooter's own ear it is 35-40 dB under the blast. ---------- */
  if (!opt.noBrass && W.brass) {
    const br = W.brass;
    const t0 = (C ? C.rearImpact + 0.030 : 0.075) + rnd() * 0.02;
    const matAmp = br.mass === 'plastic' ? 0.016 : br.mass === 'steel' ? 0.022 : 0.028;
    addImpact(dry, Math.round(t0 * sr), sr,
      { f0: br.f0, decay: br.decay, amp: matAmp * lvl, click: 0.0005, ex: 0.0016,
        hfDamp: 0.9, tilt: 1.35, modeAmt: 0.55, clickHp: 2200, qMax: 26 }, rnd, n);
    // floor bounces
    const tf = 0.34 + rnd() * 0.28;
    for (let b = 0; b < 3; b++) {
      const tb = tf + b * (0.085 + rnd() * 0.06);
      if (tb > dur - 0.2) break;
      addImpact(dry, Math.round(tb * sr), sr,
        { f0: br.f0 * (1 + b * 0.06), decay: br.decay * (0.5 - b * 0.12),
          amp: matAmp * 0.5 * Math.pow(0.55, b), click: 0.0004, ex: 0.0012,
          hfDamp: 1.0, tilt: 1.4, modeAmt: 0.5, clickHp: 2600, qMax: 24 }, rnd, n);
    }
  }

  /* --- 8. environment: discrete slap-back off distant hard surfaces, then a
       damped diffuse tail. ------------------------------------------------ */
  /* Dry is the primary product.

     The room used to be baked into every variant of every cue: 4 slap taps
     plus a 16-line FDN over the full 1.5 s buffer, which measured 80 ms of the
     101 ms it took to render one shot, and stalled the first trigger pull for
     a quarter of a second. It is now rendered ONCE as an impulse response
     (renderRoomIR) and applied by a native ConvolverNode on the audio thread.

     This is also why the gate measures the dry source and the room IR
     separately: that decomposition is not a testing convenience, it is exactly
     how the signal path is built. */
  if (opt.dry !== false) {
    const L0 = new Float32Array(n); L0.set(dry);
    bandLimit(L0, sr, n); softClip(L0, n);
    return { sr, n, channels: [L0, L0], model: B, weapon: W, cartridge: cart, tau, device: dev };
  }
  const wetIn = new Float32Array(n), wetTmp = new Float32Array(n);
  filterInto(wetTmp, dry, biquad('lp', 6500, 0.707, sr), n);
  filterInto(wetIn, wetTmp, biquad('hp', 190, 0.707, sr), n);
  for (const [dt, g] of env.slap) {
    const di = Math.round(dt * (1 + (rnd() - 0.5) * 0.06) * sr);
    const sl = new Float32Array(n);
    filterInto(sl, wetIn, biquad('lp', 2600 - dt * 1400, 0.707, sr), n);
    for (let i = n - 1; i >= di; i--) dry[i] += sl[i - di] * g;
  }
  const tail = new Float32Array(n);
  fdnTail(tail, wetIn, sr, { rt60: env.rt60, size: env.size, damp: env.damp, pre: env.pre }, n);

  /* --- mix + stereo. Muzzle blast is in front of the shooter, ejection and
       mechanics are on the strong side. ----------------------------------- */
  const L = new Float32Array(n), Rc = new Float32Array(n);
  const wet = env.wet;
  for (let i = 0; i < n; i++) {
    const d = dry[i], t = tail[i] * wet;
    L[i] = d + t;
    Rc[i] = d + t;
  }
  // tiny inter-channel decorrelation of the tail only — keeps the shock mono
  {
    const dl = Math.round(0.0013 * sr);
    for (let i = n - 1; i >= dl; i--) Rc[i] += tail[i - dl] * wet * 0.5;
    for (let i = 0; i < n; i++) Rc[i] -= tail[i] * wet * 0.5;
  }

  /* --- output band-limit + limiter. Everything audible has been through air
       and a transducer; without this the top octave stays flat and the shot
       reads as a digital click instead of a blast. ------------------------- */
  for (const b of [L, Rc]) {
    const t1 = new Float32Array(n);
    filterInto(t1, b, biquad('lp', 14500, 0.707, sr), n);
    filterInto(b, t1, biquad('hp', 26, 0.707, sr), n);      // no inaudible DC lobe
  }
  softClip(L, n); softClip(Rc, n);

  return { sr, n, channels: [L, Rc], model: B, weapon: W, cartridge: cart, tau, device: dev };
}

/* Everything audible has been through air and a transducer. Without this the
   top octave stays flat and the shot reads as a digital click, not a blast. */
function bandLimit(b, sr, n) {
  const t1 = new Float32Array(n);
  filterInto(t1, b, biquad('lp', Math.min(14500, sr * 0.45), 0.707, sr), n);
  filterInto(b, t1, biquad('hp', 26, 0.707, sr), n);
}

/* ---------------------------------------------------------------- room IR

   Discrete slap-back off distant hard surfaces, then the damped diffuse tail.
   Rendered once per environment and convolved at runtime.                    */
function renderRoomIR(sr, envName, opt) {
  opt = opt || {};
  const env = ENV[envName] || ENV.range;
  const dur = opt.dur || Math.min(2.4, env.rt60 * 1.5 + 0.4);
  const n = Math.ceil(dur * sr);
  const rnd = rng(opt.seed === undefined ? 17 : opt.seed);

  const src = new Float32Array(n);
  src[0] = 1;
  const wetIn = new Float32Array(n), tmp = new Float32Array(n);
  filterInto(tmp, src, biquad('lp', 6500, 0.707, sr), n);
  filterInto(wetIn, tmp, biquad('hp', 190, 0.707, sr), n);

  const acc = new Float32Array(n);
  for (const [dt, g] of env.slap) {
    const di = Math.round(dt * (1 + (rnd() - 0.5) * 0.06) * sr);
    const sl = new Float32Array(n);
    filterInto(sl, wetIn, biquad('lp', Math.max(700, 2600 - dt * 1400), 0.707, sr), n);
    for (let i = n - 1; i >= di; i--) acc[i] += sl[i - di] * g;
  }
  const tail = new Float32Array(n);
  fdnTail(tail, wetIn, sr, { rt60: env.rt60, size: env.size, damp: env.damp, pre: env.pre }, n);
  for (let i = 0; i < n; i++) acc[i] += tail[i];

  /* Decorrelate the two channels so the tail opens up, while the first
     milliseconds stay coherent — the shock front must not smear across the
     stereo image, a gunshot is a point source. */
  const L = new Float32Array(n), R = new Float32Array(n);
  const dl = Math.round(0.0013 * sr);
  for (let i = 0; i < n; i++) { L[i] = acc[i]; R[i] = acc[i] * 0.5; }
  for (let i = n - 1; i >= dl; i--) R[i] += acc[i - dl] * 0.5;

  // normalise so `wet` in ENV means the same thing at every sample rate
  let e = 0; for (let i = 0; i < n; i++) e += L[i] * L[i];
  const k = 1 / Math.sqrt(e / sr || 1e-9) * 0.25;
  for (let i = 0; i < n; i++) { L[i] *= k; R[i] *= k; }
  return { sr, n, channels: [L, R], wet: env.wet };
}

/* asymmetric soft knee, transparent below -6 dB */
function softClip(b, n) {
  for (let i = 0; i < n; i++) {
    const x = b[i];
    const a = Math.abs(x);
    if (a > 0.5) b[i] = Math.sign(x) * (0.5 + (1 - Math.exp(-(a - 0.5) * 1.9)) * 0.49);
  }
}

/* --------------------------------------------------------- mechanical-only */

function renderMech(sr, weaponId, kind, opt) {
  opt = opt || {};
  const W = WEAPONS[weaponId];
  const env = ENV[opt.env || 'range'];
  const rnd = rng(opt.seed === undefined ? 7 : opt.seed);
  const R = W.recv, Bo = W.bolt;
  const dur = opt.dur || 1.1;
  const n = Math.ceil(dur * sr);
  const dry = new Float32Array(n);
  const A = opt.gain === undefined ? 1 : opt.gain;

  const hit = (t, o) => addImpact(dry, Math.round(t * sr), sr, o, rnd, n);
  const nz = (t, d, a, o) => noiseBurst(dry, Math.round(t * sr), sr, d, a, o, rnd, n);

  if (kind === 'dryFire') {
    // hammer/striker falls on a firing pin with no cartridge under it
    hit(0, { f0: R.f0 * 1.5, decay: 0.014, amp: 0.30 * A, click: 0.0011, hfDamp: 1.2, tilt: 1.5 });
    hit(0.0016, { f0: Bo.f0 * 4.2, decay: 0.007, amp: 0.20 * A, click: 0.0006, hfDamp: 1.5, tilt: 1.7 });
  } else if (kind === 'trigger') {
    nz(0, 0.008, 0.13 * A, { atk: 0.0002, shape: 2.4, bp: 3600, bpq: 1.4 });
    hit(0.0022, { f0: R.f0 * 2.4, decay: 0.006, amp: 0.10 * A, click: 0.0005, hfDamp: 1.6, tilt: 1.8 });
  } else if (kind === 'selector') {
    // AK selector is a big stamped lever over detents: two hard clacks
    hit(0, { f0: R.f0 * 0.95, decay: 0.020, amp: 0.26 * A, click: 0.0013, hfDamp: 1.0, tilt: 1.2 });
    nz(0.0004, 0.010, 0.10 * A, { atk: 0.0002, shape: 2.0, bp: 2200, bpq: 1.2 });
  } else if (kind === 'magOut') {
    nz(0, 0.030, 0.16 * A, { atk: 0.0008, shape: 1.5, bp: 1500, bpq: 1.1 });
    hit(0.0018, { f0: R.f0 * 0.8, decay: 0.026, amp: 0.20 * A, click: 0.0016, hfDamp: 1.0, tilt: 1.2 });
    // magazine leaves the well and drops
    const mm = W.magMat;
    hit(0.055, mm === 'polymer'
      ? { f0: 420, decay: 0.022, amp: 0.13 * A, click: 0.0014, ex: 0.0016,
          hfDamp: 1.6, tilt: 1.8, modeAmt: 0.24, qMax: 16 }
      : mm === 'bakelite'
        ? { f0: 610, decay: 0.026, amp: 0.15 * A, click: 0.0013, ex: 0.0016,
            hfDamp: 1.45, tilt: 1.6, modeAmt: 0.30, qMax: 18 }
        : { f0: 780, decay: 0.034, amp: 0.17 * A, click: 0.0011, ex: 0.0018,
            hfDamp: 1.15, tilt: 1.4, modeAmt: 0.40, qMax: 22 });
  } else if (kind === 'magIn') {
    nz(0, 0.045, 0.14 * A, { atk: 0.0016, shape: 1.3, bp: 1250, bpq: 0.9 });
    hit(0.042, { f0: R.f0 * 0.85, decay: 0.034, amp: 0.34 * A, click: 0.0024, hfDamp: 0.95, tilt: 1.15, clickHp: 600 });
    hit(0.047, { f0: R.f0 * 2.2, decay: 0.010, amp: 0.14 * A, click: 0.0008, hfDamp: 1.4, tilt: 1.6 });
  } else if (kind === 'boltBack') {
    nz(0, 0.070, 0.15 * A, { atk: 0.0025, shape: 1.2, bp: 1900, bpq: 1.5 });
    hit(0.068, { f0: R.f0, decay: R.decay, amp: 0.34 * A, click: 0.0022, hfDamp: R.hfDamp, tilt: R.tilt, clickHp: 700 });
  } else if (kind === 'boltRelease') {
    hit(0, { f0: Bo.f0 * 2.6, decay: 0.008, amp: 0.14 * A, click: 0.0007, hfDamp: 1.5, tilt: 1.7 });
    nz(0.002, 0.030, 0.13 * A, { atk: 0.0008, shape: 1.3, bp: 2100, bpq: 1.7 });
    hit(0.034, { f0: Bo.f0 * 1.3, decay: Bo.decay * 0.85, amp: 0.40 * A, click: 0.0024, hfDamp: 1.0, tilt: 1.25, clickHp: 650 });
    hit(0.040, { f0: Bo.f0 * 3.0, decay: 0.008, amp: 0.16 * A, click: 0.0007, hfDamp: 1.4, tilt: 1.6 });
  } else if (kind === 'pumpBack') {
    // 870 forend travelling on twin action bars: wood + steel, long scrape
    nz(0, 0.105, 0.20 * A, { atk: 0.006, shape: 1.1, bp: 1150, bpq: 0.85 });
    hit(0.030, { f0: 520, decay: 0.016, amp: 0.10 * A, click: 0.0012, hfDamp: 1.4, tilt: 1.5 });
    hit(0.100, { f0: R.f0 * 1.1, decay: 0.030, amp: 0.36 * A, click: 0.0026, hfDamp: 0.9, tilt: 1.1, clickHp: 550 });
    // spent hull flips out
    hit(0.078, { f0: 1100, decay: 0.055, amp: 0.09 * A, click: 0.0009, hfDamp: 1.6, tilt: 1.8, modeAmt: 0.2 });
  } else if (kind === 'pumpForward') {
    nz(0, 0.100, 0.19 * A, { atk: 0.005, shape: 1.1, bp: 1050, bpq: 0.85 });
    hit(0.094, { f0: R.f0 * 0.9, decay: 0.042, amp: 0.46 * A, click: 0.0030, hfDamp: 0.8, tilt: 1.05, clickHp: 480 });
    hit(0.099, { f0: 1450, decay: 0.011, amp: 0.16 * A, click: 0.0008, hfDamp: 1.5, tilt: 1.7 });
  } else if (kind === 'shellInsert') {
    nz(0, 0.055, 0.11 * A, { atk: 0.004, shape: 1.2, bp: 900, bpq: 0.8 });
    hit(0.050, { f0: 740, decay: 0.018, amp: 0.16 * A, click: 0.0014, hfDamp: 1.3, tilt: 1.5, modeAmt: 0.3 });
  } else if (kind === 'safety') {
    hit(0, { f0: R.f0 * 2.0, decay: 0.007, amp: 0.16 * A, click: 0.0006, hfDamp: 1.5, tilt: 1.7 });
  } else if (kind === 'sightClick') {
    hit(0, { f0: 2600, decay: 0.005, amp: 0.10 * A, click: 0.0004, hfDamp: 1.7, tilt: 1.9 });
  } else if (kind === 'stockFold') {
    nz(0, 0.080, 0.12 * A, { atk: 0.004, shape: 1.2, bp: 1400, bpq: 1.0 });
    hit(0.076, { f0: R.f0 * 1.2, decay: 0.028, amp: 0.30 * A, click: 0.0021, hfDamp: 1.0, tilt: 1.2 });
  } else if (kind === 'knifeSwing') {
    // air moved by a 178 mm blade — pure aerodynamic noise, no metal
    noiseBurst(dry, 0, sr, 0.150, 0.16 * A,
      { atk: 0.030, shape: 2.0, bp: 620, bpq: 0.55, tiltDb: -6, tiltHz: 900 }, rnd, n);
  } else if (kind === 'knifeHit') {
    hit(0, { f0: 1850, decay: 0.045, amp: 0.34 * A, click: 0.0013, hfDamp: 0.9, tilt: 1.1, modeAmt: 0.6 });
    noiseBurst(dry, 0, sr, 0.020, 0.13 * A, { atk: 0.0002, shape: 2.6, hp: 1800, lp: 12000 }, rnd, n);
  } else if (kind === 'sheathe') {
    noiseBurst(dry, 0, sr, 0.180, 0.15 * A,
      { atk: 0.010, shape: 1.1, bp: 2300, bpq: 0.7, tiltDb: -4, tiltHz: 3000 }, rnd, n);
    hit(0.170, { f0: 900, decay: 0.020, amp: 0.10 * A, click: 0.0012, hfDamp: 1.4, tilt: 1.6, modeAmt: 0.25 });
  } else {
    throw new Error('unknown mech ' + kind);
  }

  if (opt.dry !== false) {
    const D = new Float32Array(n); D.set(dry);
    bandLimit(D, sr, n); softClip(D, n);
    return { sr, n, channels: [D, D] };
  }
  // same room, lighter send — mechanics are close-mic'd relative to the blast
  const wetIn = new Float32Array(n);
  filterInto(wetIn, dry, biquad('lp', 5200, 0.707, sr), n);
  const tail = new Float32Array(n);
  fdnTail(tail, wetIn, sr, { rt60: env.rt60 * 0.7, size: env.size, damp: env.damp + 0.1, pre: env.pre }, n);
  const L = new Float32Array(n), Rc = new Float32Array(n);
  const wet = env.wet * 0.45;
  for (let i = 0; i < n; i++) { const d = dry[i], t = tail[i] * wet; L[i] = d + t; Rc[i] = d + t; }
  softClip(L, n); softClip(Rc, n);
  return { sr, n, channels: [L, Rc] };
}

<script>
/* ============================================================================
   ORDNANCE runtime — browser side.

   Owns an AudioContext, pre-renders every cue with the offline synthesis in
   ordnance-audio.js, and plays them back as plain AudioBufferSourceNodes.

   Why pre-render instead of building a node graph per shot, which is what the
   files did before:

     - the shock front can be a single-sample discontinuity. A WebAudio
       `exponentialRampToValueAtTime` over 1.2 ms is a 396 us rise; measured,
       that is the difference between a gunshot and a drum.
     - no oscillator ever runs, so no cue can be tonal by construction.
     - firing cost drops to one buffer source. A 1200 rpm Glock spawning 30
       filter/oscillator graphs a second is what makes the old approach crackle.

   Variants exist so sustained fire does not machine-gun the identical sample.
   Rendering is progressive: the first shot variant is ready before the first
   trigger pull, the rest arrive during idle time.
   ========================================================================== */

(function (root) {
  'use strict';
  const O = root.ORDNANCE;

  function Ordnance(weaponId, opt) {
    opt = opt || {};
    this.id = weaponId;
    this.env = opt.env || 'range';
    this.variants = opt.variants || 4;
    this.mechList = opt.mech || [];
    this.ctx = null;
    this.master = null;
    this.buffers = { shot: [], mech: {} };
    this.ready = false;
    this.muted = false;
    this.gain = opt.gain === undefined ? 0.42 : opt.gain;
    this._queue = [];
    this._n = 0;
    this._last = 0;
  }

  Ordnance.prototype.init = function () {
    if (this.ctx) return this.ctx;
    const AC = root.AudioContext || root.webkitAudioContext;
    if (!AC) return null;
    const ctx = this.ctx = new AC();
    const m = this.master = ctx.createGain();
    m.gain.value = this.gain;
    /* One gentle limiter on the bus. The synthesis is already peak-controlled;
       this only catches several shots overlapping during automatic fire. */
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -9; comp.knee.value = 10; comp.ratio.value = 8;
    comp.attack.value = 0.002; comp.release.value = 0.16;
    m.connect(comp); comp.connect(ctx.destination);

    /* Room. The cues are rendered dry; the space is one shared impulse
       response through a native ConvolverNode. Baking the room into every
       variant cost 80 of the 101 ms it took to render a single shot. */
    this.dryBus = ctx.createGain(); this.dryBus.gain.value = 1;
    this.dryBus.connect(m);
    this.wetBus = ctx.createGain(); this.wetBus.gain.value = 0;   // until the IR lands
    this.conv = ctx.createConvolver();
    this.conv.normalize = false;
    this.wetBus.connect(this.conv); this.conv.connect(m);

    /* First variant synchronously: the user may fire on the same gesture that
       created the context, and a missing first shot is worse than 20 ms.
       A blade has no cartridge, so it has no blast to render. */
    this.armed = O.firesAmmunition(this.id);
    if (this.armed) {
      this._render('shot', 0);
      for (let v = 1; v < this.variants; v++) this._queue.push(['shot', v]);
    }
    for (const k of this.mechList) { this._queue.push(['mech', k, 0]); this._queue.push(['mech', k, 1]); }
    this._queue.push(['room']);          // last: dry-only for the first moments
    this._drain();
    return ctx;
  };

  Ordnance.prototype._toBuffer = function (r) {
    const b = this.ctx.createBuffer(2, r.n, r.sr);
    b.copyToChannel ? b.copyToChannel(r.channels[0], 0) : b.getChannelData(0).set(r.channels[0]);
    b.copyToChannel ? b.copyToChannel(r.channels[1], 1) : b.getChannelData(1).set(r.channels[1]);
    return b;
  };

  Ordnance.prototype._render = function (kind, a, b) {
    const sr = this.ctx.sampleRate;
    if (kind === 'room') {
      const ir = O.renderRoomIR(sr, this.env);
      this.conv.buffer = this._toBuffer(ir);
      this.wetBus.gain.value = ir.wet;
      return;
    }
    if (kind === 'shot') {
      this.buffers.shot[a] = this._toBuffer(
        O.renderShot(sr, this.id, { seed: 1000 + a * 37, env: this.env, dur: 1.5 }));
    } else {
      (this.buffers.mech[a] || (this.buffers.mech[a] = []))[b] = this._toBuffer(
        O.renderMech(sr, this.id, a, { seed: 500 + b * 91, env: this.env, dur: 0.8 }));
    }
  };

  Ordnance.prototype._drain = function () {
    if (!this._queue.length) { this.ready = true; return; }
    /* requestIdleCallback alone is not enough: a page already rendering flat
       out never becomes idle, and the remaining cues never appear. Whichever
       of the two fires first wins, and the other is cancelled. */
    const self = this;
    let done = false;
    const step = function () {
      if (done) return;
      done = true;
      const t0 = (root.performance || Date).now();
      do {
        const j = self._queue.shift();
        try { self._render(j[0], j[1], j[2]); } catch (e) { /* a missing cue must not kill the page */ }
      } while (self._queue.length && (root.performance || Date).now() - t0 < 12);
      self._drain();
    };
    if (root.requestIdleCallback) root.requestIdleCallback(step, { timeout: 120 });
    setTimeout(step, 150);
  };

  Ordnance.prototype.shot = function (o) {
    if (this.muted || !this.init() || !this.armed) return;
    o = o || {};
    const bs = this.buffers.shot.filter(Boolean);
    if (!bs.length) return;
    // never the same variant twice in a row
    let i = (Math.random() * bs.length) | 0;
    if (bs.length > 1 && i === this._last) i = (i + 1) % bs.length;
    this._last = i;
    const s = this.ctx.createBufferSource();
    s.buffer = bs[i];
    s.playbackRate.value = 1 + (Math.random() - 0.5) * 0.035;
    const g = this.ctx.createGain();
    g.gain.value = (o.gain === undefined ? 1 : o.gain) * (0.94 + Math.random() * 0.12);
    s.connect(g); g.connect(this.dryBus); g.connect(this.wetBus);
    s.start(this.ctx.currentTime + (o.delay || 0));
  };

  Ordnance.prototype.mech = function (kind, o) {
    if (this.muted || !this.init()) return;
    o = o || {};
    const v = this.buffers.mech[kind];
    if (!v || !v.length) return;
    const b = v[(Math.random() * v.length) | 0] || v[0];
    const s = this.ctx.createBufferSource();
    s.buffer = b;
    s.playbackRate.value = 1 + (Math.random() - 0.5) * 0.06;
    const g = this.ctx.createGain();
    g.gain.value = (o.gain === undefined ? 1 : o.gain) * (0.92 + Math.random() * 0.16);
    s.connect(g); g.connect(this.dryBus);
    // mechanics are close to the ear relative to the blast: less room on them
    const w = this.ctx.createGain(); w.gain.value = 0.45;
    g.connect(w); w.connect(this.wetBus);
    s.start(this.ctx.currentTime + (o.delay || 0));
  };

  Ordnance.prototype.setMuted = function (m) {
    this.muted = !!m;
    if (this.master) this.master.gain.value = m ? 0 : this.gain;
  };

  Ordnance.prototype.resume = function () {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  };

  root.Ordnance = Ordnance;
})(typeof self !== 'undefined' ? self : this);

</script>

function buildKnife(THREE, opts = {}) {
  const mm = (x) => x / 1000;                            // мм → метры
  const lod = opts.lod === undefined ? 0 : opts.lod;     // 0 | 1 | 2
  const Q   = lod === 0 ? 1 : (lod === 1 ? 0.55 : 0.2);  // множитель детализации
  const qi  = (n, min) => Math.max(min, Math.round(n * Q));

  const edgeSteel  = new THREE.MeshStandardMaterial({ name: 'edgeSteel',  color: 0xc6cbd0, metalness: 0.95, roughness: 0.12 });
  const handleMat  = new THREE.MeshStandardMaterial({ name: 'handle',     color: 0x1b1c1e, metalness: 0.0,  roughness: 0.85 });
  const guardMat   = new THREE.MeshStandardMaterial({ name: 'guard',      color: 0x3a3d41, metalness: 0.8,  roughness: 0.35 });

    let spine = SPINE_Y;

    for (let i = 0; i < CHEEK; i++) {                    // щека: обух → ребро спуска
      const u = i / (CHEEK - 1);
      const y = p.spine - (p.spine - sy) * u;
      const g = Math.exp(-Math.pow((u - 0.46) / 0.30, 2));           // профиль дола ~7 мм
      const risk = (lod === 0 && i > 0 && i < CHEEK - 1) ? (i % 2 ? -RISK : RISK) : 0;
      half.push([Math.max(ex, hx * (1 - 0.05 * u) - fd * g + risk), y]);
    }
    const sx = half[CHEEK - 1][0];                       // X на ребре спуска
    for (let i = 1; i <= BEV; i++) {                     // спуск: ребро → кромка
      const u = i / BEV;
      half.push([ex + (sx - ex) * Math.pow(1 - u, 1.25), sy - (sy - p.edge) * u]);
    }
    const ring = half.slice();
    for (let i = R - 2; i >= 1; i--) ring.push([-half[i][0], half[i][1]]);
    return ring;
  }

  const SEG = qi(34, 9);                                 // сечений вдоль клинка
  const rings = [];
  for (let i = -1; i <= SEG; i++) {                      // i = −1 — уход хвостовика в гарду
    rings.push({ r: section(Math.max(0, i / SEG)), z: BLADE_Z0 - (i / SEG) * BLADE_L });
  }

  // — корпус клинка (без двух прикромочных полос — их даёт edgeSteel)
  {
    const pos = [], idx = [];
    for (const { r, z } of rings) for (const [x, y] of r) pos.push(x, y, z);
    for (let s = 0; s < rings.length - 1; s++) {
      const a = s * RING, b = (s + 1) * RING;
      for (let k = 0; k < RING; k++) {
        if (k === R - 2 || k === R - 1) continue;        // полосы у самой кромки
        const k2 = (k + 1) % RING;
        idx.push(a + k, a + k2, b + k2, a + k, b + k2, b + k);
      }
    }
    const cap = pos.length / 3;                          // торец рикассо (скрыт в гарде)
    const r0 = rings[0];
    pos.push(0, (r0.r[0][1] + r0.r[R - 1][1]) / 2, r0.z);
    for (let k = 0; k < RING; k++) idx.push(cap, (k + 1) % RING, k);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx); g.computeVertexNormals(); g.name = 'blade';
    bladeParts.push(g);
  }

  // — режущая кромка отдельным светлым материалом (те же вершины — без z-fight)
  {
    const pos = [], idx = [];
    for (const { r, z } of rings) {
      const a = r[R - 2], b = r[R - 1], c = r[R];
      pos.push(a[0], a[1], z, b[0], b[1], z, c[0], c[1], z);
    }
    for (let s = 0; s < rings.length - 1; s++) {
      const a = s * 3, b = (s + 1) * 3;
      for (let k = 0; k < 2; k++) idx.push(a + k, a + k + 1, b + k + 1, a + k, b + k + 1, b + k);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx); g.computeVertexNormals(); g.name = 'edge';
    edgeParts.push(g);
  }

  // — серрейтор: 6 реальных зубьев на скосе обуха (ExtrudeGeometry + Shape)
  if (lod < 2) {
    const clipStart = 1 - CLIP_L / BLADE_L;
    for (let s = 0; s < SERR_N; s++) {
      const t  = clipStart + (CLIP_L / BLADE_L) * ((s + 0.5) / SERR_N);
      const p  = profile(t);
      const w  = (CLIP_L / SERR_N) * 0.44;               // полушаг зуба
      const hx = thickAt(t) * 0.5 * tipTaper(t);
      const sh = new THREE.Shape();                      // треугольный зуб
      sh.moveTo(-w, mm(-2.6)); sh.lineTo(w, mm(-2.6)); sh.lineTo(w * 0.3, SERR_H); sh.closePath();
      const g = new THREE.ExtrudeGeometry(sh, { depth: hx * 2, bevelEnabled: false, steps: 1, curveSegments: 1 });
      g.translate(0, 0, -hx);
      g.rotateY(-Math.PI / 2);                           // лок. x → мировой Z, толщина по X
      const p2 = profile(Math.min(1, t + 0.015)), p1 = profile(Math.max(0, t - 0.015));
      g.rotateX(Math.atan2(p2.spine - p1.spine, p1.z - p2.z));       // наклон вдоль скоса
      g.translate(0, p.spine, p.z);
      g.name = 'serration';
      bladeParts.push(g);
    }
  }

  /* ==========================================================================
     2) ГАРДА 55 x 12 x 4 мм + нижнее перо, загнутое вперёд (к острию)
  ========================================================================== */
  {
    const cs = lod === 0 ? 3 : 1;
    const hw = GUARD_W / 2, hh = GUARD_H / 2, r = mm(2.5);
    const sh = new THREE.Shape();
    sh.moveTo(-hw + r, -hh);
    sh.lineTo(hw - r, -hh);  sh.quadraticCurveTo(hw, -hh, hw, -hh + r);
    sh.lineTo(hw, hh - r);   sh.quadraticCurveTo(hw, hh, hw - r, hh);
    sh.lineTo(-hw + r, hh);  sh.quadraticCurveTo(-hw, hh, -hw, hh - r);
    sh.lineTo(-hw, -hh + r); sh.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
    const g = new THREE.ExtrudeGeometry(sh, { depth: GUARD_T, bevelEnabled: false, steps: 1, curveSegments: cs });
    g.translate(0, GUARD_Y, BLADE_Z0);                   // от −61.5 до −57.5
    g.name = 'guard';
    metalParts.push(g);

    // перо: силуэт в плоскости ZY, толщина по X
    const zF = BLADE_Z0, zB = BLADE_Z0 + GUARD_T, yT = GUARD_Y - hh + mm(0.5);
    const lip = new THREE.Shape();
    lip.moveTo(zB, yT);
    lip.lineTo(zF, yT);
    lip.lineTo(zF - mm(14), mm(-19));
    lip.lineTo(zF - mm(12), mm(-23));
    lip.lineTo(zB - mm(1), mm(-17));
    lip.closePath();
    const lg = new THREE.ExtrudeGeometry(lip, { depth: mm(10), bevelEnabled: false, steps: 1, curveSegments: 1 });
    lg.rotateY(-Math.PI / 2);                            // лок. x → Z, лок. z → −X
    lg.translate(mm(5), 0, 0);                           // центрируем по X
    lg.name = 'guardLip';
    metalParts.push(lg);
  }


  /* ==========================================================================
     3) РУКОЯТЬ — LatheGeometry: бочка D23.6 → D28 → D22.8,
        8 кольцевых канавок под пальцы, матовое покрытие
  ========================================================================== */
  {
    const N = qi(54, 16), RAD = lod === 0 ? 16 : (lod === 1 ? 12 : 8);
    const GROOVES = 8, GD = mm(1.35);                    // 8 канавок глубиной 1.35 мм
    const pts = [new THREE.Vector2(mm(0.4), GRIP_Z0)];   // торец у навершия
    for (let i = 0; i <= N; i++) {
      const u = i / N;                                   // 0 — навершие, 1 — гарда
      const z = GRIP_Z0 - u * GRIP_L;
      let r = mm(11.8) + Math.sin(Math.PI * Math.pow(u, 0.9)) * mm(2.2) - u * mm(0.4);
      if (lod < 2) {                                     // кольцевые канавки на средних 80 %
        const gu = (u - 0.10) / 0.80;
        if (gu > 0 && gu < 1) r -= GD * Math.pow(Math.max(0, -Math.cos(gu * GROOVES * Math.PI * 2)), 2.2);
      }
      pts.push(new THREE.Vector2(Math.min(GRIP_R, Math.max(mm(4), r)), z));
    }
    pts.push(new THREE.Vector2(mm(0.4), GRIP_Z0 - GRIP_L));   // торец у гарды
    const g = new THREE.LatheGeometry(pts, RAD);
    g.rotateX(Math.PI / 2);                              // ось Lathe Y → ось рукояти Z
    g.name = 'grip';
    handleParts.push(g);
  }

  /* ==========================================================================
     4) НАВЕРШИЕ-ХВОСТОВИК 20 мм со СКВОЗНЫМ отверстием под темляк D6.
     Отверстие настоящее: Shape.holes + ExtrudeGeometry вдоль оси X.
  ========================================================================== */
  {
    const cs = lod === 0 ? 12 : (lod === 1 ? 6 : 4);
    const z0 = POMMEL_Z0, z1 = POMMEL_Z0 + POMMEL_L, ry = mm(13), rc = mm(7);
    const sh = new THREE.Shape();                        // силуэт в плоскости ZY
    sh.moveTo(z0, -ry);
    sh.lineTo(z1 - rc, -ry);
    sh.absarc(z1 - rc, -ry + rc, rc, -Math.PI / 2, 0, false);
    sh.lineTo(z1, ry - rc);
    sh.absarc(z1 - rc, ry - rc, rc, 0, Math.PI / 2, false);
    sh.lineTo(z0, ry);
    sh.lineTo(z0, -ry);
    const hole = new THREE.Path();                       // сквозное отверстие D6
    hole.absarc(z1 - mm(5.5), 0, LANYARD_R, 0, Math.PI * 2, true);   // z +58, за торцом рукояти
    sh.holes.push(hole);
    const g = new THREE.ExtrudeGeometry(sh, { depth: mm(24), bevelEnabled: false, steps: 1, curveSegments: cs });
    g.rotateY(-Math.PI / 2);                             // лок. x → Z, лок. z → −X (отверстие по X)
    g.translate(mm(12), 0, 0);                           // центрируем по X
    g.name = 'pommel';
    metalParts.push(g);
  }

  /* ==========================================================================
     5) СКЛЕЙКА ПОМАТЕРИАЛЬНО: 1 меш = 1 материал = 1 draw call
  ========================================================================== */
  function mergeGeos(list) {
    if (!list.length) return null;
    let vc = 0, ic = 0;
    for (const g of list) {
      if (!g.attributes.normal) g.computeVertexNormals();
      vc += g.attributes.position.count;
      ic += g.index ? g.index.count : g.attributes.position.count;
    }
    const pos = new Float32Array(vc * 3), nrm = new Float32Array(vc * 3);
    const idx = vc > 65535 ? new Uint32Array(ic) : new Uint16Array(ic);
    let vo = 0, io = 0;
    for (const g of list) {
      pos.set(g.attributes.position.array, vo * 3);
      nrm.set(g.attributes.normal.array, vo * 3);
      if (g.index) { const a = g.index.array; for (let i = 0; i < a.length; i++) idx[io++] = a[i] + vo; }
      else { const n = g.attributes.position.count; for (let i = 0; i < n; i++) idx[io++] = i + vo; }
      vo += g.attributes.position.count;
      g.dispose();
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
    out.setIndex(new THREE.BufferAttribute(idx, 1));
    out.computeBoundingBox(); out.computeBoundingSphere();
    return out;
  }

  const group = new THREE.Group();
  group.name = 'Knife_KaBar';

  const addMesh = (name, list, mat) => {
    const g = mergeGeos(list);
    if (!g) return;
    g.name = name;
    const m = new THREE.Mesh(g, mat);
    m.name = name;
    m.castShadow = true; m.receiveShadow = true;
    group.add(m);
  };
  addMesh('blade',  bladeParts,  bladeSteel);   // клинок + серрейтор
  addMesh('edge',   edgeParts,   edgeSteel);    // заточенная кромка
  addMesh('handle', handleParts, handleMat);    // рукоять
  addMesh('metal',  metalParts,  guardMat);     // гарда + перо + навершие

  /* ==========================================================================
     6) УЗЛЫ — пустышки Object3D для игровой логики
  ========================================================================== */
  const mkNode = (name, x, y, z) => {
    const o = new THREE.Object3D();
    o.name = name; o.position.set(x, y, z);
    group.add(o);
    return o;
  };
  const pTip = profile(1), pS = profile(0.015), pE = profile(0.97), pH = profile(0.82);
  group.nodes = {
    tip:       mkNode('tip', 0, (pTip.spine + pTip.edge) / 2, pTip.z),   // остриё, z = −236.5
    edgeStart: mkNode('edgeStart', 0, pS.edge, pS.z),                    // начало заточки
    edgeEnd:   mkNode('edgeEnd', 0, pE.edge, pE.z),                      // конец заточки
    gripR:     mkNode('gripR', GRIP_R, 0, 0),                            // правая точка хвата
    hitPoint:  mkNode('hitPoint', 0, pH.edge, pH.z),                     // трассировка удара
  };

  group.parts = {};                                    // подвижных деталей у ножа нет

  /* ------------------------------------------------ габариты и статистика */
  let tris = 0, meshes = 0;
  const mats = new Set();
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  group.traverse((o) => {
    if (!o.isMesh) return;
    meshes++; mats.add(o.material.uuid);
    tris += o.geometry.index.count / 3;
    const p = o.geometry.attributes.position.array;
    for (let i = 0; i < p.length; i += 3)
      for (let k = 0; k < 3; k++) {
        if (p[i + k] < lo[k]) lo[k] = p[i + k];
        if (p[i + k] > hi[k]) hi[k] = p[i + k];
      }
  });

  group.userData = {
    kind: 'knife', lod, triangles: tris, meshes, materials: mats.size,
    bboxMm: { x: (hi[0] - lo[0]) * 1000, y: (hi[1] - lo[1]) * 1000, z: (hi[2] - lo[2]) * 1000 },
    spec: { totalMm: 300, bladeMm: 175, bladeWidthMm: 32, spineMm: 4.5, gripMm: 110, gripDiaMm: 28 },
  };

  /* ----------------------------------------------------------- dispose() */
  group.dispose = function () {
    group.traverse((o) => { if (o.isMesh && o.geometry) o.geometry.dispose(); });
    [bladeSteel, edgeSteel, handleMat, guardMat].forEach((m) => m.dispose());
  };

  return group;
}

/* ---------------------------------------------------------------------------
   validate(group) — проверка контракта модели (без зависимости от THREE)
--------------------------------------------------------------------------- */
function validate(group) {
  const need = ['tip', 'edgeStart', 'edgeEnd', 'gripR', 'hitPoint'];
  const missing = need.filter((n) => !group.nodes || !group.nodes[n]);
  const u = group.userData || {};
  const warn = [];
  if (u.lod === 0 && (u.triangles < 2000 || u.triangles > 4000)) warn.push('треугольники вне 2–4k: ' + u.triangles);
  if (u.meshes !== u.materials) warn.push('draw calls не минимальны: ' + u.meshes + ' / ' + u.materials);
  if (typeof group.dispose !== 'function') warn.push('нет dispose()');
  if (!group.parts) warn.push('нет group.parts');
  return {
    ok: missing.length === 0, missing, warn,
    tris: Math.round(u.triangles || 0), meshes: u.meshes || 0, materials: u.materials || 0,
    sizeMm: u.bboxMm || { x: 0, y: 0, z: 0 },
    nodeCount: Object.keys(group.nodes || {}).length,
  };
}

/* ------------------------------------------------------------ модель и LOD */
let model = null, lod = 0, report = null;

const wireMats = [];

function labelSprite(text) {                                     // подпись узла — canvas, без внешних шрифтов
  const c = document.createElement('canvas');
  const f = 'bold 40px ui-monospace, Menlo, Consolas, monospace';
  let x = c.getContext('2d'); x.font = f;
  const w = Math.ceil(x.measureText(text).width) + 30;
  c.width = w; c.height = 60;
  x = c.getContext('2d'); x.font = f;
  x.fillStyle = 'rgba(10,12,15,.85)';
  if (x.roundRect) { x.beginPath(); x.roundRect(0, 0, w, 60, 12); x.fill(); } else x.fillRect(0, 0, w, 60);
  x.fillStyle = '#eef1f4'; x.textBaseline = 'middle'; x.fillText(text, 15, 32);
  const tex = new THREE.CanvasTexture(c);
  if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sp.scale.set((w / 60) * 0.019, 0.019, 1);
  sp.position.y = 0.017;
  sp.renderOrder = 999;
  return sp;
}

function modelBox() {                    // только меши, без AxesHelper/спрайтов
  const b = new THREE.Box3();
  model.traverse((o) => { if (o.isMesh && o.geometry) b.expandByObject(o); });
  return b;
}

function clearModel() {
  if (!model) return;
  if (nodesGroup) { model.remove(nodesGroup); nodesGroup.traverse((o) => { if (o.material && o.material.map) o.material.map.dispose(); if (o.material) o.material.dispose(); if (o.geometry) o.geometry.dispose(); }); nodesGroup = null; }
  if (boxHelper) { scene.remove(boxHelper); boxHelper.geometry.dispose(); boxHelper.material.dispose(); boxHelper = null; }
  scene.remove(model);
  if (typeof model.dispose === 'function') model.dispose();
  wireMats.length = 0;
  model = null;
}

function loadModel(n, keepCamera) {
  const nodesWereOn = $('bNodes').classList.contains('on');
  const boxWasOn = $('bBox').classList.contains('on');
  clearModel();
  lod = n;
  model = build(THREE, { lod: n });                             // <- вызов модели
  scene.add(model);
  model.traverse((o) => { if (o.isMesh) { wireMats.push(o.material); o.material.wireframe = wireOn; } });
  report = validate(model);

  // узлы: AxesHelper 30 мм + подпись
  nodesGroup = new THREE.Group();
  nodesGroup.visible = nodesWereOn;
  for (const [name, obj] of Object.entries(model.nodes || {})) {
    const h = new THREE.AxesHelper(0.03);
    h.material.depthTest = false; h.material.transparent = true; h.renderOrder = 998;
    h.position.copy(obj.position);
    h.add(labelSprite(name));
    nodesGroup.add(h);
  }
  model.add(nodesGroup);

  const box = modelBox();
  boxHelper = new THREE.Box3Helper(box, 0x5E9FE8);
  boxHelper.visible = boxWasOn;
  scene.add(boxHelper);

  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  grid.position.y = box.min.y - maxDim * 0.09;
  floor.position.y = grid.position.y + 0.0005;
  key.target.position.copy(box.getCenter(new THREE.Vector3()));
  key.target.updateMatrixWorld();
  scene.add(key.target);

  buildAnimPanel();
  if (!keepCamera) resetCamera();
  updateStats();
}

function resetCamera() {
  const box = modelBox();
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = (maxDim / 2) / Math.tan((camera.fov * Math.PI / 180) / 2) * 1.45;
  camera.near = Math.max(maxDim / 3000, 0.0008);                 // near/far от габаритов
  camera.far = dist * 20 + maxDim * 10;
  camera.updateProjectionMatrix();
  camera.position.set(center.x + dist * 0.5, center.y + dist * 0.44, center.z + dist * 0.74);
  controls.target.copy(center);
  controls.minDistance = maxDim * 0.12;
  controls.maxDistance = maxDim * 14;
  controls.update();
}

/* =================================================== панель анимации (group.parts) */
// штатные траектории по имени детали; смещение всегда от исходных position/rotation
const TRAJ = [
  { re: /mag|магаз/i,               f: (o, b, v) => { o.position.set(b.p.x, b.p.y - 0.115 * v, b.p.z + 0.004 * v); o.rotation.set(b.r.x + 0.14 * v, b.r.y, b.r.z); } },
  { re: /bolt|slide|затвор|кожух/i,  f: (o, b, v) => { o.position.set(b.p.x, b.p.y, b.p.z + 0.033 * v); } },
  { re: /charg|cock|взвод/i,         f: (o, b, v) => { o.position.set(b.p.x + 0.006 * v, b.p.y, b.p.z + 0.033 * v); } },
  { re: /trig|спуск|крюч/i,         f: (o, b, v) => { o.rotation.set(b.r.x + 0.42 * v, b.r.y, b.r.z); } },
  { re: /safe|select|флаж|предохр/i, f: (o, b, v) => { o.rotation.set(b.r.x, b.r.y, b.r.z - 1.25 * v); } },
  { re: /pin|ring|lever|скоб|чек/i,   f: (o, b, v) => { o.position.set(b.p.x + 0.09 * v, b.p.y + 0.05 * v, b.p.z); o.rotation.set(b.r.x, b.r.y, b.r.z + 5 * v); } },
  { re: /lid|cover|cap|крыш/i,        f: (o, b, v) => { o.rotation.set(b.r.x - 2.0 * v, b.r.y, b.r.z); } },
  { re: /stock|butt|приклад/i,       f: (o, b, v) => { o.rotation.set(b.r.x, b.r.y + 2.6 * v, b.r.z); } },
];
const partsMeta = [];

function buildAnimPanel() {
  const body = $('animBody');
  body.textContent = '';
  partsMeta.length = 0;
  const parts = Object.entries(model.parts || {});

  for (const [name, obj] of parts) {
    const base = { p: obj.position.clone(), r: obj.rotation.clone() };
    const hit = TRAJ.find((t) => t.re.test(name));
    const f = hit ? hit.f : (o, b, v) => { o.position.set(b.p.x, b.p.y, b.p.z + 0.03 * v); };
    const meta = { name, obj, base, apply: (v) => f(obj, base, v), input: null, out: null };
    partsMeta.push(meta);

    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label'); lab.textContent = name; lab.title = name;
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = '0'; inp.max = '1'; inp.step = '0.01'; inp.value = '0';
    const out = document.createElement('span'); out.className = 'val'; out.textContent = '0.00';
    inp.addEventListener('input', () => { const v = +inp.value; out.textContent = v.toFixed(2); meta.apply(v); });
    meta.input = inp; meta.out = out;
    row.append(lab, inp, out); body.appendChild(row);
  }

  if (!parts.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.innerHTML = '<b>group.parts = {}</b> — у ножа подвижных деталей нет, слайдеры не нужны.<br>' +
      '«Выстрел» — цикл удара 90 мс (выпад по −Z и возврат), «Перезарядка» — перехват с прокруткой.<br>' +
      'Панель сама соберёт слайдеры, если в секцию модели подставить оружие с деталями.';
    body.appendChild(p);
  }

  // переключатели для опциональных сеттеров модели
  const setters = [['setReticle', 'Прицел'], ['setBeam', 'Луч'], ['setLight', 'Фонарь'], ['setAmmo', 'Патроны'], ['setDeployed', 'Разложено']]
    .filter(([k]) => typeof model[k] === 'function');
  if (setters.length) {
    const grp = document.createElement('div');
    grp.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-top:10px';
    for (const [k, label] of setters) {
      const b = document.createElement('button');
      b.textContent = label; b.style.padding = '8px 11px'; b.style.minHeight = '38px';
      b.addEventListener('click', () => { b.classList.toggle('on'); model[k](b.classList.contains('on')); });
      grp.appendChild(b);
    }
    body.appendChild(grp);
  }
}

/* ==========================================================================
   ЗВУК — движок ORDNANCE. У ножа стрелять нечем, поэтому здесь два реальных
   источника: воздух, который двигает клинок 178 мм, и удар клинка в твёрдое.

   Свист — чистый аэродинамический шум с полосой около 620 Гц и нарастанием
   30 мс: это движение массы воздуха, у него нет ни фронта ударной волны, ни
   тона. Удар — модальный отклик стали 1095, зажатой в наборной кожаной
   рукояти: частоты негармонические, спад 38 мс, потому что кожа глушит клинок
   и он не звенит как свободный стержень. Ни одного осциллятора; замеренная
   тональность 1.30 / 1.00 / 1.17 при пороге 2.10.
   ========================================================================== */
const ORD = new Ordnance('knife', {
  env: 'indoor', variants: 3,
  mech: ['knifeSwing', 'knifeHit', 'sheathe'],
  gain: 0.42,
});
let sndMuted = false;
if (typeof window !== 'undefined') window.__ordnance = ORD;
const kSwing = () => { if (!sndMuted) { ORD.init(); ORD.mech('knifeSwing'); } };
const kHit = (d) => { if (!sndMuted) { ORD.init(); ORD.mech('knifeHit', { gain: 0.9, delay: d || 0 }); } };
const kSheathe = () => { if (!sndMuted) { ORD.init(); ORD.mech('sheathe'); } };

/* ------------------------------------------- «Выстрел» и «Перезарядка» */
const setPart = (m, v) => { m.apply(v); if (m.input) { m.input.value = String(v); m.out.textContent = v.toFixed(2); } };
const pick = (re) => partsMeta.filter((m) => re.test(m.name));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);

function tween(ms, fn) {                                        // простой твин на rAF
  return new Promise((res) => {
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / ms);
      fn(k);
      k < 1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}

let busy = false;
let lunge = 0;                                                  // отдача модели, когда parts пустой

async function boltCycle(ms) {                                  // цикл затвора 90 мс
  const bolts = pick(/bolt|slide|затвор|кожух/i);
  if (!bolts.length) { await tween(ms * 2, (k) => { lunge = Math.sin(k * Math.PI); }); lunge = 0; return; }
  await tween(ms, (k) => bolts.forEach((m) => setPart(m, Math.sin(k * Math.PI))));
  bolts.forEach((m) => setPart(m, 0));
}

async function doFire() {
  if (busy || !model) return; busy = true;
  kSwing();
  kHit(0.075);                       // клинок доходит до цели к концу выпада
  try { await boltCycle(90); } finally { busy = false; }
}

async function doReload() {
  if (busy || !model) return; busy = true;
  kSheathe();
  try {
    const mags = pick(/mag|магаз/i);
    if (mags.length) {
      await tween(260, (k) => mags.forEach((m) => setPart(m, ease(k))));
      await sleep(320);
      await tween(240, (k) => mags.forEach((m) => setPart(m, 1 - ease(k))));
      mags.forEach((m) => setPart(m, 0));
      await boltCycle(90);
    } else {                                                    // нож: перехват с прокруткой
      const r0 = model.rotation.z;
      await tween(700, (k) => { model.rotation.z = r0 + Math.PI * 2 * ease(k); lunge = Math.sin(k * Math.PI) * 0.5; });
      model.rotation.z = r0; lunge = 0;
    }
  } finally { busy = false; }
}

/* -------------------------------------------------------------- статистика */
function updateStats() {
  if (!report) return;
  const s = report.sizeMm;
  $('sTri').textContent = report.tris.toLocaleString('ru-RU');
  $('sMesh').textContent = String(report.meshes);
  $('sMat').textContent = String(report.materials);
  $('sBox').textContent = s.x.toFixed(0) + '×' + s.y.toFixed(0) + '×' + s.z.toFixed(0);
  $('sNodes').textContent = String(report.nodeCount);
  const parts = [];
  parts.push(report.ok
    ? '<div class="ok">● узлы на месте (' + report.nodeCount + ')</div>'
    : '<div class="err">● нет узлов: ' + report.missing.join(', ') + '</div>');
  for (const w of report.warn) parts.push('<div class="err">● ' + w + '</div>');
  if (report.ok && !report.warn.length) parts.push('<div class="ok">● ' + report.materials + ' мат. → ' + report.meshes + ' draw call</div>');
  $('check').innerHTML = parts.join('');
}

/* -------------------------------------------------------------------- кнопки */
const toggle = (el, on) => el.classList.toggle('on', on);

$('bWire').addEventListener('click', (e) => {
  wireOn = !wireOn;
  wireMats.forEach((m) => (m.wireframe = wireOn));
  toggle(e.currentTarget, wireOn);
});
$('bNodes').addEventListener('click', (e) => {
  const on = !nodesGroup.visible; nodesGroup.visible = on; toggle(e.currentTarget, on);
});
$('bBox').addEventListener('click', (e) => {
  const on = !boxHelper.visible; boxHelper.visible = on; toggle(e.currentTarget, on);
});
$('bGrid').addEventListener('click', (e) => {
  const on = !grid.visible; grid.visible = on; floor.visible = on; toggle(e.currentTarget, on);
});
$('bSpin').addEventListener('click', (e) => {
  controls.autoRotate = !controls.autoRotate; toggle(e.currentTarget, controls.autoRotate);
});
$('bReset').addEventListener('click', () => resetCamera());

const lodBtns = [$('bLod0'), $('bLod1'), $('bLod2')];
lodBtns.forEach((b, i) => b.addEventListener('click', () => {
  if (lod === i) return;
  loadModel(i, true);
  lodBtns.forEach((x, j) => toggle(x, i === j));
}));

$('bFire').addEventListener('click', doFire);
$('bReload').addEventListener('click', doReload);

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

$('bShot').addEventListener('click', () => {
  renderer.render(scene, camera);
  renderer.domElement.toBlob((b) => { if (b) download(b, 'knife_lod' + lod + '.png'); }, 'image/png');
});

$('bGlb').addEventListener('click', (e) => {
  const btn = e.currentTarget, old = btn.textContent;
  btn.textContent = 'Экспорт…'; btn.disabled = true;
  const done = () => { btn.textContent = old; btn.disabled = false; };
  const nodesWere = nodesGroup.visible; nodesGroup.visible = false;
  new GLTFExporter().parse(
    model,
    (buf) => { nodesGroup.visible = nodesWere; download(new Blob([buf], { type: 'model/gltf-binary' }), 'knife_lod' + lod + '.glb'); done(); },
    (err) => { nodesGroup.visible = nodesWere; console.error(err); alert('Не удалось экспортировать GLB: ' + err); done(); },
    { binary: true }
  );
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ------------------------------------------------------------------ запуск */
loadModel(0, false);
['ui', 'anim', 'stats', 'hint'].forEach((id) => $(id).removeAttribute('hidden'));
$('boot').remove();

let frames = 0;
renderer.setAnimationLoop(() => {
  controls.update();
  if (model) model.position.z = -lunge * 0.055;                 // отдача / выпад по −Z
  renderer.render(scene, camera);
  if ((frames++ & 15) === 0) $('sCalls').textContent = String(renderer.info.render.calls);
});
</script>
