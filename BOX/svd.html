<!DOCTYPE html>
<html lang="ru">
<head>

<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#08090b;
  font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  color:#e8eaed;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}

/* ---------- виньетка ---------- */
#vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 42%,rgba(0,0,0,.28) 78%,rgba(0,0,0,.55) 100%)}

/* ---------- сетка ---------- */
#reticle{position:fixed;pointer-events:none;opacity:0;transition:opacity .18s ease;z-index:5;
  filter:drop-shadow(0 0 1px rgba(255,255,255,.35))}
body.aiming #reticle{opacity:1}
#reticle #ret-g{stroke:#0d0e10}
#reticle.lit #ret-g{stroke:#ff5a2b;filter:drop-shadow(0 0 2.5px rgba(255,90,43,.9))}
#reticle text{fill:#0d0e10;stroke:none}
#reticle.lit text{fill:#ff5a2b;stroke:none}

/* ---------- шапка ---------- */
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:16px 18px;z-index:10;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,7,9,.72),rgba(6,7,9,0))}
#top .title b{display:block;font-size:19px;letter-spacing:.22em;font-weight:700}
#top .title span{display:block;font-size:10.5px;letter-spacing:.09em;color:#8b9099;margin-top:3px;text-transform:uppercase}
#top .stats{font-size:11px;color:#7d838c;font-variant-numeric:tabular-nums;letter-spacing:.05em}
body.aiming #top{opacity:.25}

/* ---------- боковая панель ---------- */
#side{position:fixed;top:74px;left:18px;z-index:10;display:flex;flex-direction:column;gap:9px;width:212px}
.card{background:rgba(12,14,17,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:11px 13px}
.card .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#8b9099;
  letter-spacing:.05em;text-transform:uppercase;margin:3px 0}
.card .row b{color:#f0f2f4;font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-transform:none}
#ammo-pips{display:flex;gap:3px;margin:9px 0 7px}
#ammo-pips i{flex:1;height:5px;border-radius:2px;background:rgba(255,255,255,.10);transition:background .18s}
#ammo-pips i.on{background:linear-gradient(180deg,#e9b449,#c07f22);box-shadow:0 0 6px rgba(225,160,60,.45)}
.hint{font-size:10.5px;line-height:1.85;color:#787e88;letter-spacing:.03em}
.hint kbd{display:inline-block;min-width:17px;padding:1px 5px;margin-right:2px;border-radius:4px;text-align:center;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.10);color:#c8ccd2;font-size:9.5px;font-family:inherit}
body.aiming #side{opacity:.22;transition:opacity .2s}

/* ---------- нижняя панель ---------- */
#bar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;gap:8px;justify-content:center;align-items:center;
  flex-wrap:wrap;padding:16px 16px 20px;background:linear-gradient(0deg,rgba(6,7,9,.80),rgba(6,7,9,0))}
#bar button{font:inherit;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#c9ced5;cursor:pointer;
  padding:10px 17px;border-radius:9px;border:1px solid rgba(255,255,255,.11);background:rgba(20,23,27,.72);

#bar button:hover{background:rgba(34,38,44,.85);color:#fff;border-color:rgba(255,255,255,.2)}
#bar button:active{transform:translateY(1px) scale(.985)}
#bar button.active{background:rgba(224,150,50,.16);border-color:rgba(224,150,50,.5);color:#f0be74}
#bar button.off{opacity:.5}
#bar .big{font-weight:700;padding:12px 26px;font-size:12.5px}
#bar #btn-fire{background:linear-gradient(180deg,#8e2f1d,#66200f);border-color:rgba(255,120,70,.35);color:#ffe2d4;

#bar #btn-fire:hover{background:linear-gradient(180deg,#a83a24,#7a2713)}
#bar .alt{background:linear-gradient(180deg,#2b3138,#1d2126);color:#dfe3e8}

#hit.show{opacity:1;transform:translate(-50%,-200%) scale(1)}
#hit b{display:block;font-size:34px;font-weight:800;color:#ffcf7a;text-shadow:0 2px 14px rgba(0,0,0,.85);line-height:1}
#hit span{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#cfd4da;margin-top:4px;
  text-shadow:0 1px 8px rgba(0,0,0,.9)}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(8px);z-index:11;pointer-events:none;
  opacity:0;transition:all .2s;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#e4e7ea;
  background:rgba(14,16,19,.82);border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:8px 15px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- служебное ---------- */
#loading{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;
  background:#08090b;color:#7d838c;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.sp{width:26px;height:26px;border:2px solid rgba(255,255,255,.12);border-top-color:#c9903c;border-radius:50%;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#err{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;max-width:88vw;max-height:70vh;
  overflow:auto;background:rgba(28,12,12,.96);border:1px solid rgba(255,90,70,.35);border-radius:12px;padding:18px 20px;
  color:#ffd9d0;font-size:12px}
#err b{display:block;margin-bottom:8px;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:#ff9b83}
#err pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.55}

@media (max-width:820px){
  #side{display:none}
  #top{padding:12px 14px}
  #top .title b{font-size:16px}
  #top .title span{font-size:9px}
  #bar{gap:6px;padding:12px 10px 16px}
  #bar button{padding:9px 12px;font-size:10px;letter-spacing:.08em}
  #bar .big{padding:11px 18px;font-size:11px}
}

var CH_ENV = [

var CH_PBR = [
  'const float PI=3.14159265;',
  'float D_GGX(float NoH,float a){float a2=a*a;float d=NoH*NoH*(a2-1.0)+1.0;return a2/max(1e-7,PI*d*d);}',

  'vec3 F_Schlick(vec3 f0,float u){float f=pow(1.0-u,5.0);return f0+(vec3(1.0)-f0)*f;}',
  'vec3 envBRDF(vec3 f0,float rough,float NoV){',
  ' vec4 c0=vec4(-1.0,-0.0275,-0.572,0.022), c1=vec4(1.0,0.0425,1.04,-0.04);',
  ' vec4 r=rough*c0+c1; float a004=min(r.x*r.x,exp2(-9.28*NoV))*r.x+r.y;',
  ' vec2 ab=vec2(-1.04,1.04)*a004+r.zw; return f0*ab.x+ab.y;}',
  'vec3 shadeLight(vec3 N,vec3 V,vec3 L,vec3 col,vec3 albedo,float metal,float rough,vec3 f0){',
  ' vec3 H=normalize(V+L);',
  ' float NoL=max(dot(N,L),0.0), NoV=max(dot(N,V),1e-4), NoH=max(dot(N,H),0.0), VoH=max(dot(V,H),0.0);',

  ' float a=max(0.0025,rough*rough);',
  ' vec3 F=F_Schlick(f0,VoH);',
  ' vec3 spec=F*(D_GGX(NoH,a)*V_Smith(NoV,NoL,a));',
  ' vec3 kd=(vec3(1.0)-F)*(1.0-metal);',
  ' return (kd*albedo/PI+spec)*col*NoL;}'
].join('\n');

function checkerPanel(w, h, cell, depth, rot) {
  var m = new Mesh(), nx = Math.max(1, Math.round(w / cell)), ny = Math.max(1, Math.round(h / cell));
  var s = cell * 0.5;
  for (var i = 0; i < nx; i++) for (var j = 0; j < ny; j++) {
    var cx = -w / 2 + cell * (i + 0.5), cy = -h / 2 + cell * (j + 0.5);
    if (Math.hypot(cx / (w / 2), cy / (h / 2)) > 1.02) continue;
    var p = new Mesh();
    var a = p.v(-s, -s, 0, 0, 0, -1), b = p.v(s, -s, 0, 0, 0, -1), c = p.v(s, s, 0, 0, 0, -1), d = p.v(-s, s, 0, 0, 0, -1);
    var t = p.v(0, 0, depth, 0, 0, 1, 0, 0, 1);
    p.tri(a, t, b); p.tri(b, t, c); p.tri(c, t, d); p.tri(d, t, a);
    p.tri(a, b, c); p.tri(a, c, d);
    m.merge(p, Mmul(Mtrans(cx, cy, 0), MrotZ(PI / 4)));
  }
  return rot ? xf(m, MrotZ(rot)) : m;
}

/* ========================= МОДЕЛЬ СВД ========================= */
/* =========================================================================
   Геометрия построена по реальным пропорциям 7,62-мм снайперской винтовки
   Драгунова (СВД, инд. 6В1).
   Оси: X — вправо, Y — вверх, Z — назад. Ось канала ствола: x=0, y=0.

     общая длина ................. 1225 мм  (−906 … +330)
     длина ствола ................ 620  мм  (зеркало затвора −232 … дуло −852)
     прицельная линия ............ 587  мм  (мушка −820 … целик −233)
     линия механического прицела . +41 мм над каналом ствола
     оптическая ось ПСО-1 ........ +72 мм над каналом ствола
     ширина ствольной коробки .... 32 мм

   Всё, что должно быть симметричным, строится ОДИН раз для правой стороны
   и зеркалится mirX(): так исключены расхождения левой и правой половин.
   ========================================================================= */
var GEO = {
  Z_RB: mm(62), Z_RF: mm(-232),          // ствольная коробка: зад / перед
  RY_B: mm(-34), RY_T: mm(22),           // низ / верх коробки
  Z_MUZ: mm(-852), Z_FH: mm(-906),       // дульный срез / срез пламегасителя
  Z_FS: mm(-822), Z_RS: mm(-233),        // ось мушки / прорезь целика
  Y_IRON: mm(41), Y_OPT: mm(72), Y_GAS: mm(23),
  HG_B: mm(-298), HG_F: mm(-498),        // ствольные накладки
  MAG_Z: mm(-139),                       // ось шахты магазина
  RAIL_Z0: mm(-158), RAIL_Z1: mm(-44)    // боковая планка под кронштейн
};

/* ---------- зеркалирование меша по X (с разворотом обхода треугольников) ---------- */
function mirX(src) {
  var o = new Mesh(), i;
  for (i = 0; i < src.p.length; i += 3) {
    o.p.push(-src.p[i], src.p[i + 1], src.p[i + 2]);
    o.n.push(-src.n[i], src.n[i + 1], src.n[i + 2]);
  }
  for (i = 0; i < src.t.length; i++) o.t.push(src.t[i]);
  for (i = 0; i < src.e.length; i++) o.e.push(src.e[i]);
  for (i = 0; i < src.i.length; i += 3) o.i.push(src.i[i], src.i[i + 2], src.i[i + 1]);
  return o;
}
function both(m) { var o = new Mesh(); o.merge(m); o.merge(mirX(m)); return o; }
// плита в плоскости ZY, правая сторона: x ∈ [xIn, xIn+t]
function slabR(shape, holes, t, xIn, opt) { return exZY(shape, holes, t, xIn + t, opt); }
// симметричная пара одинаковых плит
function slabPair(shape, holes, t, xIn, opt) { return both(slabR(shape, holes, t, xIn, opt)); }

/* =========================================================================

            газоотвод, открытый прицел, ствольные накла����к��
   ========================================================================= */

  var ZB = GEO.Z_RB, ZF = GEO.Z_RF, RB = GEO.RY_B, RT = GEO.RY_T;

  /* ---------------- 1. СТВОЛЬНАЯ КОРОБКА ---------------- */
  // нижняя (сплошная) часть коробки: от низа до y = −5

    var p = new Path();
    p.move(ZF, RB);
    p.line(mm(-194), RB);
    p.quad(mm(-190), RB, mm(-188), mm(-40));      // прилив шахты магазина
    p.line(mm(-90), mm(-40));
    p.quad(mm(-86), RB, mm(-82), RB);
    p.line(mm(-46), RB);
    p.quad(mm(-42), RB, mm(-40), mm(-43));        // корпус УСМ
    p.line(mm(42), mm(-43));
    p.quad(mm(56), mm(-43), mm(60), mm(-28));     // хвостовик под приклад
    p.line(ZB, mm(-12));
    p.line(ZB, mm(-5));
    p.line(ZF, mm(-5));
    return p.done();
  })();
  add(exZYc(lowP, [], mm(32), 0, { bevel: mm(1.4) }), MAT.blue, body);

  // верхние стенки коробки (между ними ходит затворная рама)

    p.move(ZF, mm(-7));

  // окно выброса гильз (справа) и паз рукоятки перезаряжания

  add(slabR(upP, [portH, slotH], mm(8), mm(8), { bevel: mm(1.0) }), MAT.blue, body);
  add(mirX(slabR(upP, [], mm(8), mm(8), { bevel: mm(1.0) })), MAT.blue, body);
  // отражатель: приподнятая окантовка окна выброса
  add(slabR(roundRect(mm(66), mm(25), mm(6), mm(-178), mm(4)), [portH], mm(1.6), mm(16), { bevel: mm(0.5) }),

  // передняя опора ствола (вкладыш)

  // задний хвостовик коробки — площадка под приклад

  /* шахта магазина — сквозное окно снизу */
  // exXZ: профиль лежит в (x, z), экструзия идёт ВНИЗ от указанной высоты
  add(exXZ(roundRect(mm(40), mm(100), mm(9), 0, GEO.MAG_Z),

  /* защёлка магазина (позади шахты, перед скобой) */
  add(exZYc(roundRect(mm(15), mm(26), mm(5), mm(-80), mm(-46)), [], mm(18), 0, { bevel: mm(1.4) }), MAT.blueS, body);
  add(both(xf(boxRound(mm(3), mm(18), mm(9), mm(1.2), mm(0.5)), Mtrans(mm(9.5), mm(-48), mm(-80)))), MAT.blueS, body);

  /* штифты УСМ и цапфы */
  add(pinX(mm(2.6), mm(34), mm(-24), mm(-16)), MAT.bright, body);

  /* ---------------- 2. КРЫШКА СТВОЛЬНОЙ КОРОБКИ ---------------- */

  add(exXY(cov, [], mm(266), mm(-214), { bevel: mm(0.8) }), MAT.blue, dust);
  // продольные рёбра жёсткости
  add(both(xf(boxRound(mm(3.4), mm(3.0), mm(240), mm(1.0), mm(0.5)), Mtrans(mm(13.6), mm(28.5), mm(-90)))), MAT.blue, dust);

  /* ---------------- 3. СТВОЛ ---------------- */
  var brl = [
    [mm(64), 0], [mm(64), mm(16.5), true],
    [mm(-150), mm(16.5), true], [mm(-158), mm(14.4), true],
    [ZF, mm(14.4), true], [mm(-240), mm(12.6), true],
    [mm(-300), mm(12.2)], [mm(-472), mm(11.5)],
    [mm(-480), mm(12.6), true], [mm(-546), mm(12.6), true], [mm(-554), mm(10.4), true],
    [mm(-660), mm(9.9)], [mm(-780), mm(9.3)],
    [mm(-796), mm(9.2), true], [mm(-800), mm(10.4), true], [mm(-846), mm(10.4), true],
    [mm(-849), mm(9.3), true],
    [GEO.Z_MUZ, mm(9.3), true], [GEO.Z_MUZ, mm(4.7), true], [GEO.Z_MUZ + mm(5), mm(3.9), true],
    [mm(-700), mm(3.9)], [mm(64), mm(3.9)], [mm(64), 0]
  ];
  add(revolveZ(brl, 40, { smooth: 30 }), MAT.blue, body);
  // нарезы у дульного среза (4 шт.)
  for (var g = 0; g < 4; g++) {
    add(xf(boxRound(mm(1.5), mm(0.9), mm(44), mm(0.3), mm(0.15)),
      Mmuls(MrotZ(g / 4 * TAU + 0.4), Mtrans(0, mm(4.3), GEO.Z_MUZ + mm(23)))), MAT.dark, body);

  /* ---------------- 4. ПЛАМЕГАСИТЕЛЬ (щелевой, 5 окон) ---------------- */
  add(xf(tubeZ(mm(12.4), mm(9.0), mm(18), 28), Mtrans(0, 0, mm(-864))), MAT.blueS, body);

    add(xf(exXY(pp.done(), [], mm(38), mm(-902), { bevel: mm(0.5) }), MrotZ(a0)), MAT.blueS, body);
  }
  add(xf(tubeZ(mm(12.0), mm(9.0), mm(7), 28), Mtrans(0, 0, GEO.Z_FH)), MAT.blueS, body);

  /* ---------------- 5. ОСНОВАНИЕ МУШКИ С ПРЕДОХРАНИТЕЛЕМ ---------------- */
  add(xf(tubeZ(mm(14.6), mm(9.6), mm(46), 30), Mtrans(0, 0, mm(-846))), MAT.blue, body);

/* =========================================================================
   ЧАСТЬ 2: приклад, щека, рукоятка, УСМ, магазин, затворная рама, ПСО-1
   ========================================================================= */
function buildSVD2(add, N) {
  var body = N.body, bolt = N.bolt, trig = N.trig, mag = N.mag;
  var safety = N.safety, scope = N.scope;

  /* ---------------- 9. ДЕРЕВЯННЫЙ РАМОЧНЫЙ ПРИКЛАД СВД ----------------
     Одна цельная деталь: шейка — рукоятка — нижняя ветвь — затылок,
     внутри — большое окно-«скелет» под большой палец. Гребень выбран из
     массива и плавно поднимается к пятке — никаких накладок и хомутов сверху:
     на штатной СВД щека ложится прямо на дерево гребня. */
  var st = (function () {
    var p = new Path();
    p.move(mm(44), mm(16));
    p.quad(mm(64), mm(27), mm(96), mm(30));            // подъём на гребень
    p.quad(mm(150), mm(33), mm(212), mm(35));          // гребень
    p.quad(mm(268), mm(37), mm(296), mm(34));
    p.quad(mm(314), mm(32), mm(317), mm(21));          // пятка
    p.line(mm(319), mm(-16));
    p.quad(mm(318), mm(-28), mm(305), mm(-30));        // носок
    p.line(mm(236), mm(-31));
    p.quad(mm(178), mm(-32), mm(146), mm(-30));        // нижняя ветвь рамы
    p.quad(mm(124), mm(-29), mm(114), mm(-38));
    p.quad(mm(105), mm(-47), mm(100), mm(-64));        // задняя грань рукоятки
    p.line(mm(86), mm(-106));

/* ---------------- патрон 7,62×54R ---------------- */
function buildCartridge() {
  var m = new Mesh();
  var pr = [
    [0, 0], [0, mm(6.7), true], [mm(1.6), mm(6.9), true], [mm(2.4), mm(6.2), true],
    [mm(4.2), mm(6.2), true], [mm(4.8), mm(5.9)], [mm(38), mm(5.85)],
    [mm(43), mm(5.6)], [mm(46.5), mm(4.2)], [mm(48.5), mm(3.9), true], [mm(53.5), mm(3.87), true]
  ];
  m.merge(revolveZ(pr, 30));
  var bul = [
    [mm(53.5), 0], [mm(53.5), mm(3.9), true], [mm(60), mm(3.9)], [mm(66), mm(3.75)],
    [mm(70), mm(3.4)], [mm(73), mm(2.8)], [mm(75.5), mm(1.9)], [mm(77), mm(0.9)], [mm(77.5), 0]
  ];
  var b = revolveZ(bul, 30, { smooth: 50 });
  m.merge(b);
  return m;
}

/* ===== 06_audio.js ===== */
/* =========================================================================
   ПРОЦЕД��РНЫЙ ЗВУКОВОЙ ДВИЖО��
   Ни одного чистого тона с длинным затуханием — только шумовые транзиенты,
   резонансные фильтры с негармоническими частотами и короткими спадами,
   нелинейное насыщение и свёртка — именно так звучит металл и выстрел.
   ========================================================================= */
var AU = {
  ctx: null, ready: false, muted: false, env: 'outdoor',
  init: function () {
    if (this.ctx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    var c = this.ctx = new AC({ latencyHint: 'interactive' });
    var sr = c.sampleRate;

    // ---------- шумовые буферы ----------
    this.nz = c.createBuffer(2, sr * 2, sr);
    for (var ch = 0; ch < 2; ch++) {
      var d = this.nz.getChannelData(ch);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    // розовый шум (для низов и хвоста)
    this.pk = c.createBuffer(2, sr * 2, sr);
    for (ch = 0; ch < 2; ch++) {
      var o = this.pk.getChannelData(ch), b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (i = 0; i < o.length; i++) {
        var w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
        o[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    }

    // ---------- шины ----------
    this.master = c.createGain(); this.master.gain.value = 0.85;
    this.limiter = c.createDynamicsCompressor();
    this.limiter.threshold.value = -10; this.limiter.knee.value = 4;
    this.limiter.ratio.value = 14; this.limiter.attack.value = 0.002; this.limiter.release.value = 0.22;
    this.drive = c.createWaveShaper();
    var n = 2048, curve = new Float32Array(n), k = 2.2;
    for (i = 0; i < n; i++) { var x = i / (n - 1) * 2 - 1; curve[i] = Math.tanh(x * k) / Math.tanh(k); }
    this.drive.curve = curve; this.drive.oversample = '4x';
    this.bus = c.createGain(); this.bus.gain.value = 1.0;
    this.bus.connect(this.drive); this.drive.connect(this.limiter);
    this.limiter.connect(this.master); this.master.connect(c.destination);

    // ---------- свёртка (реверберация открытого пространства) ----------
    var IRL = Math.floor(sr * 2.4);
    var ir = c.createBuffer(2, IRL, sr);
    for (ch = 0; ch < 2; ch++) {
      var a = ir.getChannelData(ch), lp = 0;
      for (i = 0; i < IRL; i++) {
        var t = i / sr;
        var decay = Math.pow(1 - i / IRL, 2.6);
        var v = (Math.random() * 2 - 1) * decay;
        lp += (v - lp) * (0.30 - 0.22 * (i / IRL));   // с временем глуше
        a[i] = lp * 0.9;
      }
      // ранние отражения
      [[0.021, 0.55], [0.037, 0.42], [0.058, 0.36], [0.089, 0.30], [0.131, 0.24], [0.187, 0.18], [0.256, 0.14]].forEach(function (er) {
        var idx = Math.floor((er[0] + (ch ? 0.004 : 0)) * sr);
        if (idx < IRL) a[idx] += er[1] * (ch ? -1 : 1);
      });
    }
    this.conv = c.createConvolver(); this.conv.buffer = ir;
    this.verbSend = c.createGain(); this.verbSend.gain.value = 0.55;
    this.verbLP = c.createBiquadFilter(); this.verbLP.type = 'lowpass'; this.verbLP.frequency.value = 3200;
    this.verbSend.connect(this.verbLP); this.verbLP.connect(this.conv); this.conv.connect(this.bus);

    // ---------- многократное эхо (раскат выстрела по местности) ----------
    this.echoSend = c.createGain(); this.echoSend.gain.value = 1.0;
    var taps = [[0.19, 0.30, 1500], [0.42, 0.20, 850], [0.72, 0.13, 520], [1.15, 0.075, 340]];
    this.taps = taps.map(function (tp) {
      var dl = c.createDelay(2.0); dl.delayTime.value = tp[0];

      var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = tp[2]; f.Q.value = 0.5;
      var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
      var pan = c.createStereoPanner(); pan.pan.value = (Math.random() * 2 - 1) * 0.6;
      AU.echoSend.connect(dl); dl.connect(f); f.connect(hp); hp.connect(g); g.connect(pan); pan.connect(AU.bus);
      return { dl: dl, g: g, f: f };
    });

    this.ready = true;
    return true;
  },
  resume: function () { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  now: function () { return this.ctx.currentTime; },
  setEnv: function (e) {

    this.env = e;
    var t = this.ctx.currentTime, indoor = e === 'studio';
    this.verbSend.gain.setTargetAtTime(indoor ? 0.30 : 0.60, t, 0.1);
    this.echoSend.gain.setTargetAtTime(indoor ? 0.12 : 1.0, t, 0.1);

  /* ---------- примитивы ---------- */
  src: function (pink, rate) {

  // шумовой всплеск с огибающей
  burst: function (t, dur, atk, peak, chain, pink, curveExp) {
    var c = this.ctx, s = this.src(pink);

    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + atk);
    if (curveExp === 2) {
      g.gain.setTargetAtTime(0.0001, t + atk, dur * 0.22);
    } else {
      g.gain.exponentialRampToValueAtTime(0.0001, t + atk + dur);
    }
    s.connect(g);
    var last = g;
    (chain || []).forEach(function (nd) { last.connect(nd); last = nd; });
    s.start(t + Math.random() * 0.001, Math.random() * 1.5);
    s.stop(t + atk + dur + 0.12);
    return last;
  },
  bq: function (type, f, q, gainDb) {
    var b = this.ctx.createBiquadFilter();
    b.type = type; b.frequency.value = f; if (q !== undefined) b.Q.value = q;
    if (gainDb !== undefined) b.gain.value = gainDb;

  gain: function (v) { var g = this.ctx.createGain(); g.gain.value = v; return g; },
  pan: function (v) { var p = this.ctx.createStereoPanner(); p.pan.value = v; return p; },

    if (verb) { var v = this.gain(verb); node.connect(v); v.connect(this.verbSend); }
    if (echo) { var e = this.gain(echo); node.connect(e); e.connect(this.echoSend); }

  /* ---------- удар металла о металл ----------
     Ключ к реализму: плотный набор НЕГАРМОНИЧЕСКИХ резонансов с КОРОТКИМ
     затуханием + широкополосный щелчок удара. Длинные чистые тоны = колокольчики. */
  metal: function (t, o) {
    o = o || {};
    var c = this.ctx, gain = o.gain === undefined ? 1 : o.gain;
    var pan = this.pan(o.pan || 0);
    var mix = this.gain(gain);
    pan.connect(mix);
    this.out(mix, o.dry === undefined ? 1 : o.dry, o.verb === undefined ? 0.25 : o.verb, o.echo || 0);
    var freqs = o.freqs || [730, 1290, 2170, 3310, 4870, 6900];
    var dec = o.decay === undefined ? 0.055 : o.decay;

      var d = dec * Math.pow(0.72, i) * (0.7 + Math.random() * 0.6);
      var bp = this.bq('bandpass', Math.min(f, 18000), q);
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(1 / (1 + i * 0.55), t + 0.0006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.0006 + d);
      var s = this.src(false);
      s.connect(bp); bp.connect(g); g.connect(pan);
      s.start(t, Math.random() * 1.5); s.stop(t + d + 0.05);
    }
    // широкополосный транзиент удара
    var hp = this.bq('highpass', o.clickHP || 1400, 0.7);
    var lpc = this.bq('lowpass', 12000, 0.6);
    this.burst(t, o.click === undefined ? 0.004 : o.click, 0.0004, o.clickGain === undefined ? 0.85 : o.clickGain, [hp, lpc, pan]);
    // низкочастотное тело удара (масса детали)
    if (body > 0) {
      var lp = this.bq('lowpass', o.bodyF || 220, 1.1);
      var pk = this.bq('peaking', o.bodyF || 180, 1.4, 8);
      this.burst(t, o.bodyDec || 0.075, 0.0015, body, [lp, pk, pan], true);
    }
  },

  // трение / скольжение металла
  scrape: function (t, dur, o) {
    o = o || {};
    var c = this.ctx, s = this.src(false, 1);
    var bp = this.bq('bandpass', o.f0 || 900, o.q || 3.2);
    bp.frequency.setValueAtTime(o.f0 || 900, t);

    g.gain.linearRampToValueAtTime((o.gain || 0.3), t + Math.min(0.02, dur * 0.2));
    // шероховатость: случайные микроскачки амплитуды
    var steps = Math.max(4, Math.floor(dur / 0.008));
    for (var i = 1; i < steps; i++) {
      var tt = t + dur * i / steps;
      g.gain.setValueAtTime((o.gain || 0.3) * (0.35 + Math.random() * 0.9) * (1 - i / steps * 0.55), tt);
    }
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.02);
    var pan = this.pan(o.pan || 0);
    s.connect(bp); bp.connect(hp); hp.connect(g); g.connect(pan);
    this.out(pan, 1, 0.18, 0);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.06);
  },

  // звон возвратной пружины (короткий, с быстрым тремоло, не колокол)
  spring: function (t, o) {
    o = o || {};
    var c = this.ctx, pan = this.pan(o.pan || 0.25);
    var mix = this.gain(o.gain === undefined ? 0.16 : o.gain);
    pan.connect(mix); this.out(mix, 1, 0.2, 0);
    var base = o.f || 1750;
    for (var i = 0; i < 4; i++) {
      var s = this.src(false);
      var bp = this.bq('bandpass', base * (1 + i * 0.61) * (0.9 + Math.random() * 0.2), 26);
      var g = c.createGain();
      var dur = (o.dur || 0.20) * (0.7 + Math.random() * 0.5);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.9 / (1 + i), t + 0.002);
      // быстрое дрожание амплитуды — витки пружины
      var k = 0;
      for (var tt = 0.004; tt < dur; tt += 0.0065 + Math.random() * 0.004) {
        k++;
        g.gain.setValueAtTime((0.9 / (1 + i)) * Math.exp(-tt * 14) * (0.3 + Math.random()), t + tt);
      }
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(bp); bp.connect(g); g.connect(pan);
      s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
    }
  },

  /* ================== ВЫСТРЕЛ ================== */
  shot: function (when) {
    if (!this.ready || this.muted) return;
    var c = this.ctx, t = (when || c.currentTime) + 0.004;
    var vary = 0.94 + Math.random() * 0.12;

    // 1. УДАРНАЯ ВОЛНА — основа звука. Шум с мгновенной атакой и сваливающимся ФНЧ
    var lp = this.bq('lowpass', 11000, 0.9);
    lp.frequency.setValueAtTime(11000, t);
    lp.frequency.exponentialRampToValueAtTime(1400, t + 0.055);
    lp.frequency.exponentialRampToValueAtTime(260, t + 0.30);
    var pk1 = this.bq('peaking', 118, 1.1, 11);
    var pk2 = this.bq('peaking', 430, 1.6, -5);
    var hp0 = this.bq('highpass', 42, 0.6);
    var blastG = this.gain(1.05 * vary);
    this.burst(t, 0.34, 0.0006, 1.0, [lp, pk1, pk2, hp0, blastG]);
    this.out(blastG, 1.0, 0.85, 0.95);

    // 2. СВЕРХЗВУКОВОЙ ЩЁЛЧОК — очень короткий высокий транзиент
    var bpC = this.bq('bandpass', 3100, 0.85);
    var hpC = this.bq('highpass', 1500, 0.7);
    var crackG = this.gain(0.55 * vary);
    this.burst(t, 0.016, 0.00025, 1.0, [bpC, hpC, crackG]);
    this.out(crackG, 1.0, 0.25, 0.35);

    // 3. СРЕДНИЙ «ШЛЕПОК» — тело звука
    var bpM = this.bq('bandpass', 760, 0.55);
    var mg = this.gain(0.7 * vary);
    this.burst(t + 0.001, 0.085, 0.0008, 1.0, [bpM, mg]);
    this.out(mg, 1.0, 0.4, 0.5);

    // 4. НИЗКИЙ ТОЛЧОК — давление в груди (короткий свип, не тон)
    var so = c.createOscillator(); so.type = 'sine';
    so.frequency.setValueAtTime(135, t);
    so.frequency.exponentialRampToValueAtTime(42, t + 0.085);
    var sg = c.createGain();
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.linearRampToValueAtTime(0.85 * vary, t + 0.003);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    var slp = this.bq('lowpass', 320, 0.7);
    so.connect(sg); sg.connect(slp);
    this.out(slp, 1.0, 0.2, 0.3);
    so.start(t); so.stop(t + 0.2);

    // 5. ХВОСТ — глухой шум, уходящий в окружение
    var tlp = this.bq('lowpass', 1100, 0.5);
    var thp = this.bq('highpass', 110, 0.5);
    var tg = this.gain(0.34);
    this.burst(t + 0.02, 0.55, 0.02, 1.0, [tlp, thp, tg], true, 2);
    this.out(tg, 0.45, 1.0, 1.0);

    // 6. МЕХАНИКА АВТОМАТИКИ (газоотвод работает после выстрела)
    this.metal(t + 0.019, { freqs: [640, 1180, 1940, 3020, 4600], decay: 0.030, gain: 0.30, pan: 0.18, clickGain: 0.5, body: 0.25, bodyF: 190, verb: 0.12 });
    this.metal(t + 0.052, { freqs: [420, 890, 1520, 2480, 3900], decay: 0.045, gain: 0.42, pan: 0.10, body: 0.55, bodyF: 145, bodyDec: 0.10, clickGain: 0.6, verb: 0.15 });
    this.metal(t + 0.094, { freqs: [520, 980, 1760, 2900, 4400, 6100], decay: 0.038, gain: 0.46, pan: -0.06, body: 0.48, bodyF: 165, clickGain: 0.75, verb: 0.15 });
    this.spring(t + 0.055, { gain: 0.10, dur: 0.16, f: 2100, pan: 0.2 });
  },

  /* ---------- бряцанье патронов в СТАЛЬНОМ корпусе магазина ----------

      });

  // совместимость: старое имя (используется в impact)

  /* ================== ПЕРЕЗАРЯДКА ==================
     Разобрано по реальным фазам смены магазина СВД. Временная сетка

    this.metal(t + 0.10, {

      clickGain: 0.55, clickHP: 1500, body: 0.16, bodyF: 230, bodyDec: 0.028, pan: P
    });

    this.scrape(t + 0.155, 0.13, { f0: 300, f1: 820, q: 2.2, gain: 0.20, pan: P });
    this.magRattle(t + 0.17, 0.14, 0.075, P);
    // передний зацеп выходит из гнезда — глухой деревянный «клак», без звона

      body: 0.62, bodyF: 118, bodyDec: 0.085, clickGain: 0.30, clickHP: 700, pan: P, verb: 0.2
    });
    // магазин уходит вниз в руке: затухающее бряцанье патронов + шорох
    this.magRattle(t + 0.335, 0.26, 0.055, P - 0.06);
    this.cloth(t + 0.38, 0.22, { gain: 0.055, f: 750, pan: P - 0.1 });

    // рука в подсумке, магазин вытягивают из подсумка

    this.magRattle(t + 0.78, 0.22, 0.070, Q + 0.08);

    // передний зацеп заходит в гнездо — тяжёлый глухо�� удар массы
    this.thud(t + 1.075, { gain: 0.42, f: 128, dur: 0.10, pan: Q, verb: 0.3 });

    });
    this.magRattle(t + 1.09, 0.13, 0.085, Q);

    this.scrape(t + 1.16, 0.085, { f0: 520, f1: 1150, q: 2.6, gain: 0.17, pan: Q });

    });

    // рывок ладонью на контроль посадки — два глухих толчка
    this.thud(t + 1.40, { gain: 0.17, f: 160, dur: 0.05, pan: Q });
    this.cloth(t + 1.40, 0.09, { gain: 0.055, f: 1000, pan: Q });
    this.thud(t + 1.475, { gain: 0.12, f: 168, dur: 0.045, pan: Q });

    if (!withBolt) return;

    /* ---- ЦИКЛ ЗАТВОРА (только если рама была на затворной задержке) ---- */
    this.cloth(t + 1.72, 0.11, { gain: 0.075, f: 1100, pan: 0.34 });
    this.metal(t + 1.795, { freqs: [880, 1620, 2700, 4200], decay: 0.016, q: 14, gain: 0.26, clickGain: 0.5, pan: 0.36 });
    this.scrape(t + 1.805, 0.125, { f0: 640, f1: 2450, q: 3.2, gain: 0.30, pan: 0.32 });
    this.spring(t + 1.83, { gain: 0.15, dur: 0.20, f: 1600, pan: 0.36 });
    // рама бьёт в задний упор
    this.thud(t + 1.965, { gain: 0.55, f: 115, dur: 0.11, pan: 0.2, verb: 0.35 });
    this.metal(t + 1.968, {
      freqs: [330, 640, 1180, 2000, 3200], decay: 0.048, q: 11, gain: 0.52,
      body: 0.80, bodyF: 118, bodyDec: 0.10, clickGain: 0.65, pan: 0.2, verb: 0.35
    });
    // накат вперёд и ЗАПИРАНИЕ — самый громкий лязг всей перезарядки
    this.scrape(t + 2.10, 0.055, { f0: 1150, f1: 470, q: 2.3, gain: 0.22, pan: 0.14 });
    this.metal(t + 2.155, {
      freqs: [410, 790, 1450, 2500, 4050, 6100], decay: 0.070, q: 12, gain: 0.88,
      body: 1.0, bodyF: 126, bodyDec: 0.13, clickGain: 1.0, clickHP: 1150, pan: 0.05, verb: 0.45, echo: 0.15
    });
    this.metal(t + 2.192, { freqs: [1540, 2680, 4200, 6400], decay: 0.026, q: 18, gain: 0.32, clickGain: 0.45, pan: 0.1 });
  },
  dryFire: function (when) {
    if (!this.ready || this.muted) return;
    var t = when || this.ctx.currentTime;
    this.metal(t, { freqs: [1450, 2600, 4200, 6400, 8800], decay: 0.016, q: 20, gain: 0.42, clickGain: 0.9, clickHP: 1800, body: 0.2, bodyF: 260, bodyDec: 0.03, verb: 0.2 });
  },
  safety: function (when) {
    if (!this.ready || this.muted) return;
    var t = when || this.ctx.currentTime;
    this.metal(t, { freqs: [1250, 2350, 3900, 5900], decay: 0.014, q: 18, gain: 0.30, clickGain: 0.7, pan: 0.3 });
  },
  // зв��к попадания с учётом задержки звука (343 м/с)
  impact: function (dist, kind) {
    if (!this.ready || this.muted) return;
    var t = this.ctx.currentTime + Math.max(0.02, dist / 343);
    if (kind === 'steel') {
      this.metal(t, { freqs: [780, 1420, 2350, 3900, 5600], decay: 0.28, q: 26, gain: 0.30 * Math.min(1, 60 / dist), clickGain: 0.5, verb: 0.7, echo: 0.5 });
    } else if (kind === 'wood') {
      var lp = this.bq('lowpass', 900, 1.2), pk = this.bq('peaking', 260, 1.5, 9);
      var g = this.gain(0.34 * Math.min(1, 60 / dist));
      this.burst(t, 0.10, 0.001, 1.0, [lp, pk, g], true);
      this.out(g, 1, 0.5, 0.35);
    } else {
      var lp2 = this.bq('lowpass', 1600, 0.8), hp2 = this.bq('highpass', 180, 0.6);
      var g2 = this.gain(0.30 * Math.min(1, 60 / dist));
      this.burst(t, 0.16, 0.002, 1.0, [lp2, hp2, g2], true);
      this.out(g2, 1, 0.55, 0.4);
      this.rattle(t + 0.02, 0.12, 0.03, 0);
    }
  },
  // тихий фон ветра
  startAmbience: function () {
    if (!this.ready || this.amb) return;
    var c = this.ctx;
    var s = this.src(true, 0.6);
    var lp = this.bq('lowpass', 520, 0.5);
    var hp = this.bq('highpass', 120, 0.5);
    var g = c.createGain(); g.gain.value = 0.0;
    s.connect(lp); lp.connect(hp); hp.connect(g); g.connect(this.bus);
    s.start(0);
    // медленные порывы
    var lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.07;
    var lg = c.createGain(); lg.gain.value = 0.5;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start(0);
    this.amb = { g: g };
  },
  setAmbience: function (v) {
    if (this.amb) this.amb.g.gain.setTargetAtTime(v * 0.05, this.ctx.currentTime, 0.4);
  }
};

/* ================= ОКРУЖЕНИЕ, МИШЕНИ, ЧАСТИЦЫ, ГИЛЬЗЫ ================= */
var GROUND_Y = -1.55;
var TARGETS = [];

function buildEnvironment(add, N) {
  /* ---- земля ---- */
  var g = new Mesh(), S = 700, SEG = 36;
  for (var i = 0; i < SEG; i++) for (var j = 0; j < SEG; j++) {
    var x0 = -S / 2 + S * i / SEG, x1 = -S / 2 + S * (i + 1) / SEG;
    var z0 = -S * 0.78 + S * j / SEG, z1 = -S * 0.78 + S * (j + 1) / SEG;
    function hgt(x, z) {
      var d = Math.hypot(x, z + 60);
      return Math.sin(x * 0.055) * 0.22 + Math.cos(z * 0.041) * 0.28 + Math.sin((x + z) * 0.017) * 0.55
        - Math.exp(-d * d / 9000) * 0.4;
    }
    // аналитическая нормаль рельефа: без неё земля выглядит плоским серым листом
    function nrm(x, z) {
      var e = 0.75;
      var dx = (hgt(x + e, z) - hgt(x - e, z)) / (2 * e);
      var dz = (hgt(x, z + e) - hgt(x, z - e)) / (2 * e);
      var L = Math.sqrt(dx * dx + 1 + dz * dz);
      return [-dx / L, 1 / L, -dz / L];
    }
    var na = nrm(x0, z0), nb = nrm(x1, z0), nc = nrm(x1, z1), nd = nrm(x0, z1);
    var a = g.v(x0, GROUND_Y + hgt(x0, z0), z0, na[0], na[1], na[2], x0 * 0.1, z0 * 0.1);
    var b = g.v(x1, GROUND_Y + hgt(x1, z0), z0, nb[0], nb[1], nb[2], x1 * 0.1, z0 * 0.1);
    var c = g.v(x1, GROUND_Y + hgt(x1, z1), z1, nc[0], nc[1], nc[2], x1 * 0.1, z1 * 0.1);
    var d2 = g.v(x0, GROUND_Y + hgt(x0, z1), z1, nd[0], nd[1], nd[2], x0 * 0.1, z1 * 0.1);
    g.tri(a, b, c); g.tri(a, c, d2);
  }
  add(g, MAT.ground, N.range, { shadow: false });

  /* ---- дальние холмы ---- */
  var hills = new Mesh();
  for (var h = 0; h < 9; h++) {
    var ang = -1.35 + h * 0.34 + Math.sin(h * 5.1) * 0.06;
    var dist = 620 + Math.sin(h * 3.7) * 180;
    var hx = Math.sin(ang) * dist, hz = -Math.cos(ang) * dist;
    var hh = 55 + Math.sin(h * 2.3) * 30, hr = 210 + Math.cos(h * 1.7) * 90;
    var m = new Mesh(), rings = 6, seg = 20;
    for (var r = 0; r <= rings; r++) {
      for (var s = 0; s <= seg; s++) {
        var t = r / rings, aa = s / seg * TAU;
        var rad2 = hr * (1 - t * t * 0.92);
        var y = hh * Math.sin(t * PI * 0.5) * (0.85 + 0.3 * Math.sin(aa * 3 + h));
        m.v(Math.cos(aa) * rad2 * (1 + 0.18 * Math.sin(aa * 2.7 + h)), y - 12, Math.sin(aa) * rad2 * (1 + 0.14 * Math.cos(aa * 3.1)), 0, 1, 0, s / seg, t);
      }
    }
    for (r = 0; r < rings; r++) for (s = 0; s < seg; s++) {
      var i0 = r * (seg + 1) + s, i1 = i0 + 1, i2 = i0 + seg + 1, i3 = i2 + 1;
      m.tri(i0, i2, i1); m.tri(i1, i2, i3);
    }
    hills.merge(m, Mtrans(hx, GROUND_Y, hz));
  }
  add(hills, new Mat({ base: hex(0x3c4432), metal: 0, rough: 1.0, kind: 7, wear: 0 }), N.range, { shadow: false });

  /* ---- мишени ---- */
  var dists = [100, 200, 300, 400];
  dists.forEach(function (d, idx) {
    var node = N['target' + idx];
    var scale = 1 + idx * 0.30;
    var w = 0.62 * scale, hh2 = 0.62 * scale;
    var post = new Mesh();
    post.merge(xf(boxRound(0.075, 1.25, 0.075, 0.02, 0.008), Mtrans(-w * 0.36, GROUND_Y + 0.62, 0)));
    post.merge(xf(boxRound(0.075, 1.25, 0.075, 0.02, 0.008), Mtrans(w * 0.36, GROUND_Y + 0.62, 0)));
    post.merge(xf(boxRound(w * 1.1, 0.06, 0.05, 0.015, 0.006), Mtrans(0, GROUND_Y + 1.16, 0)));
    add(post, MAT.woodPost, node, { shadow: idx < 2 });
    var board = exXY(roundRect(w, hh2, 0.03, 0, GROUND_Y + 1.52), [], 0.028, 0.014, { bevel: 0.006 });
    add(board, MAT.paper, node, { shadow: idx < 2 });
    // чёрные концентрические кольца
    var rings2 = new Mesh();
    for (var k = 0; k < 4; k++) {
      var ro = (0.235 - k * 0.052) * scale, ri = (0.205 - k * 0.052) * scale;
      if (ri <= 0.004) break;
      rings2.merge(exXY(ellipseRing(ro, ro, 0, GROUND_Y + 1.52, 40), [ellipseRing(ri, ri, 0, GROUND_Y + 1.52, 40)], 0.002, 0.012));
    }
    rings2.merge(exXY(ellipseRing(0.030 * scale, 0.030 * scale, 0, GROUND_Y + 1.52, 24), [], 0.002, 0.012));
    add(rings2, MAT.paperB, node, { shadow: false });
    // табличка с дистанцией
    add(exXY(roundRect(0.26, 0.10, 0.02, 0, GROUND_Y + 1.10), [], 0.02, 0.02), MAT.paperB, node, { shadow: false });
    TARGETS.push({ node: node, z: -d, dist: d, w: w, h: hh2, cy: GROUND_Y + 1.52, scale: scale });
  });

  /* ---- стол для студийного режима ---- */
  var tbl = new Mesh();
  tbl.merge(xf(boxRound(3.4, 0.05, 2.0, 0.02, 0.006), Mtrans(0, -0.30, 0)));
  add(tbl, new Mat({ base: hex(0x1a1a1d), metal: 0.05, rough: 0.62, kind: 4, wear: 0 }), N.studio, { shadow: false });
}

var PS = {

    if (this.list.length > 420) this.list.shift();
    this.list.push({
      p: [o.p[0], o.p[1], o.p[2]], v: o.v || [0, 0, 0], size: o.size || 0.1, size1: o.size1 === undefined ? o.size : o.size1,

      rot: Math.random() * TAU, rotV: (Math.random() - 0.5) * (o.spin || 1.2), drag: o.drag === undefined ? 1.6 : o.drag,
      grav: o.grav === undefined ? 0 : o.grav, seed: Math.random() * 10, fade: o.fade || 1, add: o.add !== false
    });
  },
  update: function (dt) {
    for (var i = this.list.length - 1; i >= 0; i--) {
      var p = this.list[i];
      p.age += dt;
      if (p.age >= p.life) { this.list.splice(i, 1); continue; }
      var k = Math.exp(-p.drag * dt);
      p.v[0] *= k; p.v[1] = p.v[1] * k + p.grav * dt; p.v[2] *= k;
      p.p[0] += p.v[0] * dt; p.p[1] += p.v[1] * dt; p.p[2] += p.v[2] * dt;
      p.rot += p.rotV * dt;
    }
  },
  draw: function (vp, camPos, right, up) {
    if (!this.list.length) return;
    var p = R.pPart;
    gl.useProgram(p);
    gl.uniformMatrix4fv(p.u.uVP, false, vp);
    gl.uniform3fv(p.u.uRight, right); gl.uniform3fv(p.u.uUp, up);
    gl.bindVertexArray(R.partVao);
    gl.enable(gl.BLEND); gl.depthMask(false);
    var l = this.list.slice().sort(function (a, b) {
      var da = (a.p[0] - camPos[0]) * (a.p[0] - camPos[0]) + (a.p[1] - camPos[1]) * (a.p[1] - camPos[1]) + (a.p[2] - camPos[2]) * (a.p[2] - camPos[2]);
      var db = (b.p[0] - camPos[0]) * (b.p[0] - camPos[0]) + (b.p[1] - camPos[1]) * (b.p[1] - camPos[1]) + (b.p[2] - camPos[2]) * (b.p[2] - camPos[2]);
      return db - da;
    });
    for (var i = 0; i < l.length; i++) {
      var q = l[i], t = q.age / q.life;
      var a = q.a0 * Math.pow(1 - t, q.fade);
      if (a <= 0.002) continue;
      gl.blendFunc(gl.SRC_ALPHA, q.add ? gl.ONE : gl.ONE_MINUS_SRC_ALPHA);
      gl.uniform3fv(p.u.uCenter, q.p);
      gl.uniform1f(p.u.uSize, q.size + (q.size1 - q.size) * t);
      gl.uniform1f(p.u.uRot, q.rot);
      gl.uniform1f(p.u.uSeed, q.seed);
      gl.uniform1i(p.u.uType, q.type);
      gl.uniform4f(p.u.uCol, q.col[0], q.col[1], q.col[2], a);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }
    gl.depthMask(true); gl.disable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  },
  muzzleBurst: function (pos, dir, up, right) {

var SHELLS = { pool: [], idx: 0 };
function initShells(add, mkNode) {
  var caseMesh = buildCase();
  for (var i = 0; i < 8; i++) {
    var n = mkNode('shell' + i);
    var b = add(caseMesh, MAT.brass, n, { shadow: false });
    b.visible = false;
    SHELLS.pool.push({ node: n, batch: b, alive: false, p: [0, 0, 0], v: [0, 0, 0], q: [Math.random(), Math.random(), Math.random()], w: [0, 0, 0], t: 0, landed: 0 });
  }
}
function buildCase() {
  var m = new Mesh();
  m.merge(revolveZ([
    [0, 0], [0, mm(6.7), true], [mm(1.6), mm(6.9), true], [mm(2.4), mm(6.2), true],
    [mm(4.2), mm(6.2), true], [mm(4.8), mm(5.9)], [mm(38), mm(5.85)],
    [mm(43), mm(5.6)], [mm(46.5), mm(4.2)], [mm(48.5), mm(3.95), true], [mm(53.5), mm(3.92), true],
    [mm(53.5), mm(3.35), true], [mm(46), mm(3.5)], [mm(6), mm(5.3), true], [mm(6), 0]
  ], 26));
  return m;
}
function ejectShell(pos, vel, spin) {
  var s = SHELLS.pool[SHELLS.idx % SHELLS.pool.length]; SHELLS.idx++;
  s.alive = true; s.batch.visible = true; s.t = 0; s.landed = 0;
  s.p = [pos[0], pos[1], pos[2]];
  s.v = [vel[0], vel[1], vel[2]];
  s.q = [Math.random() * TAU, Math.random() * TAU, Math.random() * TAU];
  s.w = [(Math.random() - 0.5) * spin, (Math.random() - 0.5) * spin * 0.6, (Math.random() - 0.5) * spin];
  return s;
}
function updateShells(dt) {
  for (var i = 0; i < SHELLS.pool.length; i++) {
    var s = SHELLS.pool[i];
    if (!s.alive) continue;
    s.t += dt;
    if (s.t > 7) { s.alive = false; s.batch.visible = false; continue; }
    if (s.landed < 3) {
      s.v[1] -= 9.81 * dt;
      s.p[0] += s.v[0] * dt; s.p[1] += s.v[1] * dt; s.p[2] += s.v[2] * dt;
      s.q[0] += s.w[0] * dt; s.q[1] += s.w[1] * dt; s.q[2] += s.w[2] * dt;
      var floor = GROUND_Y + 0.012;
      if (s.p[1] < floor) {
        s.p[1] = floor; s.landed++;
        s.v[1] = -s.v[1] * 0.34; s.v[0] *= 0.6; s.v[2] *= 0.6;
        s.w[0] *= 0.5; s.w[1] *= 0.5; s.w[2] *= 0.5;
        if (s.landed === 1) AU.shellLand();
        if (Math.abs(s.v[1]) < 0.35) { s.landed = 3; s.q[0] = PI / 2; s.w = [0, 0, 0]; }
      }
    }
    Mmuls2(s.node.local, Mtrans(s.p[0], s.p[1], s.p[2]), MrotY(s.q[1]), MrotX(s.q[0]), MrotZ(s.q[2]), Mtrans(0, 0, -mm(27)));
  }
}

  };
  for (i = 0; i < 4; i++) N['target' + i] = NODES['target' + i];
  function addRifle(mesh, mat, node, opt) { opt = opt || {}; opt.tag = 'rifle'; return R.addMesh(mesh, mat, node, opt); }
  buildSVD(addRifle, N);
  buildSVD2(addRifle, N);
  buildEnvironment(function (mesh, mat, node, opt) { return R.addMesh(mesh, mat, node, opt); }, N);
  initShells(function (mesh, mat, node, opt) { return R.addMesh(mesh, mat, node, opt); }, function (nm) { return mkNode(nm); });
  for (i = 0; i < 4; i++) Mcopy(Mtrans((i % 2 ? 1 : -1) * (0.6 + i * 0.9), 0, -TARGETS[i].dist), NODES['target' + i].local);
}

/* ---------- события оружия ---------- */
function fire() {
  if (APP.reloading > 0) return;
  var t = APP.time;
  if (t - APP.lastShot < 0.16) return;
  if (APP.ammo <= 0) {
    if (t - APP.lastShot < 0.35) return;
    APP.lastShot = t; APP.trigT = 0.001; AU.dryFire();
    return;
  }
  APP.lastShot = t; APP.ammo--; APP.trigT = 0.001;
  APP.cycling = 0.001;
  APP.recoilV += 3.4; APP.recoilPV += 12.5;
  APP.shake = 1.0; APP.flash = 1.0;
  AU.shot();
  var mp = muzzleWorld(), md = riflePickDir();
  PS.muzzleBurst(mp, md);
  APP.shotsFired = (APP.shotsFired || 0) + 1;
  if (APP.env === 1) {
    var gy = GROUND_Y;
    PS.dustKick([mp[0] + md[0] * 0.6, gy + 0.02, mp[2] + md[2] * 0.6], md);
  }
  APP.muzzleLight = 1.0;
  // траектория и попадание
  registerHit();
  if (APP.ammo === 0) APP.boltLocked = true;
  updateHud();
}
/* Затвор досылается только если магазин был отстрелян досуха и рама
   встала на затворную задержку. При частичной смене магазина патрон уже
   в патроннике — рукоятку не трогаем, перезарядка заметно короче. */
function reload() {
  if (APP.reloading > 0 || APP.ammo === APP.MAXAMMO) return;
  APP.reloadBolt = !!APP.boltLocked;
  APP.reloadT = 0;
  APP.reloading = APP.reloadBolt ? RL.ENDB : RL.END;
  AU.reload(0, APP.reloadBolt);
}
/* Реальная траектория: луч строится от оптической оси прицела (туда же смотрит стрелок),
   а падение пули и снос ветром добавляются как поправки относительно линии прицеливания.
   Значит, угольник сетки даёт точное попадание только при верно выставленном барабанчике. */
function registerHit() {
  var origin = APP.sight === 'iron'
    ? localToWorld([0, mm(41), mm(-233)])
    : localToWorld([0, mm(72), mm(-260)]);
  var dir = riflePickDir();
  var best = null, bestT = 1e9;
  for (var i = 0; i < TARGETS.length; i++) {
    var tg = TARGETS[i], nd = NODES['target' + i];
    var tz = nd.local[14], tx = nd.local[12];
    if (dir[2] >= -0.0001) continue;
    var tt = (tz - origin[2]) / dir[2];
    if (tt < 1 || tt > bestT) continue;
    var px = origin[0] + dir[0] * tt + windDrift(tt);
    var py = origin[1] + dir[1] * tt + impactOffset(tt, DRUM * 100);
    var lx = px - tx, ly = py - tg.cy;
    if (Math.abs(lx) < tg.w / 2 && Math.abs(ly) < tg.h / 2) { best = { t: tt, x: px, y: py, z: tz, tg: tg, lx: lx, ly: ly }; bestT = tt; }
  }
  if (best) {
    var d = best.t;
    setTimeout(function () {
      PS.hitPuff([best.x, best.y, best.z + 0.02], [0, 0, 1], 'wood');
      APP.hits.push({ x: best.x, y: best.y, z: best.z + 0.016, s: 0.014 * best.tg.scale, seed: Math.random() * 9 });
      if (APP.hits.length > 60) APP.hits.shift();
      var r = Math.hypot(best.lx, best.ly) / (0.235 * best.tg.scale);
      var score = r < 0.13 ? 10 : r < 0.36 ? 9 : r < 0.58 ? 8 : r < 0.8 ? 7 : 6;
      showHit(best.tg.dist, score);
    }, tof(d) * 1000);
    AU.impact(d, 'wood');
  }
}

/* ---------- позиции ---------- */
function localToWorld(l) {
  var w = rifleRoot.world, o = [0, 0, 0];
  o[0] = w[0] * l[0] + w[4] * l[1] + w[8] * l[2] + w[12];
  o[1] = w[1] * l[0] + w[5] * l[1] + w[9] * l[2] + w[13];
  o[2] = w[2] * l[0] + w[6] * l[1] + w[10] * l[2] + w[14];
  return o;
}
function muzzleWorld() { return localToWorld([0, 0, mm(-905)]); }
function riflePickDir() {
  var w = rifleRoot.world;
  var d = [-w[8], -w[9], -w[10]];
  var L = Math.hypot(d[0], d[1], d[2]) || 1;
  return [d[0] / L, d[1] / L, d[2] / L];
}

/* ---------- обновление ---------- */
function update(dt) {
  APP.time += dt;
  // отдача — демпфированная пружина
  var k = 340, c = 21;
  APP.recoilV += (-k * APP.recoilZ - c * APP.recoilV) * dt;
  APP.recoilZ += APP.recoilV * dt;
  APP.recoilPV += (-260 * APP.recoilP - 17 * APP.recoilPV) * dt;
  APP.recoilP += APP.recoilPV * dt;
  APP.shake = Math.max(0, APP.shake - dt * 3.4);
  APP.flash = Math.max(0, APP.flash - dt * 22);
  APP.muzzleLight = Math.max(0, APP.muzzleLight - dt * 20);
  if (APP.trigT > 0) { APP.trigT += dt; if (APP.trigT > 0.16) APP.trigT = 0; }

  // цикл автоматики
  if (APP.cycling > 0) {
    APP.cycling += dt;
    var T = APP.cycling;
    if (T < 0.055) APP.boltBack = (T / 0.055);
    else if (T < 0.115) APP.boltBack = 1;
    else if (T < 0.185) APP.boltBack = 1 - (T - 0.115) / 0.07;
    else { APP.boltBack = 0; APP.cycling = 0; }
    if (APP.boltLocked && T > 0.055) APP.boltBack = 1;
    if (!APP.ejected && T > 0.052) {
      APP.ejected = 1;
      var ep = localToWorld([mm(34), mm(14), mm(-140)]);
      var w = rifleRoot.world;
      var rx = [w[0], w[1], w[2]], uy = [w[4], w[5], w[6]], fz = [-w[8], -w[9], -w[10]];
      var sp = 3.1 + Math.random() * 1.1;
      ejectShell(ep, [rx[0] * sp + uy[0] * 1.5 + fz[0] * 0.5, rx[1] * sp + uy[1] * 1.5 + 1.0, rx[2] * sp + uy[2] * 1.5 + fz[2] * 0.5], 26);
      AU.shell();
    }
  } else APP.ejected = 0;

  /* ---- перезарядка ----
     Магазин СВД ставится качанием: сначала передний зацеп в гнездо,
     потом доворот назад до щелчка защёлки. Поэтому вращение идёт вокруг
     точки переднего зацепа, а не вокруг центра магазина. */
  var magDrop = 0, magRot = 0, magHide = 0, magTug = 0;
  if (APP.reloading > 0) {
    APP.reloading -= dt; APP.reloadT += dt;
    var T2 = APP.reloadT, u;
    if (T2 < RL.TIP0) { magRot = smoothstep(0, RL.TIP0, T2) * 0.05; }
    else if (T2 < RL.TIP1) { u = (T2 - RL.TIP0) / (RL.TIP1 - RL.TIP0); magRot = 0.05 + u * 0.26; magDrop = u * u * 0.012; }
    else if (T2 < RL.OUT1) { u = (T2 - RL.TIP1) / (RL.OUT1 - RL.TIP1); magRot = 0.31 + u * 0.22; magDrop = 0.012 + u * u * 0.30; }
    else if (T2 < RL.IN0) { magHide = 1; }
    else if (T2 < RL.SEAT) { u = (T2 - RL.IN0) / (RL.SEAT - RL.IN0); magRot = 0.36; magDrop = (1 - u) * 0.13; }
    else if (T2 < RL.LOCK) { u = (T2 - RL.SEAT) / (RL.LOCK - RL.SEAT); magRot = 0.36 * (1 - u * u); magDrop = 0; }
    else { magRot = 0; magDrop = 0; }
    // короткий контрольный рывок ладонью после посадки
    if (T2 >= RL.TUG && T2 < RL.TUG2 + 0.06)
      magTug = Math.sin(Math.min(1, (T2 - RL.TUG) / 0.14) * PI * 2) * mm(1.6);
    if (APP.reloadBolt) {
      if (T2 >= RL.BOLT0 && T2 < RL.BOLT1) APP.boltBack = smoothstep(RL.BOLT0, RL.BOLT1, T2);
      else if (T2 >= RL.BOLT1 && T2 < RL.BOLT2) APP.boltBack = 1;
      else if (T2 >= RL.BOLT2 && T2 < RL.BOLT3) APP.boltBack = 1 - (T2 - RL.BOLT2) / (RL.BOLT3 - RL.BOLT2);
      else if (T2 >= RL.BOLT3) APP.boltBack = 0;
    }
    var done = APP.reloadBolt ? RL.BOLT3 : RL.LOCK;
    if (T2 >= done && APP.ammo !== APP.MAXAMMO) { APP.ammo = APP.MAXAMMO; APP.boltLocked = false; updateHud(); }
    if (APP.reloading <= 0) { APP.reloading = 0; APP.ammo = APP.MAXAMMO; APP.boltLocked = false; updateHud(); }
  } else if (APP.boltLocked) APP.boltBack = 1;

  /* ---- смена прицела ----
     ПСО-1 НИКУДА НЕ СНИМАЕТСЯ. Меняется только положение головы стрелка:
     при работе с открытым прицелом щека сползает по гребню вниз-вперёд,
     и глаз уходит ПОД кронштейн, на линию мушка—целик (+41 мм над каналом).
     sightT — только доля этого перемещения глаза, к геометрии отношения нет. */
  var sTgt = APP.sight === 'iron' ? 1 : 0;
  APP.sightT += (sTgt - APP.sightT) * Math.min(1, dt * 6);
  if (Math.abs(APP.sightT - sTgt) < 0.002) APP.sightT = sTgt;

  /* ---- хомутик секторного прицела едет по планке вслед за дистанцией ---- */
  var slz = mm(-248) - (DRUM - 1) / 9 * mm(44);
  Mcopy(Mtrans(0, 0, slz), NODES.rsl.local);

  // узлы
  var rz = -APP.recoilZ * 0.022, rp = APP.recoilP * 0.0038;
  if (APP.mode === 'inspect') {
    if (APP.autoSpin) APP.targetYaw += dt * 0.12;
    APP.yaw += (APP.targetYaw - APP.yaw) * Math.min(1, dt * 9);
    APP.pitch += (APP.targetPitch - APP.pitch) * Math.min(1, dt * 9);
    APP.dist += (APP.targetDist - APP.dist) * Math.min(1, dt * 7);
    Mmuls2(rifleRoot.local, Mtrans(0, 0.02 + rz * 0.3, -0.16 - rz), MrotX(-rp * 0.5));
  } else {
    APP.aimYaw += (APP.aimYawT - APP.aimYaw) * Math.min(1, dt * 12);
    APP.aimPitch += (APP.aimPitchT - APP.aimPitch) * Math.min(1, dt * 12);
    var sway = APP.time * 0.7;
    var swx = Math.sin(sway * 0.9) * 0.0016 + Math.sin(sway * 2.3) * 0.0006;
    var swy = Math.cos(sway * 0.7) * 0.0013 + Math.sin(sway * 1.7) * 0.0005;
    Mmuls2(rifleRoot.local,
      MrotY(APP.aimYaw + swx), MrotX(APP.aimPitch + swy - rp),
      Mtrans(0, -mm(72), mm(-120) - rz));
  }
  Mcopy(Mtrans(0, 0, APP.boltBack * mm(100)), NODES.bolt.local);
  Mmuls2(NODES.trig.local, Mtrans(0, 0, 0), MrotX(0));
  if (APP.trigT > 0) {
    var ta = Math.sin(Math.min(1, APP.trigT / 0.06) * PI) * 0.30;
    Mmuls2(NODES.trig.local, Mtrans(0, mm(-46), mm(-14)), MrotX(-ta), Mtrans(0, mm(46), mm(14)));
  }
  // вращение вокруг переднего зацепа магазина (z ≈ −185, y ≈ −34)
  var magM = M();
  if (magHide) Mcopy(Mtrans(0, -3, 0), magM);
  else Mmuls2(magM,
    Mtrans(0, mm(-34), mm(-185)), MrotX(magRot),
    Mtrans(0, mm(34) - magDrop + magTug, mm(185)));
  Mcopy(magM, NODES.mag.local);

  NODES.range.visible = true;
  R.batches.forEach(function (b) {
    if (b.node === NODES.range || b.node === NODES.studio) b.visible = (b.node === NODES.range) === (APP.env === 1);
    if (b.node.name && b.node.name.indexOf('target') === 0) b.visible = APP.env === 1;
  });

  PS.update(dt);
  updateShells(dt);
  for (var i = 0; i < R.nodes.length; i++) R.nodes[i].update();
}
function smoothstep(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

/* ---------- камера ---------- */
function getCamera(aspect) {
  var cam = { pos: [0, 0, 0], view: M(), proj: M(), fov: 34 };
  if (APP.mode === 'inspect') {
    var d = APP.dist, cy = Math.cos(APP.pitch), sy = Math.sin(APP.pitch);
    var cx = Math.cos(APP.yaw), sx = Math.sin(APP.yaw);
    var tgt = [0, 0.0, -0.16];
    cam.pos = [tgt[0] + d * cy * sx, tgt[1] + d * sy, tgt[2] + d * cy * cx];
    var sh = APP.shake * APP.shake * 0.02;
    cam.pos[0] += Math.sin(APP.time * 61) * sh; cam.pos[1] += Math.cos(APP.time * 73) * sh;
    Mlook(cam.pos, tgt, [0, 1, 0], cam.view);
    cam.fov = 30;
  } else {
    /* Одна и та же винтовка, одна и та же прикладка — двигается только глаз.
         ПСО-1:    глаз на оптической оси, +72 мм, вынос зрачка 70 мм.
         открытый: глаз опускается ПОД кронштейн на линию мушка—целик, +41 мм,
                   и подаётся вперёд к гребню; прицел остаётся на винтовке
                   и честно закрывает верх кадра, как в жизни. */
    var se = APP.sightT * APP.sightT * (3 - 2 * APP.sightT);
    var eye = localToWorld([0,
      lerp(mm(72), GEO.Y_IRON, se),
      lerp(mm(122), mm(88), se)]);
    var fwd = riflePickDir();
    var sh2 = APP.shake * APP.shake * lerp(0.014, 0.017, se);
    eye[0] += Math.sin(APP.time * 67) * sh2; eye[1] += Math.cos(APP.time * 89) * sh2;
    cam.pos = eye;
    Mlook(eye, [eye[0] + fwd[0], eye[1] + fwd[1], eye[2] + fwd[2]], [0, 1, 0], cam.view);
    cam.fov = lerp(36, 30, se) + APP.shake * APP.shake * 1.6;
  }
  Mpersp(rad(cam.fov), aspect, 0.02, 2200, cam.proj);
  return cam;
}

/* ---------- рендер ---------- */
var VP = M(), IVP = M(), SVP = M(), tmpM = M();
function lightDirs() {
  if (APP.env === 1) return { key: v3n([0.42, 0.62, 0.66]), keyCol: [3.4, 3.05, 2.55], fill: v3n([-0.5, 0.35, -0.4]), fillCol: [0.34, 0.42, 0.58], rim: v3n([-0.3, 0.25, -0.9]), rimCol: [0.5, 0.55, 0.62], sun: v3n([0.42, 0.62, 0.66]) };
  return { key: v3n([-0.55, 0.72, 0.42]), keyCol: [2.6, 2.5, 2.35], fill: v3n([0.78, 0.36, -0.5]), fillCol: [0.30, 0.36, 0.5], rim: v3n([-0.3, 0.35, -0.89]), rimCol: [0.7, 0.6, 0.5], sun: v3n([-0.55, 0.72, 0.42]) };
}
function v3n(a) { var l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; }

function renderScenePass(vp, view, proj, camPos, opts) {
  var p = R.pScene, L = lightDirs();
  gl.useProgram(p);
  gl.uniformMatrix4fv(p.u.uVP, false, vp);
  gl.uniform3fv(p.u.uCam, camPos);
  gl.uniform1i(p.u.uEnvMode, APP.env);
  gl.uniform3fv(p.u.uSunDir, L.sun);
  gl.uniform3fv(p.u.uKeyDir, L.key); gl.uniform3fv(p.u.uKeyCol, L.keyCol);
  gl.uniform3fv(p.u.uFillDir, L.fill); gl.uniform3fv(p.u.uFillCol, L.fillCol);
  gl.uniform3fv(p.u.uRimDir, L.rim); gl.uniform3fv(p.u.uRimCol, L.rimCol);
  gl.uniformMatrix4fv(p.u.uShadowVP, false, SVP);
  gl.uniform2f(p.u.uRes, opts.res[0], opts.res[1]);
  gl.uniform1i(p.u.uUseAO, opts.ao ? 1 : 0);
  gl.uniform1f(p.u.uFogDens, APP.env === 1 ? 0.00062 : 0.0);
  gl.uniform3f(p.u.uFogCol, 0.30, 0.335, 0.375);
  var mw = muzzleWorld();
  gl.uniform3fv(p.u.uMuzzlePos, mw);
  var ml = APP.muzzleLight * APP.muzzleLight;
  gl.uniform3f(p.u.uMuzzleCol, ml * 34, ml * 21, ml * 8);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.shadowTex); gl.uniform1i(p.u.uShadow, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, opts.ao ? R.aoTex2 : R.whiteTex); gl.uniform1i(p.u.uAOTex, 1);
  R.drawBatches(p, { skipTag: opts.skipRifle ? 'rifle' : null });
}

function drawSky(invVP, camPos) {
  var p = R.pSky;
  gl.useProgram(p);
  gl.uniformMatrix4fv(p.u.uInvVP, false, invVP);
  gl.uniform3fv(p.u.uCam, camPos);
  gl.uniform1i(p.u.uEnvMode, APP.env);
  gl.uniform3fv(p.u.uSunDir, lightDirs().sun);
  gl.depthMask(false); gl.disable(gl.DEPTH_TEST);
  gl.bindVertexArray(R.quadVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
}

function renderFrame(dt) {
  var W = R.size[0], H = R.size[1], aspect = W / H;
  var cam = getCamera(aspect);
  Mmul(cam.proj, cam.view, VP);
  Minv(VP, IVP);

  /* ---- тени ---- */
  var L = lightDirs();
  var ctr = APP.mode === 'inspect' ? [0, 0, -0.16] : localToWorld([0, 0, mm(-300)]);
  var sd = 1.35, lp = [ctr[0] + L.key[0] * 4, ctr[1] + L.key[1] * 4, ctr[2] + L.key[2] * 4];
  var lv = M(), lo = M();
  Mlook(lp, ctr, [0, 1, 0], lv);
  Mortho(-sd, sd, -sd, sd, 0.5, 9, lo);
  Mmul(lo, lv, SVP);
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboShadow);
  gl.viewport(0, 0, R.shadowSize, R.shadowSize);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.FRONT);
  gl.useProgram(R.pDepth);
  gl.uniformMatrix4fv(R.pDepth.u.uVP, false, SVP);
  R.drawBatches(R.pDepth, { shadowOnly: true, noMat: true });
  gl.cullFace(gl.BACK);

  /* ---- prepass + SSAO ---- */
  var useAO = APP.ssao && GLX.hdr && APP.quality > 0;
  if (useAO) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboND);
    gl.viewport(0, 0, R.ndSize[0], R.ndSize[1]);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(R.pNrm);
    gl.uniformMatrix4fv(R.pNrm.u.uVP, false, VP);
    gl.uniformMatrix4fv(R.pNrm.u.uView, false, cam.view);
    R.drawBatches(R.pNrm, { noMat: true });
    gl.disable(gl.DEPTH_TEST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboAO);
    gl.viewport(0, 0, R.ndSize[0], R.ndSize[1]);
    var ps = R.pSSAO; gl.useProgram(ps);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.ndTex); gl.uniform1i(ps.u.uND, 0);
    gl.uniform2f(ps.u.uRes, R.ndSize[0], R.ndSize[1]);
    gl.uniform1f(ps.u.uP00, cam.proj[0]); gl.uniform1f(ps.u.uP11, cam.proj[5]);
    gl.uniform1f(ps.u.uRadius, APP.mode === 'inspect' ? 0.035 : 0.05);
    gl.uniformMatrix4fv(ps.u.uProj, false, cam.proj);
    gl.bindVertexArray(R.quadVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
    // размытие
    var pb = R.pBlur; gl.useProgram(pb);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboAO2);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.aoTex); gl.uniform1i(pb.u.uTex, 0);
    gl.uniform2f(pb.u.uDir, 1.4 / R.ndSize[0], 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboAO);
    gl.bindTexture(gl.TEXTURE_2D, R.aoTex2);
    gl.uniform2f(pb.u.uDir, 0, 1.4 / R.ndSize[1]); gl.drawArrays(gl.TRIANGLES, 0, 3);
    // итог в aoTex2
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboAO2);
    gl.bindTexture(gl.TEXTURE_2D, R.aoTex);
    gl.uniform2f(pb.u.uDir, 0, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.enable(gl.DEPTH_TEST);
  }

  /* ---- вид в прицел (только ПСО-1: у открытого прицел�� нет увеличения) ---- */
  var scopeOn = APP.mode === 'aim' && APP.sight === 'pso' && APP.sightT < 0.5;
  if (scopeOn) {
    var sEye = localToWorld([0, mm(72), mm(-260)]);
    var fwd = riflePickDir();
    var sView = M(), sProj = M(), sVP = M(), sInv = M();
    Mlook(sEye, [sEye[0] + fwd[0], sEye[1] + fwd[1], sEye[2] + fwd[2]], [0, 1, 0], sView);
    Mpersp(rad(6.0), 1, 0.05, 2400, sProj);
    Mmul(sProj, sView, sVP); Minv(sVP, sInv);
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboScope);
    gl.viewport(0, 0, R.scopeSize, R.scopeSize);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    drawSky(sInv, sEye);
    renderScenePass(sVP, sView, sProj, sEye, { res: [R.scopeSize, R.scopeSize], ao: false, skipRifle: true });
    drawHitDecals(sVP, sEye, fwd);
    PS.draw(sVP, sEye, [sView[0], sView[4], sView[8]], [sView[1], sView[5], sView[9]]);
  }

  /* ---- основной проход ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboMS);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawSky(IVP, cam.pos);
  renderScenePass(VP, cam.view, cam.proj, cam.pos, { res: [W, H], ao: useAO, skipRifle: false });
  drawHitDecals(VP, cam.pos, riflePickDir());
  PS.draw(VP, cam.pos, [cam.view[0], cam.view[4], cam.view[8]], [cam.view[1], cam.view[5], cam.view[9]]);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, R.fboMS);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, R.fboScene);
  gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);

  /* ---- комбинирование с картинкой прицела ---- */
  gl.disable(gl.DEPTH_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fboComb);
  gl.viewport(0, 0, W, H);
  var pc = R.pComb; gl.useProgram(pc);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.sceneTex); gl.uniform1i(pc.u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, R.scopeTex); gl.uniform1i(pc.u.uScope, 1);
  gl.uniform2f(pc.u.uRes, W, H);
  gl.uniform1f(pc.u.uScopeOn, scopeOn ? 1 : 0);
  gl.uniform1f(pc.u.uCircleR, SCOPE_R);
  gl.uniform2f(pc.u.uCircleC, 0.5, 0.5);
  gl.bindVertexArray(R.quadVao); gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* ---- bloom ---- */
  var pbr = R.pBright; gl.useProgram(pbr);
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fbr0);
  gl.viewport(0, 0, R.brSize[0][0], R.brSize[0][1]);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.combTex); gl.uniform1i(pbr.u.uTex, 0);
  gl.uniform1f(pbr.u.uThr, GLX.hdr ? 1.0 : 0.78);
  gl.bindVertexArray(R.quadVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
  var pb2 = R.pBlur; gl.useProgram(pb2);
  var chain = [[R.fbr1, R.br0, R.brSize[1]], [R.fbr2, R.br1, R.brSize[2]]];
  for (var ci = 0; ci < chain.length; ci++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, chain[ci][0]);
    gl.viewport(0, 0, chain[ci][2][0], chain[ci][2][1]);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, chain[ci][1]); gl.uniform1i(pb2.u.uTex, 0);
    gl.uniform2f(pb2.u.uDir, 1.6 / chain[ci][2][0], 1.0 / chain[ci][2][1]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fbr1);
  gl.viewport(0, 0, R.brSize[1][0], R.brSize[1][1]);
  gl.bindTexture(gl.TEXTURE_2D, R.br2);
  gl.uniform2f(pb2.u.uDir, 1.0 / R.brSize[1][0], 0);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fbr0);
  gl.viewport(0, 0, R.brSize[0][0], R.brSize[0][1]);
  gl.bindTexture(gl.TEXTURE_2D, R.br1);
  gl.uniform2f(pb2.u.uDir, 1.0 / R.brSize[0][0], 0.6 / R.brSize[0][1]);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.BLEND);

  /* ---- финал ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  var pp = R.pPost; gl.useProgram(pp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.combTex); gl.uniform1i(pp.u.uTex, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, R.br0); gl.uniform1i(pp.u.uBloom, 1);
  gl.uniform1f(pp.u.uExp, (APP.env === 1 ? 1.02 : 1.25) * (1 + APP.flash * 0.55));
  gl.uniform1f(pp.u.uTime, APP.time);
  gl.uniform1f(pp.u.uVig, APP.mode === 'aim' ? 0.30 : 0.42);
  gl.uniform1f(pp.u.uGrain, 0.016);
  gl.uniform1f(pp.u.uBloomAmt, 0.55);
  gl.uniform1f(pp.u.uShakeCA, APP.shake * APP.shake * 0.004);
  gl.bindVertexArray(R.quadVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST);
}

/* пробоины на мишенях */
function drawHitDecals(vp, camPos) {
  if (!APP.hits.length || APP.env !== 1) return;
  var p = R.pPart;
  gl.useProgram(p);
  gl.uniformMatrix4fv(p.u.uVP, false, vp);
  gl.uniform3f(p.u.uRight, 1, 0, 0); gl.uniform3f(p.u.uUp, 0, 1, 0);
  gl.uniform1i(p.u.uType, 3);
  gl.uniform1f(p.u.uRot, 0);
  gl.bindVertexArray(R.partVao);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  for (var i = 0; i < APP.hits.length; i++) {
    var h = APP.hits[i];
    gl.uniform3f(p.u.uCenter, h.x, h.y, h.z);
    gl.uniform1f(p.u.uSize, h.s);
    gl.uniform1f(p.u.uSeed, h.seed);
    gl.uniform4f(p.u.uCol, 1, 1, 1, 1);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }
  gl.depthMask(true); gl.disable(gl.BLEND);
}

/* ===== 09_boot.js ===== */
/* ===================== БАЛЛИСТИКА, UI, СЕТКА, ЗАПУСК ===================== */
var SCOPE_R = 0.315;          // радиус круга прицела (доля высоты экрана)
var SCOPE_H = 0.072;          // превышение оптической оси ПСО-1 над каналом ствола, м
var IRON_H = 0.041;           // превышение линии мушка—целик над каналом ствола, м
/* Превышение линии прицеливания зависит от того, через что целятся: через оптику
   оно вдвое больше, поэтому одна и та же точка прицеливания даёт разные точки попадания. */
function sightH() { return APP.sight === 'iron' ? IRON_H : SCOPE_H; }
 var V0 = 830, KDRAG = 0.00088, GACC = 9.81;
function tof(d) { return (Math.exp(KDRAG * d) - 1) / (KDRAG * V0); }
function bdrop(d) { var t = tof(d); return 0.5 * GACC * t * t; }
function theta(Z) { var h = sightH(); return (bdrop(Z) + h) / Z; }
function impactOffset(d, Z) { var h = sightH(); return theta(Z) * d - bdrop(d) - h; }
var WIND = 1.6;
function windDrift(d) { return WIND * (tof(d) - d / V0); }

/* ---------- сетка ПСО-1 ---------- */
var MILU = 3.0;  // единиц viewBox на одну тысячную
function buildReticle() {
  var s = [], W = 1.7;
  function ln(x1, y1, x2, y2, w) { s.push('<line x1="' + x1.toFixed(2) + '" y1="' + y1.toFixed(2) + '" x2="' + x2.toFixed(2) + '" y2="' + y2.toFixed(2) + '" stroke-width="' + (w || W) + '"/>'); }
  function txt(x, y, t, sz) { s.push('<text x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" font-size="' + (sz || 8) + '">' + t + '</text>'); }

  /* главный угольник — вершина в точке прицеливания (0,0) */
  var L = 4.2 * MILU;
  s.push('<path d="M ' + (-L) + ' ' + L * 0.92 + ' L 0 0 L ' + L + ' ' + L * 0.92 + '" fill="none" stroke-width="' + (W * 1.15) + '" stroke-linecap="round" stroke-linejoin="miter"/>');

  /* дополнительные угольники 1100 / 1200 / 1300 м */
  [[3.6, 2.6], [7.2, 2.3], [10.8, 2.0]].forEach(function (c) {
    var y = c[0] * MILU, l = c[1] * MILU;
    s.push('<path d="M ' + (-l) + ' ' + (y + l * 0.9) + ' L 0 ' + y + ' L ' + l + ' ' + (y + l * 0.9) + '" fill="none" stroke-width="' + (W * 0.95) + '"/>');
  });

  /* горизонтальная шкала боковых поправок: по 10 тысячных в каждую сторону */
  for (var side = -1; side <= 1; side += 2) {
    ln(side * 4.6 * MILU, 0, side * 10 * MILU, 0, W);
    for (var m = 1; m <= 10; m++) {
      var x = side * m * MILU;
      if (m < 5) continue;
      var big = (m % 5 === 0);
      ln(x, 0, x, big ? 3.1 * MILU : 1.5 * MILU, big ? W : W * 0.8);
      if (big) txt(x - (side < 0 ? 3.6 : 3.6), -2.6, String(m), 7.6);
    }
    for (m = 5; m <= 10; m++) { }
  }
  // мелкие штрихи между 5 и 10 тысячными
  for (side = -1; side <= 1; side += 2)
    for (var mm2 = 6; mm2 <= 9; mm2++) ln(side * mm2 * MILU, 0, side * mm2 * MILU, 1.5 * MILU, W * 0.7);

  /* дальномерная шкала (цель высотой 1,7 м) */
  var bx0 = -30 * MILU * 0.8, by = -8.6 * MILU;
  var pts = [], labels = [2, 4, 6, 8, 10];
  var span = 17 * MILU;
  for (var i = 0; i <= 16; i++) {
    var r = 200 + (1000 - 200) * (i / 16);
    var mil = 1.7 / r * 1000;
    var x = bx0 + span * (i / 16);
    pts.push([x, by - mil * MILU]);
  }
  var dpath = 'M ' + pts[0][0].toFixed(2) + ' ' + pts[0][1].toFixed(2);
  for (i = 1; i < pts.length; i++) dpath += ' L ' + pts[i][0].toFixed(2) + ' ' + pts[i][1].toFixed(2);
  s.push('<path d="' + dpath + '" fill="none" stroke-width="' + W + '"/>');
  ln(bx0, by, bx0 + span, by, W);
  ln(bx0, by, bx0, pts[0][1], W);
  labels.forEach(function (lb) {
    var t = (lb * 100 - 200) / 800;
    var x = bx0 + span * t;
    ln(x, by, x, by + 1.6 * MILU, W * 0.8);
    txt(x - 3.2, by + 5.2 * MILU, String(lb), 7.6);
  });

  return s.join('');
}
function mountReticle() {
  var g = document.getElementById('ret-g');
  g.innerHTML = buildReticle();
}
function doResize(force) {
  var w = Math.max(2, window.innerWidth), h = Math.max(2, window.innerHeight);
  var dpr = Math.min(window.devicePixelRatio || 1, APP.quality > 0 ? 2 : 1.2);
  R.cssSize = [w, h];
  if (force) R.size = [0, 0];
  R.resize(w, h, dpr);
  layoutReticle();
}
function layoutReticle() {
  var svg = document.getElementById('reticle');
  if (!R.cssSize) R.cssSize = [window.innerWidth, window.innerHeight];
  var h = R.cssSize[1], w = R.cssSize[0];
  var d = 2 * SCOPE_R * h;
  svg.style.width = d + 'px'; svg.style.height = d + 'px';
  svg.style.left = (w * 0.5 - d / 2) + 'px';
  svg.style.top = (h * 0.5 - d / 2) + 'px';
}

/* ---------- HUD ---------- */
function updateHud() {
  var pips = '';
  for (var i = 0; i < APP.MAXAMMO; i++) pips += '<i class="' + (i < APP.ammo ? 'on' : '') + '"></i>';
  document.getElementById('ammo-pips').innerHTML = pips;
  document.getElementById('ammo-num').textContent = APP.ammo + ' / ' + APP.MAXAMMO;
  var d = document.getElementById('drum');
  if (d) d.textContent = DRUM + ' — ' + (DRUM * 100) + ' м';
  var dl = document.getElementById('drum-l');
  if (dl) dl.textContent = APP.sight === 'iron' ? 'Прицельная планка' : 'Барабанчик';
  var sg = document.getElementById('sight-v');
  if (sg) sg.textContent = APP.sight === 'iron' ? 'Открытый' : 'ПСО-1 4×24';
}
var hitTimer = null;
function showHit(dist, score) {
  var el = document.getElementById('hit');
  el.innerHTML = '<b>' + score + '</b><span>попадание · ' + dist + ' м</span>';
  el.classList.add('show');
  clearTimeout(hitTimer);
  hitTimer = setTimeout(function () { el.classList.remove('show'); }, 1400);
}
function toast(t) {
  var el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('show'); }, 1500);
}

/* ---------- режимы ---------- */
var DRUM = 1;
function setMode(m) {
  APP.mode = m;
  document.body.classList.toggle('aiming', m === 'aim');
  document.getElementById('btn-aim').classList.toggle('active', m === 'aim');
  if (m === 'aim') { APP.autoSpin = false; AU.setAmbience(1); } else AU.setAmbience(0.3);
}
/* Переключение прицельных приспособлений.
   ПСО-1 остаётся на кронштейне всегда — переключается только то, ЧЕМ целятся:
   глаз либо на оптической оси, либо уходит вниз под кронштейн, на механику. */
function toggleSight() {
  APP.sight = APP.sight === 'pso' ? 'iron' : 'pso';
  var iron = APP.sight === 'iron';
  var b = document.getElementById('btn-sight');
  b.textContent = iron ? 'Открытый' : 'ПСО-1 4×';
  b.classList.toggle('active', iron);
  document.body.classList.toggle('irons', iron);
  var ret = document.getElementById('reticle');
  if (ret) ret.style.display = iron ? 'none' : '';
  AU.ready && AU.safety();
  toast(iron ? 'Открытый прицел — смотрим под кронштейном ПСО-1' : 'ПСО-1 4×24 — глаз на оптической оси');
  updateHud();
}
function setEnv(e) {
  APP.env = e;
  document.getElementById('btn-env').textContent = e === 1 ? 'Стрельбище' : 'Студия';
  AU.ready && AU.setEnv(e === 1 ? 'outdoor' : 'studio');
  if (e === 0 && APP.mode === 'aim') setMode('inspect');
  document.getElementById('btn-aim').style.display = e === 1 ? '' : 'none';
}

/* ---------- ввод ---------- */
function initInput(canvas) {
  var dragging = false, px = 0, py = 0, moved = 0;
  function down(e) {
    if (e.button === 2) { e.preventDefault(); if (APP.env === 1) setMode(APP.mode === 'aim' ? 'inspect' : 'aim'); return; }
    dragging = true; moved = 0; px = e.clientX; py = e.clientY;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  }
  function move(e) {
    if (!dragging) return;
    var dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (APP.mode === 'inspect') {
      APP.autoSpin = false;
      APP.targetYaw -= dx * 0.006; APP.targetPitch += dy * 0.005;
      APP.targetPitch = Math.max(-0.9, Math.min(1.1, APP.targetPitch));
    } else {
      APP.aimYawT -= dx * 0.00042; APP.aimPitchT += dy * 0.00042;
      APP.aimYawT = Math.max(-0.30, Math.min(0.30, APP.aimYawT));
      APP.aimPitchT = Math.max(-0.12, Math.min(0.14, APP.aimPitchT));
    }
  }
  function up(e) {
    if (dragging && moved < 6 && e.button === 0 && e.target === canvas) { unlock(); fire(); }
    dragging = false;
  }
  canvas.addEventListener('pointerdown', down);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (APP.mode === 'inspect') {
      APP.targetDist = Math.max(0.55, Math.min(3.2, APP.targetDist * (1 + Math.sign(e.deltaY) * 0.09)));
      APP.autoSpin = false;
    } else {
      DRUM = Math.max(1, Math.min(10, DRUM - Math.sign(e.deltaY)));
      updateHud(); AU.ready && AU.safety();
      toast('Барабанчик дистанции: ' + (DRUM * 100) + ' м');
    }
  }, { passive: false });
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === ' ' || k === 'enter') { e.preventDefault(); unlock(); fire(); }
    else if (k === 'r' || k === 'к') { unlock(); reload(); }
    else if (k === 'tab') { e.preventDefault(); if (APP.env === 1) setMode(APP.mode === 'aim' ? 'inspect' : 'aim'); }
    else if (k === '1') setEnv(0);
    else if (k === '2') setEnv(1);
    else if (k === 'm' || k === 'ь') toggleSound();
    else if (k === 'v' || k === 'м') { unlock(); toggleSight(); }
  });
}
function unlock() {
  if (!AU.ready) { if (AU.init()) { AU.setEnv(APP.env === 1 ? 'outdoor' : 'studio'); AU.startAmbience(); AU.setAmbience(APP.mode === 'aim' ? 1 : 0.3); } }
  AU.resume();
}
function toggleSound() {
  unlock();
  AU.setMuted(!AU.muted);
  document.getElementById('btn-snd').classList.toggle('off', AU.muted);
  document.getElementById('btn-snd').textContent = AU.muted ? 'Звук выкл.' : 'Звук вкл.';
}

/* ---------- запуск ---------- */
var lastT = 0, acc = 0, lowFrames = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  var t = ts * 0.001;
  var dt = Math.min(0.05, lastT ? t - lastT : 0.016);
  lastT = t;
  APP.frames++; APP.fpsT += dt;
  if (APP.fpsT > 0.5) {
    APP.fps = APP.frames / APP.fpsT; APP.frames = 0; APP.fpsT = 0;
    var f = document.getElementById('fps');
    if (f) f.textContent = Math.round(APP.fps) + ' fps';
    if (APP.fps < 26) { lowFrames++; if (lowFrames === 2 && APP.quality > 0) { APP.quality = 0; APP.ssao = false; doResize(true); toast('Качество снижено для плавности'); } }
    else lowFrames = 0;
  }
  try {
    update(dt);
    renderFrame(dt);
  } catch (err) { fatal(err); throw err; }
}
function fatal(err) {
  var el = document.getElementById('err');
  if (!el) return;
  el.style.display = 'block';
  el.innerHTML = '<b>Ошибка</b><pre>' + String(err && err.stack || err).replace(/</g, '&lt;') + '</pre>';
}
function boot() {
  var canvas = document.getElementById('c');
  try {
    if (!glInit(canvas)) {
      document.getElementById('err').style.display = 'block';
      document.getElementById('err').innerHTML = '<b>WebGL2 недоступен</b><pre>Включите аппаратное ускорение в браузере.</pre>';
      return;
    }
    R.init(canvas);
    buildAll();
    doResize(true);
    mountReticle();
    updateHud();
    setEnv(1);
    setMode('inspect');
    // дип-линк на ракурс: ?az=45&el=12&dist=1.1&mode=aim
    try {
      var qp = new URLSearchParams(location.search), q = window.__QA || {};
      function gv(k) { return q[k] !== undefined ? q[k] : (qp.has(k) ? qp.get(k) : undefined); }
      if (gv('az') !== undefined) APP.yaw = rad(parseFloat(gv('az')));
      if (gv('el') !== undefined) APP.pitch = rad(parseFloat(gv('el')));
      if (gv('dist') !== undefined) APP.dist = parseFloat(gv('dist'));
      if (gv('env') !== undefined) setEnv(parseInt(gv('env'), 10) ? 1 : 0);
      if (gv('mode') === 'aim') setMode('aim');
      if (gv('drum') !== undefined) { DRUM = parseInt(gv('drum'), 10); updateHud(); }
      if (gv('sight') === 'iron') { toggleSight(); APP.sightT = 1; }
    } catch (e) { }
    initInput(canvas);
    window.addEventListener('resize', function () { doResize(); });
    document.getElementById('btn-fire').addEventListener('click', function () { unlock(); fire(); });
    document.getElementById('btn-reload').addEventListener('click', function () { unlock(); reload(); });
    document.getElementById('btn-aim').addEventListener('click', function () { unlock(); setMode(APP.mode === 'aim' ? 'inspect' : 'aim'); });
    document.getElementById('btn-sight').addEventListener('click', function () { unlock(); toggleSight(); });
    document.getElementById('btn-env').addEventListener('click', function () { unlock(); setEnv(APP.env === 1 ? 0 : 1); });
    document.getElementById('btn-snd').addEventListener('click', toggleSound);
    document.getElementById('btn-ret').addEventListener('click', function () {
      var svg = document.getElementById('reticle');
      svg.classList.toggle('lit');
      this.classList.toggle('active');
    });
    document.getElementById('loading').style.display = 'none';
    requestAnimationFrame(loop);
  } catch (e) { fatal(e); }
}
window.addEventListener('error', function (e) { fatal(e.error || e.message); });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
