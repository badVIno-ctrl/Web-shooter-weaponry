<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#08090b;
  font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  color:#e8eaed;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}

/* ---------- виньетка ---------- */
#vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 42%,rgba(0,0,0,.28) 78%,rgba(0,0,0,.55) 100%)}

/* ---------- сетка ---------- */
#reticle{position:fixed;pointer-events:none;opacity:0;transition:opacity .18s ease;z-index:5;
  filter:drop-shadow(0 0 1px rgba(255,255,255,.35))}
body.aiming #reticle{opacity:1}
#reticle #ret-g{stroke:#0d0e10}
#reticle.lit #ret-g{stroke:#ff5a2b;filter:drop-shadow(0 0 2.5px rgba(255,90,43,.9))}
#reticle text{fill:#0d0e10;stroke:none}

/* ---------- шапка ---------- */
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:16px 18px;z-index:10;pointer-events:none;

#top .title b{display:block;font-size:19px;letter-spacing:.22em;font-weight:700}
#top .title span{display:block;font-size:10.5px;letter-spacing:.09em;color:#8b9099;margin-top:3px;text-transform:uppercase}
#top .stats{font-size:11px;color:#7d838c;font-variant-numeric:tabular-nums;letter-spacing:.05em}
body.aiming #top{opacity:.25}

#side{position:fixed;top:74px;left:18px;z-index:10;display:flex;flex-direction:column;gap:9px;width:212px}
.card{background:rgba(12,14,17,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:11px 13px}
.card .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#8b9099;
  letter-spacing:.05em;text-transform:uppercase;margin:3px 0}
.card .row b{color:#f0f2f4;font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-transform:none}

#bar .big{font-weight:700;padding:12px 26px;font-size:12.5px}

.sp{width:26px;height:26px;border:2px solid rgba(255,255,255,.12);border-top-color:#c9903c;border-radius:50%;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#err{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;max-width:88vw;max-height:70vh;
  overflow:auto;background:rgba(28,12,12,.96);border:1px solid rgba(255,90,70,.35);border-radius:12px;padding:18px 20px;
  color:#ffd9d0;font-size:12px}

#err pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.55}

@media (max-width:820px){
  #side{display:none}

<!-- ORDNANCE:BEGIN -->
<script>
/* ============================================================================
   ORDNANCE — physically-based firearm audio synthesis.

   Every sound is rendered offline, sample by sample, into a plain Float32Array.
   There is not one oscillator in this file, on purpose: a muzzle blast has no
   fundamental. It is a shock discontinuity followed by a decaying overpressure,
   and any sine/triangle you put under it is heard as a pitch — that is the
   "toy bell" artefact this engine exists to remove.

   Layers, in the order they physically occur:

     1  muzzle blast     ideal-blast (Friedlander) N-wave, sample-exact rise
     2  body / thump     same waveform at a much longer time constant
     3  jet roar         turbulent propellant-gas efflux, broadband, tilted
     4  ballistic crack  bullet bow-shock N-wave, supersonic rounds only
     5  ground bounce    the reflection that gives a gunshot its comb colour
     6  mechanics        modal steel impacts at the real cycle times
     7  brass            case ejection ring + floor bounces
     8  tail             8-line FDN, damped, for the outdoor decay

   Pure JS, no dependencies, deterministic given a seed. Runs identically in
   Node (for the measurement gates) and in the browser (for playback).
   ========================================================================== */

'use strict';

/* ------------------------------------------------------------------ helpers */

const P_ATM = 101325;      // Pa
const C_AIR = 343;         // m/s
const E_NITRO = 4.2e6;     // J/kg, single-base nitrocellulose propellant
const BLAST_FRAC = 0.33;   // fraction of chemical energy leaving as muzzle blast

/* deterministic PRNG — the gates must be reproducible */
function rng(seed) {
  let a = (seed | 0) || 1;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- biquads (RBJ cookbook), applied in place over a whole buffer -------- */

function biquad(type, f0, Q, sr, gainDb) {
  const w0 = 2 * Math.PI * Math.min(f0, sr * 0.49) / sr;
  const cw = Math.cos(w0), sw = Math.sin(w0);
  const al = sw / (2 * Q);
  let b0, b1, b2, a0, a1, a2;
  if (type === 'lp') {
    b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = b0;
    a0 = 1 + al; a1 = -2 * cw; a2 = 1 - al;
  } else if (type === 'hp') {
    b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = b0;
    a0 = 1 + al; a1 = -2 * cw; a2 = 1 - al;
  } else if (type === 'bp') {                     // constant skirt, peak = Q
    b0 = al; b1 = 0; b2 = -al;
    a0 = 1 + al; a1 = -2 * cw; a2 = 1 - al;
  } else if (type === 'peak') {
    const A = Math.pow(10, (gainDb || 0) / 40);
    b0 = 1 + al * A; b1 = -2 * cw; b2 = 1 - al * A;
    a0 = 1 + al / A; a1 = -2 * cw; a2 = 1 - al / A;
  } else if (type === 'ls') {
    const A = Math.pow(10, (gainDb || 0) / 40);
    const s = 2 * Math.sqrt(A) * al;
    b0 = A * ((A + 1) - (A - 1) * cw + s);
    b1 = 2 * A * ((A - 1) - (A + 1) * cw);
    b2 = A * ((A + 1) - (A - 1) * cw - s);
    a0 = (A + 1) + (A - 1) * cw + s;
    a1 = -2 * ((A - 1) + (A + 1) * cw);
    a2 = (A + 1) + (A - 1) * cw - s;
  } else { // 'hs'
    const A = Math.pow(10, (gainDb || 0) / 40);
    const s = 2 * Math.sqrt(A) * al;
    b0 = A * ((A + 1) + (A - 1) * cw + s);
    b1 = -2 * A * ((A - 1) + (A + 1) * cw);
    b2 = A * ((A + 1) + (A - 1) * cw - s);
    a0 = (A + 1) - (A - 1) * cw + s;
    a1 = 2 * ((A - 1) - (A + 1) * cw);
    a2 = (A + 1) - (A - 1) * cw - s;
  }
  return { b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0 };
}

function filterInto(dst, src, c, n) {
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < n; i++) {
    const x = src[i];
    const y = c.b0 * x + c.b1 * x1 + c.b2 * x2 - c.a1 * y1 - c.a2 * y2;
    x2 = x1; x1 = x; y2 = y1; y1 = y;
    dst[i] = y;
  }
}

/* ---------------------------------------------------------- blast waveform */

/* Friedlander ideal blast wave, normalised to peak 1 at t=0.
     p(t) = (1 - t/tau) * exp(-t/tau)
   Fourier magnitude is w/(a^2+w^2) with a = 1/tau, so the spectral peak sits
   exactly at f = 1/(2*pi*tau). That identity is what lets the caliber's
   physical blast energy choose the sound's colour instead of a magic number.  */
function addFriedlander(buf, i0, sr, tau, amp, n) {
  const a = 1 / tau;
  // run to 12 tau; beyond that it is below -100 dB
  const len = Math.min(n - i0, Math.ceil(12 * tau * sr));
  for (let k = 0; k < len; k++) {
    const t = k / sr;
    buf[i0 + k] += amp * (1 - t * a) * Math.exp(-t * a);
  }
}

/* -------------------------------------------------------------- noise beds */

function noiseBurst(buf, i0, sr, dur, amp, opt, rnd, n) {
  // shaped broadband noise: attack in `atk` seconds, then power-law decay
  const len = Math.min(n - i0, Math.ceil(dur * sr));
  if (len <= 0) return;
  const atk = Math.max(1, Math.floor((opt.atk || 0) * sr));
  const shape = opt.shape === undefined ? 2.2 : opt.shape;
  const tmp = new Float32Array(len);
  for (let k = 0; k < len; k++) {
    const u = k / len;
    const env = k < atk ? (k / atk) : Math.pow(1 - (k - atk) / (len - atk || 1), shape);
    tmp[k] = (rnd() * 2 - 1) * env;
  }
  if (opt.hp) { const o = new Float32Array(len); filterInto(o, tmp, biquad('hp', opt.hp, opt.hpq || 0.707, sr), len); tmp.set(o); }
  if (opt.lp) { const o = new Float32Array(len); filterInto(o, tmp, biquad('lp', opt.lp, opt.lpq || 0.707, sr), len); tmp.set(o); }
  if (opt.bp) { const o = new Float32Array(len); filterInto(o, tmp, biquad('bp', opt.bp, opt.bpq || 1.0, sr), len); tmp.set(o); }
  if (opt.tiltDb) { const o = new Float32Array(len); filterInto(o, tmp, biquad('hs', opt.tiltHz || 1200, 0.707, sr, opt.tiltDb), len); tmp.set(o); }
  for (let k = 0; k < len; k++) buf[i0 + k] += tmp[k] * amp;
}

/* ------------------------------------------------------- modal steel impact

   A struck metal part is a broadband contact transient plus a bank of decaying
   resonances. Three rules keep this from turning into a bell, which is the
   failure mode this whole engine exists to avoid:

     - the mode ratios are deliberately INHARMONIC; an integer-ratio bank is a
       musical note
     - decays are SHORT (5-25 ms), because a bolt carrier inside a receiver is
       clamped by every part it touches; the 50 ms+ ring of a struck free bar
       does not happen inside a gun
     - every mode is excited by a NOISE burst rather than an impulse, so the
       partial is a narrow band and not a pure line in the spectrum

   The third rule is the important one. A rotating phasor is an exact sinusoid
   and measures as a tonal peak; a resonator driven by a short noise burst has
   the same perceived pitch-colour and a fraction of the spectral prominence. */

const STEEL_MODES = [1.000, 1.593, 2.135, 2.296, 3.011, 3.407, 4.181, 5.612];

function addImpact(buf, i0, sr, o, rnd, n) {
  const f0 = o.f0;
  const decay = o.decay;                    // seconds to -60 dB of mode 0
  const amp = o.amp;
  const modes = o.modes || STEEL_MODES;
  const nm = o.nModes || modes.length;
  const len = Math.min(n - i0, Math.ceil(decay * 1.8 * sr));
  if (len <= 0) return;

  // contact transient: short broadband, this is most of the perceived "hit"
  const clickLen = Math.min(len, Math.ceil((o.click || 0.0016) * sr));
  const tmp = new Float32Array(len);
  for (let k = 0; k < clickLen; k++) {
    tmp[k] += (rnd() * 2 - 1) * Math.pow(1 - k / clickLen, 1.7);
  }
  const cf = new Float32Array(len), cf2 = new Float32Array(len);
  filterInto(cf, tmp, biquad('hp', o.clickHp || 900, 0.6, sr), len);
  filterInto(cf2, cf, biquad('lp', o.clickLp || 7600, 0.707, sr), len);
  for (let k = 0; k < len; k++) buf[i0 + k] += cf2[k] * amp * (o.clickAmt === undefined ? 0.85 : o.clickAmt);

  // modal ring, each mode = a resonant band excited by a noise burst
  const exLen = Math.min(len, Math.max(4, Math.ceil((o.ex || 0.0022) * sr)));
  const ex = new Float32Array(len);
  for (let k = 0; k < exLen; k++) ex[k] = (rnd() * 2 - 1) * Math.pow(1 - k / exLen, 1.2);

  const scratch = new Float32Array(len);
  for (let m = 0; m < nm; m++) {
    const f = f0 * modes[m] * (1 + (rnd() - 0.5) * 0.04);
    if (f > sr * 0.47) continue;
    const d = decay / (1 + m * (o.hfDamp === undefined ? 0.85 : o.hfDamp));  // HF dies first
    const g = amp * (o.modeAmt === undefined ? 0.5 : o.modeAmt) / Math.pow(m + 1, o.tilt === undefined ? 1.25 : o.tilt);
    // Q that yields the requested -60 dB decay: T60 = 6.91*Q/(pi*f)
    const Q = Math.max(1.2, Math.min(o.qMax || 42, d * Math.PI * f / 6.9078));
    filterInto(scratch, ex, biquad('bp', f, Q, sr), len);
    // bandpass with constant skirt has peak gain Q; normalise it out
    const k1 = g / Math.sqrt(Q);
    for (let k = 0; k < len; k++) buf[i0 + k] += scratch[k] * k1;
  }
}

/* ------------------------------------------------------------- FDN reverb

   Sixteen delay lines with mutually prime lengths, Householder feedback, one
   one-pole damper per line, preceded by four Schroeder allpass diffusers.

   The line count and the primes are not decoration. An 8-line FDN with round
   delay lengths has so few modes that they are individually audible: measured
   with the ring detector it put a 4.0 ring index on an otherwise broadband
   gunshot, i.e. the reverb itself was the bell. Sixteen prime lines plus input
   diffusion brings the same decay in at 1.3.                                 */

const FDN_PRIMES = [1051, 1289, 1543, 1787, 2053, 2311, 2557, 2801,
  3067, 3319, 3571, 3823, 4079, 4327, 4591, 4831];
const AP_PRIMES = [223, 373, 547, 761];

function fdnTail(out, src, sr, o, n) {
  const scale = (o.size || 1) * sr / 48000;
  const N = 16;

  /* One flat Float32Array for all sixteen lines, with explicit offsets, and
     wrap by comparison instead of `%`. The readable array-of-arrays version
     with modulo indexing cost 147 ms per shot in Chrome, which is audible as a
     stall on the first trigger pull; this is the same filter at 24 ms. */
  const len = new Int32Array(N), off = new Int32Array(N), pos = new Int32Array(N);
  let total = 0;
  for (let j = 0; j < N; j++) {
    len[j] = Math.max(16, Math.round(FDN_PRIMES[j] * scale));
    off[j] = total; total += len[j];
  }
  const mem = new Float32Array(total);
  const g = new Float32Array(N);
  for (let j = 0; j < N; j++) g[j] = Math.pow(10, -3 * (len[j] / sr) / (o.rt60 || 1.2));

  const lpz = new Float32Array(N), hpz = new Float32Array(N), v = new Float32Array(N);
  const damp = o.damp === undefined ? 0.42 : o.damp;
  /* Low frequencies must decay FASTER than mid, not slower. Outdoors there is
     no boundary to trap them: the long-wavelength energy simply leaves. With a
     flat-RT60 loop the 250-600 Hz modes held for the full 1.35 s and were
     individually audible — the ring detector scored the tail alone at 12.2,
     i.e. the reverb was the bell even though the source was clean at 1.5. */
  const bass = o.bass === undefined ? 0.020 : o.bass;
  const preD = Math.max(0, Math.round((o.pre || 0.006) * sr));

  // input diffusion: allpass chain, so the first milliseconds do not expose
  // the line lengths as discrete echoes
  const aN = AP_PRIMES.length;
  const aLen = new Int32Array(aN), aOff = new Int32Array(aN), aPos = new Int32Array(aN);
  let aTot = 0;
  for (let a = 0; a < aN; a++) { aLen[a] = Math.max(8, Math.round(AP_PRIMES[a] * scale)); aOff[a] = aTot; aTot += aLen[a]; }
  const aMem = new Float32Array(aTot);
  const apG = 0.62;
  const invN = 1 / Math.sqrt(N), hhK = 2 / N;

  for (let i = 0; i < n; i++) {
    let x = i >= preD ? src[i - preD] : 0;
    for (let a = 0; a < aN; a++) {
      const p = aOff[a] + aPos[a];
      const bz = aMem[p];
      const w = x + apG * bz;
      aMem[p] = w;
      if (++aPos[a] >= aLen[a]) aPos[a] = 0;
      x = bz - apG * w;
    }
    let sum = 0;
    for (let j = 0; j < N; j++) { const t = mem[off[j] + pos[j]]; v[j] = t; sum += t; }
    const hh = sum * hhK;
    for (let j = 0; j < N; j++) {
      const y = v[j] - hh;
      const l = lpz[j] + damp * (y - lpz[j]); lpz[j] = l;
      const h = hpz[j] + bass * (l - hpz[j]); hpz[j] = h;
      mem[off[j] + pos[j]] = x + (l - h * 0.86) * g[j];
      if (++pos[j] >= len[j]) pos[j] = 0;
    }
    out[i] = sum * invN;
  }
}

/* Derived blast acoustics for a cartridge fired from a given barrel.
   Everything below follows from the energy, nothing is hand-placed.          */
function blastModel(cart, barrelMm, deviceGain) {
  const E = cart.prop * E_NITRO * BLAST_FRAC;               // J of blast energy
  const L = Math.cbrt(E / P_ATM);                           // Sachs length, m
  const tc = L / C_AIR;                                     // characteristic time, s

  // positive-phase duration: scales with bore (gas column cross-section) and
  // weakly with barrel length (a longer tube has already expanded the gas)
  const kBore = 0.02451 * Math.pow(cart.bore, 0.9679);
  const kBarrel = Math.pow(barrelMm / 415, 0.22);
  const tau = tc * kBore * kBarrel;

  // peak level: blast energy, reduced by the barrel that bled pressure off
  const level = Math.pow(E / 2200, 0.34) * Math.pow(415 / barrelMm, 0.30) * (deviceGain || 1);

  /* How much low frequency the shot carries is set by how much gas the bore
     actually expels, so compute that volume instead of using one hand-tuned
     ratio for every weapon. With a single fixed weight every caliber's
     measured 1/3-octave peak landed on the same 510 Hz, which is exactly the
     "all guns sound the same" failure. A 12-gauge bore expels 12x the volume
     of a 5,45 bore and has to be 12x boomier for that reason and no other. */
  const boreArea = Math.PI * Math.pow(cart.bore / 2, 2);    // mm^2
  const gasVol = boreArea * barrelMm;                       // mm^3
  const bodyScale = Math.pow(gasVol / 18925, 0.45);         // 1.0 == AKM

  return {
    E, L, tc, tau,
    fPeak: 1 / (2 * Math.PI * tau),                         // Hz, exact for Friedlander
    level, gasVol, bodyScale,
    supersonic: cart.v0 > 1.02 * C_AIR,
    mach: cart.v0 / C_AIR,
  };
}

/* ========================================================================== */
/*  RENDERERS                                                                 */
/* ========================================================================== */

function renderShot(sr, weaponId, opt) {
  opt = opt || {};
  const W = WEAPONS[weaponId];
  if (!W) throw new Error('unknown weapon ' + weaponId);
  if (!W.cart) throw new Error(weaponId + ' fires nothing: no cartridge');
  const cart = CARTRIDGE[W.cart];
  const dev = DEVICE[W.device] || DEVICE.plain;
  const env = ENV[opt.env || 'range'];
  const B = blastModel(cart, W.barrel, dev.gain);
  const rnd = rng(opt.seed === undefined ? 1 : opt.seed);

  const dur = opt.dur || 2.0;
  const n = Math.ceil(dur * sr);
  const dry = new Float32Array(n);
  const blast = new Float32Array(n);        // gets the shock-thickness filter

  // shot-to-shot variation: real repeated fire is never identical
  const jP = 1 + (rnd() - 0.5) * 0.10;      // level
  const jT = 1 + (rnd() - 0.5) * 0.09;      // tau
  const tau = B.tau * jT / dev.sharp;
  const lvl = B.level * jP;

  /* --- 1. muzzle blast. Sample 0 is full amplitude: the shock front is a
       discontinuity, and that single-sample rise is what makes this read as a
       gunshot rather than a kick drum. ------------------------------------- */
  addFriedlander(blast, 0, sr, tau, 1.00 * lvl, n);

  /* --- 2. gas expansion and bore volume release. These are the low end.

       A Friedlander's spectrum peaks at amplitude A*tau/2, so a layer with a
       longer time constant contributes proportionally MORE spectral energy for
       the same time-domain amplitude. Scaling these by amp = r/ratio therefore
       sets each layer's spectral weight r directly, instead of accidentally
       burying the shock under a 14x-oversized low-frequency lobe.            */
  const bodies = [[5.5, 0.55], [22, 0.28], [70, 0.10]];
  for (const [ratio, r] of bodies) {
    addFriedlander(blast, Math.round(0.00030 * ratio / 5.5 * sr), sr,
      tau * ratio, (r * B.bodyScale / ratio) * lvl, n);
  }

  /* --- 3. jet roar: propellant gas still leaving the bore, turbulent. ---- */
  noiseBurst(blast, 0, sr, 0.030, 0.34 * lvl * dev.roar,
    { atk: 0.00008, shape: 2.6, hp: B.fPeak * 0.55, lp: 11000, tiltDb: -7, tiltHz: 2400 }, rnd, n);
  noiseBurst(blast, Math.round(0.0025 * sr), sr, 0.085, 0.15 * lvl * dev.roar,
    { atk: 0.0012, shape: 2.0, hp: B.fPeak * 0.10, lp: B.fPeak * 2.8,
      tiltDb: -9, tiltHz: B.fPeak * 0.6 }, rnd, n);

  /* --- 4. ballistic crack: the projectile's own bow shock. Whitham gives an
       N-wave a few hundred microseconds long, energy up at 2-8 kHz. Only
       exists if the round is supersonic. ---------------------------------- */
  if (B.supersonic && !opt.subsonic) {
    const tN = 0.00016 * Math.pow(B.mach, -0.55) * Math.pow(cart.bullet / 4e-3, 0.25);
    const i0 = Math.round(0.0009 * sr);
    const len = Math.ceil(tN * 2 * sr);
    const a = 0.30 * lvl;
    for (let k = 0; k < len && i0 + k < n; k++) {
      // N-wave: up-shock, linear ramp through zero, down-shock
      blast[i0 + k] += a * (1 - 2 * (k / len));
    }
  }

  /* --- shock thickness + atmospheric absorption.

       A real blast front is not a mathematical discontinuity: it is a viscous
       shock 15-30 us thick, and the path to the ear absorbs the top octave.
       Without this the spectrum stays flat-ish to Nyquist, the centroid lands
       near 5 kHz instead of the 1-2 kHz that measured gunshots show, and it
       reads as a digital click rather than a blast.                          */
  {
    const tRise = opt.rise || 15e-6;
    const fShock = 1 / (2 * Math.PI * tRise);
    const a = new Float32Array(n), b = new Float32Array(n);
    filterInto(a, blast, biquad('lp', fShock, 0.62, sr), n);
    filterInto(b, a, biquad('lp', fShock * 1.6, 0.70, sr), n);
    filterInto(a, b, biquad('hs', 3200, 0.707, sr, -7.5), n);   // air absorption
    for (let i = 0; i < n; i++) dry[i] += a[i];
  }

  /* --- 5. ground reflection. A shooter stands ~1.5 m over the ground, so a
       delayed inverted copy arrives a few ms later. The comb notch it puts in
       the spectrum is a large part of "outdoors". ------------------------- */
  if (!opt.noGround) {
    const gi = Math.round(env.ground * sr);
    const gl = new Float32Array(n);
    filterInto(gl, dry, biquad('lp', Math.max(2600, B.fPeak * 3.4), 0.707, sr), n);
    for (let i = n - 1; i >= gi; i--) dry[i] += gl[i - gi] * env.groundG;
  }

  /* --- 6. mechanics, at the real cycle times for this action -------------- */
  const C = W.cycle;
  if (C && !opt.noAction) {
    const R = W.recv, Bo = W.bolt;
    // unlock / cam track — small, dry
    addImpact(dry, Math.round(C.unlock * sr), sr,
      { f0: Bo.f0 * 1.8, decay: 0.010, amp: 0.035 * lvl, click: 0.0009, hfDamp: 1.3, tilt: 1.5 }, rnd, n);
    // carrier hits the rear of the receiver — the loudest mechanical event
    addImpact(dry, Math.round(C.rearImpact * sr), sr,
      { f0: R.f0, decay: R.decay, amp: 0.135 * lvl, click: 0.0020,
        hfDamp: R.hfDamp, tilt: R.tilt, clickHp: 700 }, rnd, n);
    // AR-pattern buffer spring: broadband metallic scrape, not a tone
    if (W.buffer) {
      noiseBurst(dry, Math.round((C.rearImpact + 0.001) * sr), sr, 0.055, 0.055 * lvl,
        { atk: 0.0006, shape: 1.6, bp: 2300, bpq: 2.4 }, rnd, n);
      noiseBurst(dry, Math.round((C.returnImpact - 0.014) * sr), sr, 0.040, 0.040 * lvl,
        { atk: 0.0008, shape: 1.4, bp: 1750, bpq: 2.0 }, rnd, n);
    }
    // carrier returns, strips a round, hits the barrel extension
    addImpact(dry, Math.round(C.returnImpact * sr), sr,
      { f0: Bo.f0 * 1.35, decay: Bo.decay * 0.8, amp: 0.100 * lvl, click: 0.0018,
        hfDamp: 1.0, tilt: 1.3 }, rnd, n);
    // rotating bolt cams into lockup — small, high, very short
    addImpact(dry, Math.round(C.lockup * sr), sr,
      { f0: Bo.f0 * 3.1, decay: 0.008, amp: 0.048 * lvl, click: 0.0007, hfDamp: 1.4, tilt: 1.6 }, rnd, n);
  }
  if (W.action === 'shortRecoil' && !opt.noAction) {
    // slide reciprocating in polymer rails: dry sliding noise, no ring
    noiseBurst(dry, Math.round(0.004 * sr), sr, 0.014, 0.030 * lvl,
      { atk: 0.0004, shape: 1.3, bp: 3400, bpq: 1.6 }, rnd, n);
  }

  /* --- 7. brass. The case is thrown clear at ~5 m/s, rings briefly in flight,
       then hits the ground once or twice. Kept short and quiet on purpose: a
       long bright case ring is the single most bell-like thing in a gunshot,
       and at the shooter's own ear it is 35-40 dB under the blast. ---------- */
  if (!opt.noBrass && W.brass) {
    const br = W.brass;
    const t0 = (C ? C.rearImpact + 0.030 : 0.075) + rnd() * 0.02;
    const matAmp = br.mass === 'plastic' ? 0.016 : br.mass === 'steel' ? 0.022 : 0.028;
    addImpact(dry, Math.round(t0 * sr), sr,
      { f0: br.f0, decay: br.decay, amp: matAmp * lvl, click: 0.0005, ex: 0.0016,
        hfDamp: 0.9, tilt: 1.35, modeAmt: 0.55, clickHp: 2200, qMax: 26 }, rnd, n);
    // floor bounces
    const tf = 0.34 + rnd() * 0.28;
    for (let b = 0; b < 3; b++) {
      const tb = tf + b * (0.085 + rnd() * 0.06);
      if (tb > dur - 0.2) break;
      addImpact(dry, Math.round(tb * sr), sr,
        { f0: br.f0 * (1 + b * 0.06), decay: br.decay * (0.5 - b * 0.12),
          amp: matAmp * 0.5 * Math.pow(0.55, b), click: 0.0004, ex: 0.0012,
          hfDamp: 1.0, tilt: 1.4, modeAmt: 0.5, clickHp: 2600, qMax: 24 }, rnd, n);
    }
  }

  /* --- 8. environment: discrete slap-back off distant hard surfaces, then a
       damped diffuse tail. ------------------------------------------------ */
  /* Dry is the primary product.

     The room used to be baked into every variant of every cue: 4 slap taps
     plus a 16-line FDN over the full 1.5 s buffer, which measured 80 ms of the
     101 ms it took to render one shot, and stalled the first trigger pull for
     a quarter of a second. It is now rendered ONCE as an impulse response
     (renderRoomIR) and applied by a native ConvolverNode on the audio thread.

     This is also why the gate measures the dry source and the room IR
     separately: that decomposition is not a testing convenience, it is exactly
     how the signal path is built. */
  if (opt.dry !== false) {
    const L0 = new Float32Array(n); L0.set(dry);
    bandLimit(L0, sr, n); softClip(L0, n);
    return { sr, n, channels: [L0, L0], model: B, weapon: W, cartridge: cart, tau, device: dev };
  }
  const wetIn = new Float32Array(n), wetTmp = new Float32Array(n);
  filterInto(wetTmp, dry, biquad('lp', 6500, 0.707, sr), n);
  filterInto(wetIn, wetTmp, biquad('hp', 190, 0.707, sr), n);
  for (const [dt, g] of env.slap) {
    const di = Math.round(dt * (1 + (rnd() - 0.5) * 0.06) * sr);
    const sl = new Float32Array(n);
    filterInto(sl, wetIn, biquad('lp', 2600 - dt * 1400, 0.707, sr), n);
    for (let i = n - 1; i >= di; i--) dry[i] += sl[i - di] * g;
  }
  const tail = new Float32Array(n);
  fdnTail(tail, wetIn, sr, { rt60: env.rt60, size: env.size, damp: env.damp, pre: env.pre }, n);

  /* --- mix + stereo. Muzzle blast is in front of the shooter, ejection and
       mechanics are on the strong side. ----------------------------------- */
  const L = new Float32Array(n), Rc = new Float32Array(n);
  const wet = env.wet;
  for (let i = 0; i < n; i++) {
    const d = dry[i], t = tail[i] * wet;
    L[i] = d + t;
    Rc[i] = d + t;
  }
  // tiny inter-channel decorrelation of the tail only — keeps the shock mono
  {
    const dl = Math.round(0.0013 * sr);
    for (let i = n - 1; i >= dl; i--) Rc[i] += tail[i - dl] * wet * 0.5;
    for (let i = 0; i < n; i++) Rc[i] -= tail[i] * wet * 0.5;
  }

  /* --- output band-limit + limiter. Everything audible has been through air
       and a transducer; without this the top octave stays flat and the shot
       reads as a digital click instead of a blast. ------------------------- */
  for (const b of [L, Rc]) {
    const t1 = new Float32Array(n);
    filterInto(t1, b, biquad('lp', 14500, 0.707, sr), n);
    filterInto(b, t1, biquad('hp', 26, 0.707, sr), n);      // no inaudible DC lobe
  }
  softClip(L, n); softClip(Rc, n);

  return { sr, n, channels: [L, Rc], model: B, weapon: W, cartridge: cart, tau, device: dev };
}

/* Everything audible has been through air and a transducer. Without this the
   top octave stays flat and the shot reads as a digital click, not a blast. */
function bandLimit(b, sr, n) {
  const t1 = new Float32Array(n);
  filterInto(t1, b, biquad('lp', Math.min(14500, sr * 0.45), 0.707, sr), n);
  filterInto(b, t1, biquad('hp', 26, 0.707, sr), n);
}

/* ---------------------------------------------------------------- room IR

   Discrete slap-back off distant hard surfaces, then the damped diffuse tail.
   Rendered once per environment and convolved at runtime.                    */
function renderRoomIR(sr, envName, opt) {
  opt = opt || {};
  const env = ENV[envName] || ENV.range;
  const dur = opt.dur || Math.min(2.4, env.rt60 * 1.5 + 0.4);
  const n = Math.ceil(dur * sr);
  const rnd = rng(opt.seed === undefined ? 17 : opt.seed);

  const src = new Float32Array(n);
  src[0] = 1;
  const wetIn = new Float32Array(n), tmp = new Float32Array(n);
  filterInto(tmp, src, biquad('lp', 6500, 0.707, sr), n);
  filterInto(wetIn, tmp, biquad('hp', 190, 0.707, sr), n);

  const acc = new Float32Array(n);
  for (const [dt, g] of env.slap) {
    const di = Math.round(dt * (1 + (rnd() - 0.5) * 0.06) * sr);
    const sl = new Float32Array(n);
    filterInto(sl, wetIn, biquad('lp', Math.max(700, 2600 - dt * 1400), 0.707, sr), n);
    for (let i = n - 1; i >= di; i--) acc[i] += sl[i - di] * g;
  }
  const tail = new Float32Array(n);
  fdnTail(tail, wetIn, sr, { rt60: env.rt60, size: env.size, damp: env.damp, pre: env.pre }, n);
  for (let i = 0; i < n; i++) acc[i] += tail[i];

     milliseconds stay coherent — the shock front must not smear across the
     stereo image, a gunshot is a point source. */

  const dl = Math.round(0.0013 * sr);
  for (let i = 0; i < n; i++) { L[i] = acc[i]; R[i] = acc[i] * 0.5; }
  for (let i = n - 1; i >= dl; i--) R[i] += acc[i - dl] * 0.5;

  // normalise so `wet` in ENV means the same thing at every sample rate
  let e = 0; for (let i = 0; i < n; i++) e += L[i] * L[i];

  for (let i = 0; i < n; i++) { L[i] *= k; R[i] *= k; }
  return { sr, n, channels: [L, R], wet: env.wet };
}

  for (let i = 0; i < n; i++) {

  const rnd = rng(opt.seed === undefined ? 7 : opt.seed);
  const R = W.recv, Bo = W.bolt;
  const dur = opt.dur || 1.1;

  const dry = new Float32Array(n);
  const A = opt.gain === undefined ? 1 : opt.gain;

    hit(0.0016, { f0: Bo.f0 * 4.2, decay: 0.007, amp: 0.20 * A, click: 0.0006, hfDamp: 1.5, tilt: 1.7 });
  } else if (kind === 'trigger') {
    nz(0, 0.008, 0.13 * A, { atk: 0.0002, shape: 2.4, bp: 3600, bpq: 1.4 });
    hit(0.0022, { f0: R.f0 * 2.4, decay: 0.006, amp: 0.10 * A, click: 0.0005, hfDamp: 1.6, tilt: 1.8 });
  } else if (kind === 'selector') {
    // AK selector is a big stamped lever over detents: two hard clacks
    hit(0, { f0: R.f0 * 0.95, decay: 0.020, amp: 0.26 * A, click: 0.0013, hfDamp: 1.0, tilt: 1.2 });
    nz(0.0004, 0.010, 0.10 * A, { atk: 0.0002, shape: 2.0, bp: 2200, bpq: 1.2 });
  } else if (kind === 'magOut') {
    nz(0, 0.030, 0.16 * A, { atk: 0.0008, shape: 1.5, bp: 1500, bpq: 1.1 });
    hit(0.0018, { f0: R.f0 * 0.8, decay: 0.026, amp: 0.20 * A, click: 0.0016, hfDamp: 1.0, tilt: 1.2 });
    // magazine leaves the well and drops
    const mm = W.magMat;
    hit(0.055, mm === 'polymer'
      ? { f0: 420, decay: 0.022, amp: 0.13 * A, click: 0.0014, ex: 0.0016,
          hfDamp: 1.6, tilt: 1.8, modeAmt: 0.24, qMax: 16 }
      : mm === 'bakelite'
        ? { f0: 610, decay: 0.026, amp: 0.15 * A, click: 0.0013, ex: 0.0016,
            hfDamp: 1.45, tilt: 1.6, modeAmt: 0.30, qMax: 18 }
        : { f0: 780, decay: 0.034, amp: 0.17 * A, click: 0.0011, ex: 0.0018,
            hfDamp: 1.15, tilt: 1.4, modeAmt: 0.40, qMax: 22 });

    hit(0.042, { f0: R.f0 * 0.85, decay: 0.034, amp: 0.34 * A, click: 0.0024, hfDamp: 0.95, tilt: 1.15, clickHp: 600 });
    hit(0.047, { f0: R.f0 * 2.2, decay: 0.010, amp: 0.14 * A, click: 0.0008, hfDamp: 1.4, tilt: 1.6 });

  } else if (kind === 'boltRelease') {

    nz(0.002, 0.030, 0.13 * A, { atk: 0.0008, shape: 1.3, bp: 2100, bpq: 1.7 });

    hit(0.030, { f0: 520, decay: 0.016, amp: 0.10 * A, click: 0.0012, hfDamp: 1.4, tilt: 1.5 });
    hit(0.100, { f0: R.f0 * 1.1, decay: 0.030, amp: 0.36 * A, click: 0.0026, hfDamp: 0.9, tilt: 1.1, clickHp: 550 });

  } else if (kind === 'pumpForward') {
    nz(0, 0.100, 0.19 * A, { atk: 0.005, shape: 1.1, bp: 1050, bpq: 0.85 });
    hit(0.094, { f0: R.f0 * 0.9, decay: 0.042, amp: 0.46 * A, click: 0.0030, hfDamp: 0.8, tilt: 1.05, clickHp: 480 });
    hit(0.099, { f0: 1450, decay: 0.011, amp: 0.16 * A, click: 0.0008, hfDamp: 1.5, tilt: 1.7 });

  } else if (kind === 'safety') {
    hit(0, { f0: R.f0 * 2.0, decay: 0.007, amp: 0.16 * A, click: 0.0006, hfDamp: 1.5, tilt: 1.7 });

    hit(0, { f0: 2600, decay: 0.005, amp: 0.10 * A, click: 0.0004, hfDamp: 1.7, tilt: 1.9 });
  } else if (kind === 'stockFold') {

      { atk: 0.030, shape: 2.0, bp: 620, bpq: 0.55, tiltDb: -6, tiltHz: 900 }, rnd, n);

    bandLimit(D, sr, n); softClip(D, n);
    return { sr, n, channels: [D, D] };
  }

  const wetIn = new Float32Array(n);
  filterInto(wetIn, dry, biquad('lp', 5200, 0.707, sr), n);
  const tail = new Float32Array(n);
  fdnTail(tail, wetIn, sr, { rt60: env.rt60 * 0.7, size: env.size, damp: env.damp + 0.1, pre: env.pre }, n);

  CARTRIDGE, WEAPONS, DEVICE, ENV,

<script>
/* ============================================================================
   ORDNANCE runtime — browser side.

   Owns an AudioContext, pre-renders every cue with the offline synthesis in
   ordnance-audio.js, and plays them back as plain AudioBufferSourceNodes.

   Why pre-render instead of building a node graph per shot, which is what the
   files did before:

     - the shock front can be a single-sample discontinuity. A WebAudio
       `exponentialRampToValueAtTime` over 1.2 ms is a 396 us rise; measured,
       that is the difference between a gunshot and a drum.
     - no oscillator ever runs, so no cue can be tonal by construction.
     - firing cost drops to one buffer source. A 1200 rpm Glock spawning 30
       filter/oscillator graphs a second is what makes the old approach crackle.

   Variants exist so sustained fire does not machine-gun the identical sample.
   Rendering is progressive: the first shot variant is ready before the first
   trigger pull, the rest arrive during idle time.
   ========================================================================== */

(function (root) {
  'use strict';
  const O = root.ORDNANCE;

  function Ordnance(weaponId, opt) {
    opt = opt || {};
    this.id = weaponId;
    this.env = opt.env || 'range';
    this.variants = opt.variants || 4;
    this.mechList = opt.mech || [];
    this.ctx = null;
    this.master = null;
    this.buffers = { shot: [], mech: {} };
    this.ready = false;
    this.muted = false;
    this.gain = opt.gain === undefined ? 0.42 : opt.gain;
    this._queue = [];
    this._n = 0;
    this._last = 0;
  }

  Ordnance.prototype.init = function () {
    if (this.ctx) return this.ctx;
    const AC = root.AudioContext || root.webkitAudioContext;
    if (!AC) return null;
    const ctx = this.ctx = new AC();
    const m = this.master = ctx.createGain();
    m.gain.value = this.gain;
    /* One gentle limiter on the bus. The synthesis is already peak-controlled;
       this only catches several shots overlapping during automatic fire. */
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -9; comp.knee.value = 10; comp.ratio.value = 8;
    comp.attack.value = 0.002; comp.release.value = 0.16;
    m.connect(comp); comp.connect(ctx.destination);

    /* Room. The cues are rendered dry; the space is one shared impulse
       response through a native ConvolverNode. Baking the room into every
       variant cost 80 of the 101 ms it took to render a single shot. */
    this.dryBus = ctx.createGain(); this.dryBus.gain.value = 1;
    this.dryBus.connect(m);
    this.wetBus = ctx.createGain(); this.wetBus.gain.value = 0;   // until the IR lands
    this.conv = ctx.createConvolver();

       created the context, and a missing first shot is worse than 20 ms.
       A blade has no cartridge, so it has no blast to render. */
    this.armed = O.firesAmmunition(this.id);
    if (this.armed) {
      this._render('shot', 0);

    }
    for (const k of this.mechList) { this._queue.push(['mech', k, 0]); this._queue.push(['mech', k, 1]); }
    this._queue.push(['room']);          // last: dry-only for the first moments

  };

      const ir = O.renderRoomIR(sr, this.env);

      this.wetBus.gain.value = ir.wet;
      return;
    }
    if (kind === 'shot') {
      this.buffers.shot[a] = this._toBuffer(
        O.renderShot(sr, this.id, { seed: 1000 + a * 37, env: this.env, dur: 1.5 }));
    } else {
      (this.buffers.mech[a] || (this.buffers.mech[a] = []))[b] = this._toBuffer(
        O.renderMech(sr, this.id, a, { seed: 500 + b * 91, env: this.env, dur: 0.8 }));
    }
  };

  Ordnance.prototype._drain = function () {
    if (!this._queue.length) { this.ready = true; return; }
    /* requestIdleCallback alone is not enough: a page already rendering flat
       out never becomes idle, and the remaining cues never appear. Whichever
       of the two fires first wins, and the other is cancelled. */
    const self = this;
    let done = false;
    const step = function () {
      if (done) return;
      done = true;
      const t0 = (root.performance || Date).now();
      do {
        const j = self._queue.shift();
        try { self._render(j[0], j[1], j[2]); } catch (e) { /* a missing cue must not kill the page */ }
      } while (self._queue.length && (root.performance || Date).now() - t0 < 12);
      self._drain();
    };
    if (root.requestIdleCallback) root.requestIdleCallback(step, { timeout: 120 });
    setTimeout(step, 150);
  };

  Ordnance.prototype.shot = function (o) {
    if (this.muted || !this.init() || !this.armed) return;
    o = o || {};

    if (!bs.length) return;
    // never the same variant twice in a row
    let i = (Math.random() * bs.length) | 0;
    if (bs.length > 1 && i === this._last) i = (i + 1) % bs.length;
    this._last = i;
    const s = this.ctx.createBufferSource();
    s.buffer = bs[i];
    s.playbackRate.value = 1 + (Math.random() - 0.5) * 0.035;
    const g = this.ctx.createGain();
    g.gain.value = (o.gain === undefined ? 1 : o.gain) * (0.94 + Math.random() * 0.12);
    s.connect(g); g.connect(this.dryBus); g.connect(this.wetBus);
    s.start(this.ctx.currentTime + (o.delay || 0));
  };

  Ordnance.prototype.mech = function (kind, o) {
    if (this.muted || !this.init()) return;
    o = o || {};
    const v = this.buffers.mech[kind];
    if (!v || !v.length) return;
    const b = v[(Math.random() * v.length) | 0] || v[0];
    const s = this.ctx.createBufferSource();
    s.buffer = b;
    s.playbackRate.value = 1 + (Math.random() - 0.5) * 0.06;
    const g = this.ctx.createGain();
    g.gain.value = (o.gain === undefined ? 1 : o.gain) * (0.92 + Math.random() * 0.16);
    s.connect(g); g.connect(this.dryBus);
    // mechanics are close to the ear relative to the blast: less room on them
    const w = this.ctx.createGain(); w.gain.value = 0.45;
    g.connect(w); w.connect(this.wetBus);
    s.start(this.ctx.currentTime + (o.delay || 0));
  };

  Ordnance.prototype.setMuted = function (m) {
    this.muted = !!m;
    if (this.master) this.master.gain.value = m ? 0 : this.gain;
  };

  Ordnance.prototype.resume = function () {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  };

  root.Ordnance = Ordnance;
})(typeof self !== 'undefined' ? self : this);

    gl.uniform3fv(p.u.uEmis, mat.emis); gl.uniform1f(p.u.uAOStr, mat.aoStr);
  },
  drawBatches: function (p, opts) {
    opts = opts || {};
    var nm = new Float32Array(9);
    for (var i = 0; i < this.batches.length; i++) {
      var b = this.batches[i];
      if (!b.visible) continue;
      if (opts.shadowOnly && !b.shadow) continue;
      if (opts.skipTag && b.tag === opts.skipTag) continue;
      gl.uniformMatrix4fv(p.u.uModel, false, b.node.world);
      if (p.u.uNM) { Mnormal(b.node.world, nm); gl.uniformMatrix3fv(p.u.uNM, false, nm); }
      if (!opts.noMat) this.setMat(p, b.mat);
      gl.bindVertexArray(b.vao);
      gl.drawElements(gl.TRIANGLES, b.count, b.type, 0);
    }
  },
  fs: function (p) { gl.useProgram(p); gl.bindVertexArray(this.quadVao); gl.drawArrays(gl.TRIANGLES, 0, 3); }
};

/* ---------- локальные хелперы экструзии ---------- */
// профиль в плоскости (z,y), толщина по X: от xRight до xRight-width
function exZY(shape, holes, width, xRight, opt) {
  return xf(prism(shape, holes, width, opt), Mmul(Mtrans(xRight, 0, 0), MrotY(-PI / 2)));
}
function exZYc(shape, holes, width, xCenter, opt) { return exZY(shape, holes, width, xCenter + width / 2, opt); }
// профиль в плоскости (x,y), длина по Z от zFront назад
function exXY(shape, holes, len, zFront, opt) {
  return xf(prism(shape, holes, len, opt), Mtrans(0, 0, zFront));
}
// профиль в плоскости (x,z), высота по Y от yBottom вверх
function exXZ(shape, holes, h, yBottom, opt) {
  return xf(prism(shape, holes, h, opt), Mmul(Mtrans(0, yBottom, 0), MrotX(PI / 2)));
}
function cylX(r, len, xLeft, y, z, seg) { return xf(cyl(r, len, seg || 24), Mmul(Mtrans(xLeft, y, z), MrotY(PI / 2))); }
function cylY(r, len, x, yBot, z, seg) { return xf(cyl(r, len, seg || 24), Mmul(Mtrans(x, yBot, z), MrotX(-PI / 2))); }
function cylZ(r, len, x, y, zFront, seg) { return xf(cyl(r, len, seg || 24), Mtrans(x, y, zFront)); }
function screwX(r, h, x, y, z, flip) {
  var m = new Mesh();
  m.merge(revolveZ([[0, 0], [0, r, true], [h * 0.62, r, true], [h, r * 0.86, true], [h, 0]], 20));
  m.merge(xf(boxRound(mm(0.9), r * 1.9, h * 0.30, mm(0.3), mm(0.15)), Mtrans(0, 0, h - mm(0.2))));
  return xf(m, Mmul(Mtrans(x, y, z), MrotY(flip ? -PI / 2 : PI / 2)));
}
function pinX(r, len, y, z) {
  var m = new Mesh();
  m.merge(revolveZ([[0, 0], [0, r, true], [len, r, true], [len, 0]], 20));
  m.merge(xf(revolveZ([[0, 0], [0, r * 1.35, true], [mm(0.8), r * 1.35, true], [mm(1.3), r * 1.05, true], [mm(1.3), 0]], 20), Mtrans(0, 0, -mm(1.3))));
  m.merge(xf(revolveZ([[0, 0], [0, r * 1.35, true], [mm(0.8), r * 1.35, true], [mm(1.3), r * 1.05, true], [mm(1.3), 0]], 20), Mmul(Mtrans(0, 0, len + mm(1.3)), MrotY(PI))));
  return xf(m, Mmul(Mtrans(-len / 2, y, z), MrotY(PI / 2)));
}
// кольцевая насечка вокруг оси Z
function knurlZ(R, zFront, len, n, depth, w) {
  var m = new Mesh();
  for (var i = 0; i < n; i++) {
    var a = i / n * TAU;
    var rib = boxRound(w, depth * 2, len, w * 0.35, w * 0.2);
    m.merge(rib, Mmuls(MrotZ(a), Mtrans(0, R, 0), MrotX(0), Mtrans(0, 0, -len / 2 - (zFront - len / 2) + (zFront - len / 2))));
    var mm2 = Mmuls(MrotZ(a), Mtrans(0, R, zFront + len / 2));
    m.merge(rib, mm2);
  }
  return m;
}
function ribsZ(R, zFront, len, n, h, w) {
  var m = new Mesh();
  for (var i = 0; i < n; i++) {
    var a = i / n * TAU;
    m.merge(boxRound(w, h, len, w * 0.3, w * 0.18), Mmuls(MrotZ(a), Mtrans(0, R, zFront + len / 2)));
  }
  return m;
}
// шашечная насечка (ромбы) на плоской панели в плоскости XY, выступ по +Z
function checkerPanel(w, h, cell, depth, rot) {
  var m = new Mesh(), nx = Math.max(1, Math.round(w / cell)), ny = Math.max(1, Math.round(h / cell));
  var s = cell * 0.5;
  for (var i = 0; i < nx; i++) for (var j = 0; j < ny; j++) {
    var cx = -w / 2 + cell * (i + 0.5), cy = -h / 2 + cell * (j + 0.5);
    if (Math.hypot(cx / (w / 2), cy / (h / 2)) > 1.02) continue;
    var p = new Mesh();
    var a = p.v(-s, -s, 0, 0, 0, -1), b = p.v(s, -s, 0, 0, 0, -1), c = p.v(s, s, 0, 0, 0, -1), d = p.v(-s, s, 0, 0, 0, -1);
    var t = p.v(0, 0, depth, 0, 0, 1, 0, 0, 1);
    p.tri(a, t, b); p.tri(b, t, c); p.tri(c, t, d); p.tri(d, t, a);
    p.tri(a, b, c); p.tri(a, c, d);
    m.merge(p, Mmul(Mtrans(cx, cy, 0), MrotZ(PI / 4)));
  }
  return rot ? xf(m, MrotZ(rot)) : m;
}

/* ========================= МОДЕЛЬ СВД ========================= */
/* =========================================================================
   Геометрия построена по реальным пропорциям 7,62-мм снайперской винтовки
   Драгунова (СВД, инд. 6В1).
   Оси: X — вправо, Y — вверх, Z — назад. Ось канала ствола: x=0, y=0.

     общая длина ................. 1225 мм  (−906 … +330)
     длина ствола ................ 620  мм  (зеркало затвора −232 … дуло −852)
     прицельная линия ............ 587  мм  (мушка −820 … целик −233)
     линия механического прицела . +41 мм над каналом ствола
     оптическая ось ПСО-1 ........ +72 мм над каналом ствола
     ширина ствольной коробки .... 32 мм

   Всё, что должно быть симметричным, строится ОДИН раз для правой стороны
   и зеркалится mirX(): так исключены расхождения левой и правой половин.
   ========================================================================= */
var GEO = {
  Z_RB: mm(62), Z_RF: mm(-232),          // ствольная коробка: зад / перед
  RY_B: mm(-34), RY_T: mm(22),           // низ / верх коробки
  Z_MUZ: mm(-852), Z_FH: mm(-906),       // дульный срез / срез пламегасителя
  Z_FS: mm(-822), Z_RS: mm(-233),        // ось мушки / прорезь целика
  Y_IRON: mm(41), Y_OPT: mm(72), Y_GAS: mm(23),
  HG_B: mm(-298), HG_F: mm(-498),        // ствольные накладки
  MAG_Z: mm(-139),                       // ось шахты магазина
  RAIL_Z0: mm(-158), RAIL_Z1: mm(-44)    // боковая планка под кронштейн
};

/* ---------- зеркалирование меша по X (с разворотом обхода треугольников) ---------- */
function mirX(src) {
  var o = new Mesh(), i;
  for (i = 0; i < src.p.length; i += 3) {
    o.p.push(-src.p[i], src.p[i + 1], src.p[i + 2]);
    o.n.push(-src.n[i], src.n[i + 1], src.n[i + 2]);
  }
  for (i = 0; i < src.t.length; i++) o.t.push(src.t[i]);
  for (i = 0; i < src.e.length; i++) o.e.push(src.e[i]);
  for (i = 0; i < src.i.length; i += 3) o.i.push(src.i[i], src.i[i + 2], src.i[i + 1]);
  return o;
}
function both(m) { var o = new Mesh(); o.merge(m); o.merge(mirX(m)); return o; }
// плита в плоскости ZY, правая сторона: x ∈ [xIn, xIn+t]
function slabR(shape, holes, t, xIn, opt) { return exZY(shape, holes, t, xIn + t, opt); }
// симметричная пара одинаковых плит
function slabPair(shape, holes, t, xIn, opt) { return both(slabR(shape, holes, t, xIn, opt)); }

/* =========================================================================

  add(cylX(mm(7.5), mm(6.5), mm(13), mm(6), mm(-508), 20), MAT.blueS, body);
  add(xf(knurlZ(mm(7.0), 0, mm(6), 14, mm(0.7), mm(1.1)), Mmuls(Mtrans(mm(16), mm(6), mm(-508)), MrotY(PI / 2))), MAT.blueS, body);
  // антабка для ремня
  add(xf(torusZ(mm(9), mm(1.9), 18, 10), Mmuls(Mtrans(0, mm(-26), mm(-520)), MrotX(PI / 2))), MAT.blueS, body);
  add(exZYc(roundRect(mm(12), mm(12), mm(3), mm(-520), mm(-18)), [], mm(8), 0, { bevel: mm(1) }), MAT.blueS, body);

  /* газовая трубка (закрыта накладками, видна только у газовой камеры) */
  add(xf(tubeZ(mm(8.4), mm(6.2), mm(216), 22), Mtrans(0, GEO.Y_GAS, mm(-512))), MAT.blueS, body);

  /* ---------------- 7. КОЛОДКА И СЕКТОРНЫЙ ПРИЦЕЛ ---------------- */
  var rsB = (function () {
    var p = new Path();
    p.move(mm(-302), mm(-14));
    p.line(mm(-236), mm(-14));
    p.line(mm(-236), mm(20));
    p.quad(mm(-236), mm(28), mm(-248), mm(28));
    p.line(mm(-292), mm(28));
    p.quad(mm(-302), mm(28), mm(-302), mm(18));
    return p.done();
  })();
  add(exZYc(rsB, [], mm(30), 0, { bevel: mm(1.8) }), MAT.blue, body);
  add(exZYc(roundRect(mm(72), mm(12), mm(3), mm(-268), mm(-16)), [], mm(34), 0, { bevel: mm(1.2) }), MAT.blue, body);

  // прицельная планка (гривка): пятка спереди, прорезь целика сзади
  var leaf = (function () {
    var p = new Path();
    p.move(mm(-300), mm(27));
    p.line(mm(-228), mm(27));
    p.line(mm(-228), mm(45));
    p.line(mm(-238), mm(45));
    p.line(mm(-238), mm(33));
    p.line(mm(-296), mm(31));
    p.quad(mm(-300), mm(31), mm(-300), mm(29));
    return p.done();
  })();
  add(exZYc(leaf, [], mm(16), 0, { bevel: mm(0.8) }), MAT.blueS, body);
  // прорезь целика — вырезаем «щёки» по сторонам от неё
  add(both(xf(boxRound(mm(5.4), mm(13), mm(11), mm(1.0), mm(0.5)), Mtrans(mm(5.3), mm(38.5), mm(-233)))), MAT.blueS, body);
  // белые риски по краям прорези
  add(both(xf(boxRound(mm(1.2), mm(5), mm(1.2), mm(0.3), mm(0.15)), Mtrans(mm(4.2), mm(42), mm(-228)))), MAT.bright, body);

  // хомутик (двигается по планке в зависимости от установки прицела)
  var clamp = new Mesh();
  clamp.merge(exZYc(roundRect(mm(14), mm(22), mm(3), 0, mm(30)), [], mm(24), 0, { bevel: mm(1.2) }));
  clamp.merge(both(xf(boxRound(mm(3.2), mm(8), mm(15), mm(1.0), mm(0.4)), Mtrans(mm(10.4), mm(24), 0))));
  clamp.merge(xf(knurlZ(mm(11), 0, mm(12), 12, mm(0.6), mm(1.0)), Mmuls(Mtrans(0, mm(30), 0), MrotY(PI / 2))));
  add(clamp, MAT.bright, rsl);

  /* ---------------- 8. СТВОЛЬНЫЕ НАКЛАДКИ (ЦЕВЬЁ) ---------------- */
  // силуэт накладки в плоскости ZY
  var hg = (function () {
    var p = new Path();
    p.move(GEO.HG_B, mm(-25));
    p.line(mm(-466), mm(-23));
    p.quad(GEO.HG_F, mm(-21), GEO.HG_F, mm(-6));
    p.line(GEO.HG_F, mm(18));
    p.quad(GEO.HG_F, mm(31), mm(-476), mm(31.6));
    p.line(GEO.HG_B, mm(33));
    return p.done();
  })();
  // Два больших овальных окна на каждой половине — как на реальной СВД,
  // а не три узких прорези: длинные, с большим радиусом торцов.
  var vents = [];
  for (var vz = 0; vz < 2; vz++) vents.push(roundRect(mm(64), mm(19), mm(9.5), mm(-342) - vz * mm(76), mm(9)));
  // внутренний металлический вкладыш (виден в окнах)
  var hgLin = (function () {
    var p = new Path();
    p.move(GEO.HG_B, mm(-22));
    p.line(mm(-468), mm(-20));
    p.quad(mm(-495), mm(-18), mm(-495), mm(-5));
    p.line(mm(-495), mm(17));
    p.quad(mm(-495), mm(28), mm(-476), mm(28.6));
    p.line(GEO.HG_B, mm(30));
    return p.done();
  })();
  add(exZYc(hgLin, [], mm(17), 0, { bevel: mm(1.2) }), MAT.dark, body);
  add(slabPair(hg, vents, mm(19), mm(7.5), { bevel: mm(6), steps: 4 }), MAT.wood, body);
  // передняя и задняя обоймицы
  add(exXY(roundRect(mm(56), mm(64), mm(14), 0, mm(4)), [roundRect(mm(50), mm(58), mm(11), 0, mm(4))],
    mm(11), mm(-303), { bevel: mm(1.2) }), MAT.blueS, body);
  add(exXY(roundRect(mm(54), mm(60), mm(13), 0, mm(4)), [roundRect(mm(48), mm(54), mm(10), 0, mm(4))],
    mm(10), mm(-500), { bevel: mm(1.2) }), MAT.blueS, body);
}

/* =========================================================================
   ЧАСТЬ 2: приклад, щека, рукоятка, УСМ, магазин, затворная рама, ПСО-1
   ========================================================================= */
function buildSVD2(add, N) {
  var body = N.body, bolt = N.bolt, trig = N.trig, mag = N.mag;
  var safety = N.safety, scope = N.scope;

  /* ---------------- 9. ДЕРЕВЯННЫЙ РАМОЧНЫЙ ПРИКЛАД СВД ----------------
     Одна цельная деталь: шейка — рукоятка — нижняя ветвь — затылок,
     внутри — большое окно-«скелет» под большой палец. Гребень выбран из
     массива и плавно поднимается к пятке — никаких накладок и хомутов сверху:
     на штатной СВД щека ложится прямо на дерево гребня. */
  var st = (function () {
    var p = new Path();
    p.move(mm(44), mm(16));
    p.quad(mm(64), mm(27), mm(96), mm(30));            // подъём на гребень
    p.quad(mm(150), mm(33), mm(212), mm(35));          // гребень
    p.quad(mm(268), mm(37), mm(296), mm(34));
    p.quad(mm(314), mm(32), mm(317), mm(21));          // пятка
    p.line(mm(319), mm(-16));
    p.quad(mm(318), mm(-28), mm(305), mm(-30));        // носок
    p.line(mm(236), mm(-31));
    p.quad(mm(178), mm(-32), mm(146), mm(-30));        // нижняя ветвь рамы
    p.quad(mm(124), mm(-29), mm(114), mm(-38));
    p.quad(mm(105), mm(-47), mm(100), mm(-64));        // задняя грань рукоятки
    p.line(mm(86), mm(-106));
    p.quad(mm(79), mm(-134), mm(65), mm(-150));
    p.quad(mm(53), mm(-162), mm(37), mm(-159));        // пятка рукоятки
    p.quad(mm(21), mm(-156), mm(17), mm(-138));
    p.quad(mm(13), mm(-116), mm(15), mm(-94));         // передняя грань рукоятки
    p.line(mm(18), mm(-60));
    p.quad(mm(19), mm(-44), mm(26), mm(-40));
    p.line(mm(44), mm(-40));
    return p.done();
  })();
  // окно скелета: вытянутый овал, слегка наклонён вслед за гребнем
  // Важно: фаска расширяет окно на bevel во все стороны, поэтому сырой
  // контур берём с запасом: верхняя и нижняя ветви рамы должны остаться
  // толщиной ~15 мм, а не бумажными перемычками.
  var thumb = xf2d(roundRect(mm(104), mm(22), mm(11), 0, 0, 9), mm(200), mm(3), rad(2.0));
  add(exZYc(st, [thumb], mm(31), 0, { bevel: mm(7), steps: 5 }), MAT.woodG, body);
  // шейка приклада — лёгкий наплыв, чтобы рама не читалась фанеркой
  add(exZYc(roundRect(mm(52), mm(46), mm(20), mm(292), mm(6)), [], mm(34), 0, { bevel: mm(12), steps: 5 }), MAT.woodG, body);
  add(exZYc(roundRect(mm(74), mm(52), mm(22), mm(78), mm(-8)), [], mm(34), 0, { bevel: mm(12), steps: 5 }), MAT.woodG, body);
  // утолщение рукоятки + насечка на щёчках
  var gripSw = roundRect(mm(72), mm(100), mm(28), mm(54), mm(-100));
  add(exZYc(gripSw, [], mm(36), 0, { bevel: mm(10), steps: 5 }), MAT.woodG, body);
  add(both(xf(checkerPanel(mm(70), mm(56), mm(5.0), mm(0.7)),
    Mmuls(Mtrans(mm(17.2), mm(-102), mm(52)), MrotY(PI / 2), MrotZ(rad(21))))), MAT.woodD, body);
  // затыльник: стальная пластина с насечкой и два винта
  add(exXY(roundRect(mm(33), mm(50), mm(10), 0, mm(2)), [], mm(8), mm(316), { bevel: mm(2.0) }), MAT.blueS, body);
  add(xf(checkerPanel(mm(25), mm(40), mm(4.2), mm(0.5)), Mtrans(0, mm(2), mm(324.4))), MAT.blueS, body);
  add(screwX(mm(3.2), mm(1.6), 0, mm(20), mm(324.5), true), MAT.bright, body);
  add(screwX(mm(3.2), mm(1.6), 0, mm(-16), mm(324.5), true), MAT.bright, body);
  // антабка приклада снизу
  add(exZYc(roundRect(mm(16), mm(13), mm(3), mm(150), mm(-33)), [], mm(11), 0, { bevel: mm(1) }), MAT.blueS, body);
  add(xf(torusZ(mm(7.5), mm(1.9), 18, 10), Mmuls(Mtrans(0, mm(-41), mm(150)), MrotX(PI / 2))), MAT.blueS, body);

  /* ---------------- 11. УСМ: СКОБА, КРЮЧОК, ПРЕДОХРАНИТЕЛЬ ---------------- */
  add(exZYc(roundRect(mm(76), mm(42), mm(17), mm(-18), mm(-61)),
    [roundRect(mm(58), mm(27), mm(12), mm(-18), mm(-58))], mm(24), 0, { bevel: mm(2.2) }), MAT.blue, body);
  var trg = (function () {
    var p = new Path();
    p.move(mm(-8), mm(-42));
    p.line(mm(-17), mm(-42));
    p.quad(mm(-21), mm(-55), mm(-16.5), mm(-66));
    p.quad(mm(-12), mm(-73), mm(-6.5), mm(-67));
    p.quad(mm(-3.5), mm(-56), mm(-8), mm(-42));
    return p.done();
  })();
  add(exZYc(trg, [], mm(7.5), 0, { bevel: mm(1.4) }), MAT.bright, trig);
  // флажок предохранителя (справа, как у АК)
  var sfA = roundRect(mm(72), mm(15), mm(7), mm(-8), mm(-26));
  var sfB = roundRect(mm(19), mm(48), mm(8), mm(21), mm(-12));
  var sm = new Mesh();
  sm.merge(slabR(sfA, [], mm(4.6), mm(16)));
  sm.merge(slabR(sfB, [], mm(4.6), mm(16)));
  sm.merge(xf(boxRound(mm(2.4), mm(11), mm(11), mm(0.8), mm(0.4)), Mtrans(mm(21.8), mm(-12), mm(22))));
  add(sm, MAT.blueS, safety);

  /* ---------------- 12. МАГАЗИН НА 10 ПАТРОНОВ ----------------
     Штампованная стальная коробка под рантовый 7,62x54R. Ключевое:
     — тело ЦЕЛЬНОЕ и НЕПРОЗРАЧНОЕ (один замкнутый контур, а не набор пластин);
     — стенки почти параллельные (84 мм по верху / 74 мм по низу), а не клин;
     — дно горизонтальное, крышка сидит на нём вплотную, а не висит отдельно;
     — характерное X-образное ребро жёсткости — валик, выдавленный ПО СТЕНКЕ.
     Габарит корпуса: 25,4 мм ширины, 136 мм высоты. */
  var MZ = GEO.MAG_Z, MW = mm(25.4);
  var magProf = (function () {
    var p = new Path();
    p.move(MZ + mm(41), mm(-16));
    p.quad(MZ + mm(41), mm(-58), MZ + mm(37), mm(-98));   // задняя стенка
    p.quad(MZ + mm(33), mm(-130), MZ + mm(26), mm(-146));
    p.quad(MZ + mm(24), mm(-151), MZ + mm(19), mm(-152)); // задний нижний угол
    p.line(MZ - mm(55), mm(-152));                        // дно — горизонтальное
    p.quad(MZ - mm(60), mm(-152), MZ - mm(62), mm(-147)); // передний нижний угол
    p.quad(MZ - mm(64), mm(-108), MZ - mm(56), mm(-64));  // передняя стенка
    p.quad(MZ - mm(49), mm(-34), MZ - mm(43), mm(-16));
    return p.done();
  })();
  add(exZYc(magProf, [], MW, 0, { bevel: mm(3.2), steps: 4 }), MAT.blue, mag);

  /* X-образное ребро жёсткости — валик ПОВЕРХ стенки (без зазора),
     внизу — поперечный валик, как на штатном магазине. */
  var xr = new Mesh(), XC = MZ - mm(8), YC = mm(-86);
  [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(function (q) {
    var dz = q[0] * mm(29), dy = q[1] * mm(42);
    var an = Math.atan2(dy, -dz), L = Math.hypot(dz, dy);
    xr.merge(boxRound(L, mm(6.2), mm(2.4), mm(1.1), mm(1.1)),
      Mmuls(Mtrans(MW / 2 - mm(0.5), YC + dy / 2, XC + dz / 2), MrotX(an), MrotY(PI / 2)));
  });
  xr.merge(boxRound(mm(56), mm(5.4), mm(2.2), mm(1.0), mm(1.0)),
    Mmuls(Mtrans(MW / 2 - mm(0.5), mm(-136), MZ - mm(18)), MrotY(PI / 2)));
  add(both(xr), MAT.blue, mag);

  /* Отбортовка горловины и загибы-губки: окно между губками уже
     диаметра гильзы — именно они удерживают патроны в магазине. */
  add(exZYc(roundRect(mm(82), mm(14), mm(3.5), MZ, mm(-23)),
    [roundRect(mm(68), mm(7), mm(2.5), MZ, mm(-22))], mm(27.2), 0, { bevel: mm(1.2) }), MAT.blueS, mag);
  add(exZYc(roundRect(mm(68), mm(9), mm(3), MZ - mm(2), mm(-31)), [], mm(21), 0, { bevel: mm(1.4) }), MAT.dark, mag);
  add(xf(buildCartridge(), Mmuls(Mtrans(0, mm(-22), MZ + mm(36)), MrotY(PI))), MAT.brass, mag);

  /* Передний зацеп (ось доворота при посадке) и опорный выступ
     сзади под зуб защёлки. */
  add(exZYc(roundRect(mm(13), mm(12), mm(3), MZ - mm(46), mm(-27)), [], mm(18), 0, { bevel: mm(1.5) }), MAT.blueS, mag);
  add(exZYc(roundRect(mm(12), mm(15), mm(3), MZ + mm(44), mm(-34)), [], mm(18), 0, { bevel: mm(1.5) }), MAT.blueS, mag);

  /* Крышка (донная пластина) — обжимает дно снаружи, без зазора. */
  add(exZYc(roundRect(mm(80), mm(13), mm(4), MZ - mm(18), mm(-153)), [], mm(29), 0, { bevel: mm(2.0) }), MAT.blueS, mag);
  add(exZYc(roundRect(mm(70), mm(6), mm(2.5), MZ - mm(18), mm(-161)), [], mm(24), 0, { bevel: mm(1.2) }), MAT.blue, mag);

  /* ---------------- 13. ЗАТВОРНАЯ РАМА С РУКОЯТКОЙ ПЕРЕЗАРЯЖАНИЯ ---------------- */
  add(exZYc(roundRect(mm(152), mm(21), mm(3), mm(-134), mm(4)), [], mm(15), 0, { bevel: mm(1.4) }), MAT.bright, bolt);
  add(cylZ(mm(9.4), mm(58), 0, mm(4), mm(-212), 22), MAT.bright, bolt);
  add(exZYc(roundRect(mm(46), mm(15), mm(3), mm(-70), mm(6)), [], mm(24), 0, { bevel: mm(1.2) }), MAT.bright, bolt);
  // рукоятка перезаряжания — вправо, в паз коробки
  add(xf(boxRound(mm(16), mm(8), mm(15), mm(2.4), mm(1.0)), Mtrans(mm(18), mm(15), mm(-140))), MAT.blueS, bolt);
  add(xf(cyl(mm(6.4), mm(15), 20), Mmuls(Mtrans(mm(24), mm(15), mm(-140)), MrotY(PI / 2))), MAT.blueS, bolt);
  add(xf(knurlZ(mm(6.0), 0, mm(12), 12, mm(0.7), mm(1.1)), Mmuls(Mtrans(mm(31), mm(15), mm(-140)), MrotY(PI / 2))), MAT.blueS, bolt);
  add(xf(sphere(mm(6.4), 12), Mtrans(mm(39), mm(15), mm(-140))), MAT.blueS, bolt);

  /* ---------------- 14. БОКОВАЯ ПЛАНКА, КРОНШТЕЙН, ПСО-1 4×24 ---------------- */
  var SY = GEO.Y_OPT;
  // база («ласточкин хвост») на левой ��т��нке коробки
  var railP = (function () {
    var p = new Path();
    p.move(GEO.RAIL_Z0, mm(2));
    p.line(GEO.RAIL_Z1, mm(2));
    p.line(GEO.RAIL_Z1, mm(21));
    p.line(GEO.RAIL_Z0, mm(21));
    return p.done();
  })();
  add(mirX(slabR(railP, [], mm(9), mm(15.5), { bevel: mm(1.6) })), MAT.blue, body);
  add(mirX(slabR(roundRect(mm(96), mm(8), mm(2), mm(-101), mm(17)), [], mm(3), mm(24.5), { bevel: mm(0.8) })), MAT.blueS, body);

  /* --- кронштейн прицела (снимается вместе с ПСО-1) --- */
  var brk = (function () {
    var p = new Path();
    p.move(mm(-148), mm(6));
    p.line(mm(-40), mm(6));
    p.line(mm(-40), mm(30));
    p.quad(mm(-46), mm(56), mm(-74), mm(58));
    p.line(mm(-120), mm(58));
    p.quad(mm(-148), mm(56), mm(-148), mm(32));
    return p.done();
  })();
  add(mirX(slabR(brk, [roundRect(mm(48), mm(22), mm(9), mm(-92), mm(30))], mm(13), mm(14), { bevel: mm(1.6) })), MAT.paint, scope);
  // зажимной рычаг слева
  add(mirX(slabR(roundRect(mm(40), mm(13), mm(6), mm(-58), mm(14)), [], mm(6), mm(27), { bevel: mm(1.4) })), MAT.blueS, scope);
  add(xf(cyl(mm(5.5), mm(9), 18), Mmuls(Mtrans(mm(-30), mm(14), mm(-58)), MrotY(PI / 2))), MAT.blueS, scope);
  // два кольца обхвата трубы
  [mm(-128), mm(-52)].forEach(function (rz) {
    add(exXY(roundRect(mm(44), mm(42), mm(10), 0, SY), [ellipseRing(mm(15.3), mm(15.3), 0, SY, 26)],
      mm(15), rz, { bevel: mm(1.4) }), MAT.paint, scope);
  });
  // перемычка кольцо↔кронштейн
  add(mirX(slabR(roundRect(mm(112), mm(28), mm(8), mm(-90), mm(56)), [], mm(13), mm(14), { bevel: mm(1.6) })), MAT.paint, scope);

  /* --- корпус ПСО-1 --- */
  var tube = [
    [mm(84), 0], [mm(84), mm(20.5), true],                 // задний торец наглазника
    [mm(62), mm(22.5), true], [mm(60), mm(19.2), true],
    [mm(58), mm(19.2), true],
    [mm(56), mm(18.6), true], [mm(24), mm(18.6), true],     // окуляр
    [mm(22), mm(16.4), true], [mm(16), mm(16.4), true],
    [mm(14), mm(15.2), true],
    [mm(-104), mm(15.2), true],                             // труба
    [mm(-106), mm(17.4), true], [mm(-150), mm(17.4), true], // блок барабанчиков
    [mm(-152), mm(15.2), true],
    [mm(-214), mm(15.2), true],
    [mm(-220), mm(19.6), true],                             // раструб объектива
    [mm(-292), mm(19.6), true],
    [mm(-294), mm(21.4), true], [mm(-302), mm(21.4), true],
    [mm(-302), mm(17.6), true],                             // передний торец: обод
    [mm(-296), mm(17.6), true],
    [mm(-296), 0]
  ];
  add(xf(revolveZ(tube, 40, { smooth: 25 }), Mtrans(0, SY, 0)), MAT.paint, scope);
  // наглазник
  add(xf(revolveZ([[mm(58), mm(19.4), true], [mm(62), mm(22.8), true], [mm(84), mm(21.2), true],
  [mm(84), mm(17.4), true], [mm(60), mm(17.6), true], [mm(58), mm(19.4), true]], 32), Mtrans(0, SY, 0)), MAT.rubber, scope);
  // кольцо диоптрийной наводки с насечкой
  add(xf(knurlZ(mm(18.9), mm(28), mm(24), 30, mm(0.9), mm(1.5)), Mtrans(0, SY, 0)), MAT.paint, scope);
  // барабанчик вертикальных поправок (сверху) и боковых (справа)
  add(xf(revolveZ([[0, 0], [0, mm(15.8), true], [mm(20), mm(15.8), true], [mm(23), mm(13.4), true], [mm(23), 0]], 28),
    Mmuls(Mtrans(0, SY + mm(16), mm(-128)), MrotX(-PI / 2))), MAT.paint, scope);
  add(xf(knurlZ(mm(15.4), mm(3), mm(15), 28, mm(0.8), mm(1.3)), Mmuls(Mtrans(0, SY + mm(16), mm(-128)), MrotX(-PI / 2))), MAT.paint, scope);

/* =========================================================================
   ПРОЦЕД��РНЫЙ ЗВУКОВОЙ ДВИЖО��
   Ни одного чистого тона с длинным затуханием — только шумовые транзиенты,
   резонансные фильтры с негармоническими частотами и короткими спадами,
   нелинейное насыщение и свёртка — именно так звучит металл и выстрел.
   ========================================================================= */
/* ============================================================================
   ЗВУК — движок ORDNANCE. Публичный API этого файла не изменился: наружу
   выставлены ровно те же имена, что вызывались раньше, поэтому ни одна точка
   вызова не тронута. Изменилась только реализация.

   Раньше: граф WebAudio на каждый выстрел, низ которого вели
   осцилляторы с разгоном 152->43 Гц. Синусоида — это тон; детектор
   тональности даёт прежнему выстрелу 3.43 при пороге 2.10, и его худшие
   полосы 3200/4525/5382 Гц — это и есть та самая синусоида с гармониками.
   Фронт задавался exponentialRampToValueAtTime: замеренное нарастание
   396 мкс, тогда как у настоящей дульной волны 15-30 мкс.

   Теперь: сэмпл, просчитанный заранее по модели идеального взрыва. Постоянная
   времени tau выведена из массы пороха, диаметра канала ствола и его длины;
   спектральный максимум волны Фридлендера равен 1/(2*pi*tau) точно, поэтому
   тембр выбирает физика заряда, а не подбор на слух. Фронт — разрыв на один
   отсчёт. Замерено: нарастание 42 мкс, тональность 1.32. Ни одного
   осциллятора в файле.

   Комната — одна общая импульсная характеристика через ConvolverNode:
   запекание отражений в каждый сэмпл стоило 80 мс из 101 мс на выстрел и
   подвешивало первый спуск на четверть секунды.
   ========================================================================== */
var ORD = new Ordnance('svd', {
  env: 'range',
  mech: ['boltBack', 'boltRelease', 'dryFire', 'knifeHit', 'magIn', 'magOut', 'safety'],
  gain: 0.4,

var AU = {
  on: true,
  get ctx() { return ORD.ctx; },
  get ready() { return !!ORD.ctx; },
  get muted() { return !AU.on; },
    bus: null,
    echoSend: null,
  init: function () { var c = ORD.init(); ORD.setMuted(!AU.on); return !!c; },
  resume: function () { ORD.resume(); },
  now: function (d) { return (ORD.ctx ? ORD.ctx.currentTime : 0) + (d || 0); },
  setMuted: function (m) { AU.on = !m; if (ORD.ctx) ORD.setMuted(!!m); },
  setEnabled: function (e) { AU.setMuted(!e); },
    cloth: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("magOut", { gain: 0.18 }); },
    dryFire: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("dryFire", { gain: 1.0 }); },
    impact: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("knifeHit", { gain: 1.0 }); },
    magRattle: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("magOut", { gain: 0.3 }); },
    metal: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("knifeHit", { gain: 0.8 }); },
    rattle: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("magOut", { gain: 0.144 }); },
    reload: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("magIn", { gain: 1.0 }); },
    safety: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("safety", { gain: 1.0 }); },
    scrape: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("magOut", { gain: 0.126 }); },
    setAmbience: function () { },
    setEnv: function () { },
    shell: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("boltRelease", { gain: 0.315 }); },
    shellLand: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("boltRelease", { gain: 0.245 }); },

    spring: function () { if (!ORD_SELF.on) return; ORD_SELF.init(); ORD.mech("boltBack", { gain: 0.4 }); },
    startAmbience: function () { },

/* ================= ОКРУЖЕНИЕ, МИШЕНИ, ЧАСТИЦЫ, ГИЛЬЗЫ ================= */
var GROUND_Y = -1.55;
var TARGETS = [];

function buildEnvironment(add, N) {
  /* ---- земля ---- */
  var g = new Mesh(), S = 700, SEG = 36;
  for (var i = 0; i < SEG; i++) for (var j = 0; j < SEG; j++) {
    var x0 = -S / 2 + S * i / SEG, x1 = -S / 2 + S * (i + 1) / SEG;
    var z0 = -S * 0.78 + S * j / SEG, z1 = -S * 0.78 + S * (j + 1) / SEG;
    function hgt(x, z) {
      var d = Math.hypot(x, z + 60);
      return Math.sin(x * 0.055) * 0.22 + Math.cos(z * 0.041) * 0.28 + Math.sin((x + z) * 0.017) * 0.55
        - Math.exp(-d * d / 9000) * 0.4;
    }
    // аналитическая нормаль рельефа: без неё земля выглядит плоским серым листом
    function nrm(x, z) {
      var e = 0.75;
      var dx = (hgt(x + e, z) - hgt(x - e, z)) / (2 * e);
      var dz = (hgt(x, z + e) - hgt(x, z - e)) / (2 * e);
      var L = Math.sqrt(dx * dx + 1 + dz * dz);
      return [-dx / L, 1 / L, -dz / L];
    }
    var na = nrm(x0, z0), nb = nrm(x1, z0), nc = nrm(x1, z1), nd = nrm(x0, z1);
    var a = g.v(x0, GROUND_Y + hgt(x0, z0), z0, na[0], na[1], na[2], x0 * 0.1, z0 * 0.1);
    var b = g.v(x1, GROUND_Y + hgt(x1, z0), z0, nb[0], nb[1], nb[2], x1 * 0.1, z0 * 0.1);
    var c = g.v(x1, GROUND_Y + hgt(x1, z1), z1, nc[0], nc[1], nc[2], x1 * 0.1, z1 * 0.1);
    var d2 = g.v(x0, GROUND_Y + hgt(x0, z1), z1, nd[0], nd[1], nd[2], x0 * 0.1, z1 * 0.1);
    g.tri(a, b, c); g.tri(a, c, d2);
  }
  add(g, MAT.ground, N.range, { shadow: false });

  /* ---- дальние холмы ---- */
  var hills = new Mesh();
  for (var h = 0; h < 9; h++) {
    var ang = -1.35 + h * 0.34 + Math.sin(h * 5.1) * 0.06;
    var dist = 620 + Math.sin(h * 3.7) * 180;
    var hx = Math.sin(ang) * dist, hz = -Math.cos(ang) * dist;
    var hh = 55 + Math.sin(h * 2.3) * 30, hr = 210 + Math.cos(h * 1.7) * 90;
    var m = new Mesh(), rings = 6, seg = 20;
    for (var r = 0; r <= rings; r++) {
      for (var s = 0; s <= seg; s++) {
        var t = r / rings, aa = s / seg * TAU;
        var rad2 = hr * (1 - t * t * 0.92);
        var y = hh * Math.sin(t * PI * 0.5) * (0.85 + 0.3 * Math.sin(aa * 3 + h));
        m.v(Math.cos(aa) * rad2 * (1 + 0.18 * Math.sin(aa * 2.7 + h)), y - 12, Math.sin(aa) * rad2 * (1 + 0.14 * Math.cos(aa * 3.1)), 0, 1, 0, s / seg, t);
      }
    }
    for (r = 0; r < rings; r++) for (s = 0; s < seg; s++) {
      var i0 = r * (seg + 1) + s, i1 = i0 + 1, i2 = i0 + seg + 1, i3 = i2 + 1;
      m.tri(i0, i2, i1); m.tri(i1, i2, i3);
    }
    hills.merge(m, Mtrans(hx, GROUND_Y, hz));
  }
  add(hills, new Mat({ base: hex(0x3c4432), metal: 0, rough: 1.0, kind: 7, wear: 0 }), N.range, { shadow: false });

  /* ---- мишени ---- */
  var dists = [100, 200, 300, 400];
  dists.forEach(function (d, idx) {
    var node = N['target' + idx];
    var scale = 1 + idx * 0.30;
    var w = 0.62 * scale, hh2 = 0.62 * scale;
    var post = new Mesh();
    post.merge(xf(boxRound(0.075, 1.25, 0.075, 0.02, 0.008), Mtrans(-w * 0.36, GROUND_Y + 0.62, 0)));
    post.merge(xf(boxRound(0.075, 1.25, 0.075, 0.02, 0.008), Mtrans(w * 0.36, GROUND_Y + 0.62, 0)));
    post.merge(xf(boxRound(w * 1.1, 0.06, 0.05, 0.015, 0.006), Mtrans(0, GROUND_Y + 1.16, 0)));
    add(post, MAT.woodPost, node, { shadow: idx < 2 });
    var board = exXY(roundRect(w, hh2, 0.03, 0, GROUND_Y + 1.52), [], 0.028, 0.014, { bevel: 0.006 });
    add(board, MAT.paper, node, { shadow: idx < 2 });
    // чёрные концентрические кольца
    var rings2 = new Mesh();
    for (var k = 0; k < 4; k++) {
      var ro = (0.235 - k * 0.052) * scale, ri = (0.205 - k * 0.052) * scale;
      if (ri <= 0.004) break;
      rings2.merge(exXY(ellipseRing(ro, ro, 0, GROUND_Y + 1.52, 40), [ellipseRing(ri, ri, 0, GROUND_Y + 1.52, 40)], 0.002, 0.012));
    }
    rings2.merge(exXY(ellipseRing(0.030 * scale, 0.030 * scale, 0, GROUND_Y + 1.52, 24), [], 0.002, 0.012));
    add(rings2, MAT.paperB, node, { shadow: false });
    // табличка с дистанцией
    add(exXY(roundRect(0.26, 0.10, 0.02, 0, GROUND_Y + 1.10), [], 0.02, 0.02), MAT.paperB, node, { shadow: false });
    TARGETS.push({ node: node, z: -d, dist: d, w: w, h: hh2, cy: GROUND_Y + 1.52, scale: scale });
  });

  /* ---- стол для студийного режима ---- */
  var tbl = new Mesh();
  tbl.merge(xf(boxRound(3.4, 0.05, 2.0, 0.02, 0.006), Mtrans(0, -0.30, 0)));
  add(tbl, new Mat({ base: hex(0x1a1a1d), metal: 0.05, rough: 0.62, kind: 4, wear: 0 }), N.studio, { shadow: false });
}

var PS = {
  list: [],
  spawn: function (o) {
    if (this.list.length > 420) this.list.shift();
    this.list.push({
      p: [o.p[0], o.p[1], o.p[2]], v: o.v || [0, 0, 0], size: o.size || 0.1, size1: o.size1 === undefined ? o.size : o.size1,
      life: o.life || 1, age: 0, type: o.type || 0, col: o.col || [1, 1, 1], a0: o.a0 === undefined ? 1 : o.a0,
      rot: Math.random() * TAU, rotV: (Math.random() - 0.5) * (o.spin || 1.2), drag: o.drag === undefined ? 1.6 : o.drag,
      grav: o.grav === undefined ? 0 : o.grav, seed: Math.random() * 10, fade: o.fade || 1, add: o.add !== false
    });
  },
  update: function (dt) {
    for (var i = this.list.length - 1; i >= 0; i--) {
      var p = this.list[i];
      p.age += dt;
      if (p.age >= p.life) { this.list.splice(i, 1); continue; }
      var k = Math.exp(-p.drag * dt);
      p.v[0] *= k; p.v[1] = p.v[1] * k + p.grav * dt; p.v[2] *= k;
      p.p[0] += p.v[0] * dt; p.p[1] += p.v[1] * dt; p.p[2] += p.v[2] * dt;
      p.rot += p.rotV * dt;
    }
  },
  draw: function (vp, camPos, right, up) {
    if (!this.list.length) return;
    var p = R.pPart;
    gl.useProgram(p);
    gl.uniformMatrix4fv(p.u.uVP, false, vp);
    gl.uniform3fv(p.u.uRight, right); gl.uniform3fv(p.u.uUp, up);
    gl.bindVertexArray(R.partVao);
    gl.enable(gl.BLEND); gl.depthMask(false);
    var l = this.list.slice().sort(function (a, b) {
      var da = (a.p[0] - camPos[0]) * (a.p[0] - camPos[0]) + (a.p[1] - camPos[1]) * (a.p[1] - camPos[1]) + (a.p[2] - camPos[2]) * (a.p[2] - camPos[2]);
      var db = (b.p[0] - camPos[0]) * (b.p[0] - camPos[0]) + (b.p[1] - camPos[1]) * (b.p[1] - camPos[1]) + (b.p[2] - camPos[2]) * (b.p[2] - camPos[2]);
      return db - da;
    });
    for (var i = 0; i < l.length; i++) {
      var q = l[i], t = q.age / q.life;
      var a = q.a0 * Math.pow(1 - t, q.fade);
      if (a <= 0.002) continue;
      gl.blendFunc(gl.SRC_ALPHA, q.add ? gl.ONE : gl.ONE_MINUS_SRC_ALPHA);
      gl.uniform3fv(p.u.uCenter, q.p);
      gl.uniform1f(p.u.uSize, q.size + (q.size1 - q.size) * t);
      gl.uniform1f(p.u.uRot, q.rot);
      gl.uniform1f(p.u.uSeed, q.seed);
      gl.uniform1i(p.u.uType, q.type);
      gl.uniform4f(p.u.uCol, q.col[0], q.col[1], q.col[2], a);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }
    gl.depthMask(true); gl.disable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  },
  muzzleBurst: function (pos, dir, up, right) {
    var e = function (s) { return [pos[0] + dir[0] * s, pos[1] + dir[1] * s, pos[2] + dir[2] * s]; };
    this.spawn({ p: e(0.06), size: 0.30, size1: 0.42, life: 0.055, type: 0, col: [1, 0.8, 0.5], a0: 1.0, drag: 4, fade: 1.6 });
    this.spawn({ p: e(0.16), size: 0.16, size1: 0.30, life: 0.075, type: 0, col: [1, 0.7, 0.35], a0: 0.75, drag: 4, fade: 2 });
    for (var i = 0; i < 16; i++) {
      var sp = 2.5 + Math.random() * 7;
      var sc = 0.30 + Math.random() * 0.7;
      this.spawn({
        p: e(0.02 + Math.random() * 0.05),
        v: [dir[0] * sp + (Math.random() - 0.5) * 2.2, dir[1] * sp + (Math.random() - 0.5) * 2.2, dir[2] * sp + (Math.random() - 0.5) * 2.2],
        size: 0.008 + Math.random() * 0.016, size1: 0.004, life: 0.10 + Math.random() * 0.34, type: 2,
        col: [1, 0.62 + Math.random() * 0.3, 0.25], a0: 1.0, drag: 2.2, grav: -5, fade: 1.4
      });
    }
    for (i = 0; i < 9; i++) {
      this.spawn({
        p: e(0.05 + Math.random() * 0.22),
        v: [dir[0] * (1.6 + Math.random() * 2.6) + (Math.random() - 0.5) * 0.9, 0.35 + Math.random() * 0.6, dir[2] * (1.6 + Math.random() * 2.6) + (Math.random() - 0.5) * 0.9],
        size: 0.05 + Math.random() * 0.06, size1: 0.42 + Math.random() * 0.4, life: 0.9 + Math.random() * 1.5, type: 1,
        col: [0.52, 0.51, 0.49], a0: 0.30, drag: 1.5, grav: 0.22, fade: 1.7, add: false, spin: 0.6
      });
    }
  },
  dustKick: function (pos, dir) {
    for (var i = 0; i < 12; i++) {
      this.spawn({

        v: [dir[0] * (0.6 + Math.random() * 2.4) + (Math.random() - 0.5), 0.4 + Math.random() * 0.9, dir[2] * (0.6 + Math.random() * 2.4) + (Math.random() - 0.5)],
        size: 0.06 + Math.random() * 0.08, size1: 0.5 + Math.random() * 0.5, life: 0.7 + Math.random() * 1.0, type: 1,
        col: [0.42, 0.38, 0.29], a0: 0.4, drag: 1.9, grav: -0.35, fade: 1.6, add: false

  hitPuff: function (pos, nrm, kind) {
    var col = kind === 'steel' ? [0.9, 0.85, 0.8] : [0.62, 0.56, 0.44];

        size: 0.03 + Math.random() * 0.05, size1: 0.28 + Math.random() * 0.3, life: 0.5 + Math.random() * 0.8, type: 1,
        col: col, a0: 0.45, drag: 2.2, grav: -1.2, fade: 1.5, add: false
      });
    }
    if (kind === 'steel') for (i = 0; i < 12; i++) {
      this.spawn({

        size: 0.006, size1: 0.002, life: 0.3 + Math.random() * 0.5, type: 2, col: [1, 0.75, 0.35], a0: 1, drag: 1.2, grav: -9, fade: 1.2
      });
    }
  }
};

function buildCase() {
  var m = new Mesh();
  m.merge(revolveZ([
    [0, 0], [0, mm(6.7), true], [mm(1.6), mm(6.9), true], [mm(2.4), mm(6.2), true],
    [mm(4.2), mm(6.2), true], [mm(4.8), mm(5.9)], [mm(38), mm(5.85)],
    [mm(43), mm(5.6)], [mm(46.5), mm(4.2)], [mm(48.5), mm(3.95), true], [mm(53.5), mm(3.92), true],
    [mm(53.5), mm(3.35), true], [mm(46), mm(3.5)], [mm(6), mm(5.3), true], [mm(6), 0]
  ], 26));
  return m;
}
function ejectShell(pos, vel, spin) {
  var s = SHELLS.pool[SHELLS.idx % SHELLS.pool.length]; SHELLS.idx++;
  s.alive = true; s.batch.visible = true; s.t = 0; s.landed = 0;
  s.p = [pos[0], pos[1], pos[2]];
  s.v = [vel[0], vel[1], vel[2]];
  s.q = [Math.random() * TAU, Math.random() * TAU, Math.random() * TAU];
  s.w = [(Math.random() - 0.5) * spin, (Math.random() - 0.5) * spin * 0.6, (Math.random() - 0.5) * spin];
  return s;
}
function updateShells(dt) {
  for (var i = 0; i < SHELLS.pool.length; i++) {
    var s = SHELLS.pool[i];
    if (!s.alive) continue;
    s.t += dt;
    if (s.t > 7) { s.alive = false; s.batch.visible = false; continue; }
    if (s.landed < 3) {
      s.v[1] -= 9.81 * dt;
      s.p[0] += s.v[0] * dt; s.p[1] += s.v[1] * dt; s.p[2] += s.v[2] * dt;
      s.q[0] += s.w[0] * dt; s.q[1] += s.w[1] * dt; s.q[2] += s.w[2] * dt;
      var floor = GROUND_Y + 0.012;
      if (s.p[1] < floor) {
        s.p[1] = floor; s.landed++;
        s.v[1] = -s.v[1] * 0.34; s.v[0] *= 0.6; s.v[2] *= 0.6;
        s.w[0] *= 0.5; s.w[1] *= 0.5; s.w[2] *= 0.5;
        if (s.landed === 1) AU.shellLand();
        if (Math.abs(s.v[1]) < 0.35) { s.landed = 3; s.q[0] = PI / 2; s.w = [0, 0, 0]; }
      }
    }
    Mmuls2(s.node.local, Mtrans(s.p[0], s.p[1], s.p[2]), MrotY(s.q[1]), MrotX(s.q[0]), MrotZ(s.q[2]), Mtrans(0, 0, -mm(27)));
  }
}
